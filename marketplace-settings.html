<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketplace Settings — GrabZone</title><link rel="stylesheet" href="/vendor.css"><script src="/d1-client.js"></script><script src="/marketplace-auth.js?v=20260921-auth2"></script></head><body><header class="gz-top"><div class="gz-logo">Grab<span>Zone</span> <small style="font-size:10px;color:#aaa;letter-spacing:1px">MARKETPLACE SETTINGS</small></div><a class="gz-btn light" href="/vendor-admin.html">← Marketplace Admin</a></header><main class="gz-main"><div class="gz-card"><h1>Marketplace Settings</h1><p style="color:#777">Main GrabZone customer delivery charge. Default is ৳130 and can be changed here. Vendor delivery charges are managed separately per vendor.</p><form id="f" class="gz-form"><label><input id="enabled" type="checkbox"> Marketplace enabled</label><label><input id="show_brands" type="checkbox"> Show brands on storefront</label><label><input id="show_vendor_badges" type="checkbox"> Show vendor badges</label><div class="gz-field"><label>Default shipping fee</label><input id="default_shipping" type="number" min="0"></div><button class="gz-btn primary">Save Settings</button><span id="msg" style="margin-left:10px;color:#777"></span></form></div><div class="gz-card" style="margin-top:16px"><h2>Categories</h2><div id="cats"><span style="color:#777">No categories yet.</span></div><form id="cat" class="gz-form" style="margin-top:14px"><div class="gz-field"><label>New category</label><input id="catname" required placeholder="Electronics"><small style="display:block;color:#777;margin-top:6px">Slug will be generated automatically.</small></div><button class="gz-btn light">Add Category</button></form></div></main><script>
const $=s=>document.querySelector(s);
async function api(p,o={}){
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(),8000);
  try{
    const r=await fetch(p,{credentials:'include',cache:'no-store',signal:ctl.signal,...o,headers:{'Content-Type':'application/json',...(o.headers||{})}});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw Error(d.error||('Request failed ('+r.status+')'));
    return d;
  }finally{clearTimeout(timer)}
}
function errText(e){return e?.name==='AbortError'?'Request timed out. Please refresh and try again.':(e?.message||'Request failed')}
async function loadSettings(){
  try{
    const d=await api('/api/vendor/admin/settings');
    const s=d.settings||{};
    $('#enabled').checked=!!s.enabled;
    $('#show_brands').checked=!!s.show_brands;
    $('#show_vendor_badges').checked=!!s.show_vendor_badges;
    $('#default_shipping').value=Number(s.default_shipping??130);
  }catch(e){
    $('#msg').textContent=errText(e);
  }
}
async function loadCategories(){
  const box=$('#cats');
  box.textContent='Loading…';
  try{
    const d=await api('/api/vendor/admin/categories');
    box.innerHTML=(d.categories||[]).map(x=>'<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #eee"><div style="min-width:0"><b>'+escHtml(x.name)+'</b><div style="color:#777;font-size:12px;margin-top:2px">'+escHtml(x.slug)+'</div></div><button type="button" class="gz-btn light gz-cat-delete" data-id="'+escHtml(x.id)+'" data-name="'+escHtml(x.name)+'" style="color:#a11;border-color:#e5caca">Delete</button></div>').join('')||'<span style="color:#777">No categories yet.</span>';
  }catch(e){
    box.innerHTML='<span style="color:#a11">'+escError(e)+'</span>';
  }
}
function escHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function escError(e){return escHtml(errText(e))}
$('#cats').addEventListener('click',async e=>{
  const btn=e.target.closest('.gz-cat-delete');
  if(!btn)return;
  const id=btn.dataset.id,name=btn.dataset.name||'this category';
  if(!id)return;
  if(!confirm('Delete category "'+name+'"? Products using it will be moved to General.'))return;
  const old=btn.textContent;btn.disabled=true;btn.textContent='Deleting…';
  try{
    await api('/api/vendor/admin/categories',{method:'DELETE',body:JSON.stringify({id})});
    await loadCategories();
  }catch(x){alert(errText(x));btn.disabled=false;btn.textContent=old}
});
$('#f').onsubmit=async e=>{
  e.preventDefault();
  const b=e.target.querySelector('button'),old=b.textContent;
  b.disabled=true;b.textContent='Saving…';
  try{
    await api('/api/vendor/admin/settings',{method:'PATCH',body:JSON.stringify({
      enabled:$('#enabled').checked,
      show_brands:$('#show_brands').checked,
      show_vendor_badges:$('#show_vendor_badges').checked,
      default_shipping:Number($('#default_shipping').value)
    })});
    $('#msg').textContent='Saved ✓';
  }catch(x){$('#msg').textContent=errText(x)}
  finally{b.disabled=false;b.textContent=old}
};
$('#cat').onsubmit=async e=>{
  e.preventDefault();
  const btn=e.target.querySelector('button'),old=btn.textContent;
  btn.disabled=true;btn.textContent='Saving…';
  try{
    const d=await api('/api/vendor/admin/categories',{method:'POST',body:JSON.stringify({name:$('#catname').value})});if(!d?.ok)throw Error(d?.error||'Category could not be saved.');
    e.target.reset();
    await loadCategories();
  }catch(x){alert(errText(x))}
  finally{btn.disabled=false;btn.textContent=old}
};
loadSettings();
loadCategories();
</script></body></html>
