<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketplace Settings — GrabZone</title><link rel="stylesheet" href="/vendor.css"><script src="/d1-client.js"></script><script src="/marketplace-auth.js"></script></head><body><header class="gz-top"><div class="gz-logo">Grab<span>Zone</span> <small style="font-size:10px;color:#aaa;letter-spacing:1px">MARKETPLACE SETTINGS</small></div><a class="gz-btn light" href="/vendor-admin.html">← Marketplace Admin</a></header><main class="gz-main"><div class="gz-card"><h1>Marketplace Settings</h1><p style="color:#777">Main GrabZone customer delivery charge. Default is ৳130 and can be changed here. Vendor delivery charges are managed separately per vendor.</p><form id="f" class="gz-form"><label><input id="enabled" type="checkbox"> Marketplace enabled</label><label><input id="show_brands" type="checkbox"> Show brands on storefront</label><label><input id="show_vendor_badges" type="checkbox"> Show vendor badges</label><div class="gz-field"><label>Default shipping fee</label><input id="default_shipping" type="number" min="0"></div><button class="gz-btn primary">Save Settings</button><span id="msg" style="margin-left:10px;color:#777"></span></form></div><div class="gz-card" style="margin-top:16px"><h2>Categories</h2><div id="cats">Loading…</div><form id="cat" class="gz-form" style="margin-top:14px"><div class="gz-field"><label>New category</label><input id="catname" required placeholder="Electronics"><small style="display:block;color:#777;margin-top:6px">Slug will be generated automatically.</small></div><button class="gz-btn light">Add Category</button></form></div></main><script>const $=s=>document.querySelector(s);async function api(p,o={}){const r=await fetch(p,{credentials:'include',...o,headers:{'Content-Type':'application/json',...(o.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){const d=await api('/api/vendor/admin/settings').catch(()=>({settings:{}}));const s=d.settings||{};$('#enabled').checked=!!s.enabled;$('#show_brands').checked=!!s.show_brands;$('#show_vendor_badges').checked=!!s.show_vendor_badges;const ship=await api('/api/marketplace/shipping-settings');$('#default_shipping').value=Number(ship.global_shipping_fee??130);const c=await api('/api/vendor/admin/categories');$('#cats').innerHTML=(c.categories||[]).map(x=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee"><b>${x.name}</b><span style="color:#777">${x.slug}</span></div>`).join('')||'<span style="color:#777">No categories yet.</span>'}$('#f').onsubmit=async e=>{e.preventDefault();try{await api('/api/marketplace/shipping-settings',{method:'PATCH',body:JSON.stringify({global_shipping_fee:Number($('#default_shipping').value)})});$('#msg').textContent='Saved ✓'}catch(x){$('#msg').textContent=x.message}};$('#cat').onsubmit=async e=>{e.preventDefault();try{await api('/api/vendor/admin/categories',{method:'POST',body:JSON.stringify({name:$('#catname').value})});e.target.reset();load()}catch(x){alert(x.message)}};load().catch(e=>{alert(e.message);location.href='/admin.html'})</script></body></html>
