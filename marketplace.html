<title>GrabZone Marketplace</title>

<style>html,body{margin:0;padding:0;background:#fff;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}#marketplace-app{min-height:100vh}
/* Marketplace visual system */
.mp-page{background:#f7f6f3!important;color:#15191f!important}
.mp-header{background:rgba(255,255,255,.97)!important;border-bottom:1px solid #e8e4de!important;box-shadow:0 2px 14px rgba(20,20,20,.035)!important}
.mp-top{max-width:1440px!important;padding:18px 32px!important;gap:24px!important}.mp-logo{font-size:26px!important;gap:10px!important}.mp-logo img{width:44px!important;height:44px!important}.mp-logo span{color:#f25b0a!important}.mp-search{height:50px!important;max-width:760px!important;border-color:#d9d5ce!important;border-radius:14px!important;background:#faf9f7!important}.mp-search input{font-size:14px!important;padding:0 18px!important}.mp-search button{width:56px!important;background:#11151a!important;font-size:21px!important}.mp-rewards,.mp-cart{height:44px!important;padding:0 18px!important;font-size:12px!important;border-radius:999px!important}.mp-cart{background:#ff650b!important;border-color:#ff650b!important}.mp-links{max-width:1440px!important;padding:0 32px 15px!important;gap:32px!important}.mp-links a{font-size:12px!important}.mp-notice{height:44px!important;background:#101419!important;font-size:12px!important}.mp-notice b{height:44px!important;padding:0 28px!important;background:#ff650b!important;font-size:10px!important}.mp-notice span{padding-left:24px!important;color:#e4e4e4!important}
.mp-title{max-width:1440px!important;padding:72px 32px 42px!important;gap:40px!important}.mp-title small{font-size:10px!important;letter-spacing:.22em!important}.mp-title h1{font-size:72px!important;letter-spacing:-.065em!important;margin:11px 0 14px!important}.mp-title p{max-width:720px!important;font-size:15px!important;line-height:1.65!important;color:#737981!important}.mp-count{min-width:180px!important;padding:22px 26px!important;border-radius:18px!important;border-color:#e4ded6!important;box-shadow:0 8px 24px rgba(31,24,17,.045)!important}.mp-count strong{font-size:38px!important;color:#11151a!important}.mp-count span{font-size:10px!important;color:#777!important}
.mp-layout{max-width:1440px!important;padding:0 32px 90px!important;grid-template-columns:230px minmax(0,1fr)!important;gap:30px!important}.mp-sidebar{border-color:#e4ded6!important;border-radius:18px!important;padding:22px!important;top:155px!important;box-shadow:0 8px 26px rgba(31,24,17,.045)!important}.mp-sidebar h3{font-size:15px!important;margin-bottom:15px!important}.mp-brand{padding:12px 13px!important;border-radius:10px!important;font-size:11px!important}.mp-brand:hover{background:#fff0e7!important;color:#e95006!important}.mp-brand.active{background:#11151a!important;color:#fff!important}.mp-vendor-link{font-size:10px!important;margin-top:20px!important;padding-top:18px!important;color:#ef5708!important}
.mp-results-head{margin-bottom:20px!important}.mp-results-head b{font-size:21px!important}.mp-results-head small{font-size:10px!important;margin-top:5px!important}.mp-results-head select{padding:11px 13px!important;border-radius:10px!important;border-color:#dcd7d0!important;background:#fff!important;font-size:11px!important}
/* Five product cards across on wide desktop displays. */
.mp-products{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:18px!important}.mp-product{border-color:#e3ded7!important;border-radius:17px!important;box-shadow:0 5px 18px rgba(30,24,18,.035)!important}.mp-product:hover{transform:translateY(-5px)!important;box-shadow:0 18px 40px rgba(20,20,20,.10)!important;border-color:#f3b18c!important}.mp-image{background:linear-gradient(145deg,#f3f2ef,#fbfaf8)!important}.mp-image img{aspect-ratio:1/1!important;padding:4px!important}.mp-product-info{padding:14px!important}.mp-product-info small{padding:5px 8px!important;font-size:8px!important;background:#fff0e7!important;color:#ed5608!important}.mp-product-info>a{font-size:12px!important;line-height:1.42!important;margin:9px 0 14px!important;min-height:36px!important}.mp-product-info strong{font-size:16px!important;color:#11151a!important}.mp-product-info button{border-radius:8px!important;background:#11151a!important;padding:9px 10px!important;font-size:8px!important}.mp-footer{padding:44px!important;font-size:10px!important;background:#fff!important;border-top-color:#e6e1db!important}
@media(max-width:1200px){.mp-top,.mp-links,.mp-title,.mp-layout{max-width:1160px!important}.mp-products{grid-template-columns:repeat(4,minmax(0,1fr))!important}.mp-layout{grid-template-columns:220px minmax(0,1fr)!important}.mp-title h1{font-size:62px!important}}
@media(max-width:900px){.mp-products{grid-template-columns:repeat(2,minmax(0,1fr))!important}.mp-layout{grid-template-columns:190px minmax(0,1fr)!important;gap:22px!important}.mp-top{padding-inline:20px!important}.mp-links{padding-inline:20px!important}}
@media(max-width:700px){.mp-top{padding:11px 14px!important}.mp-logo{font-size:22px!important}.mp-logo img{width:38px!important;height:38px!important}.mp-search{height:46px!important}.mp-links{padding:0 14px 12px!important;gap:18px!important}.mp-notice{height:40px!important}.mp-notice b{height:40px!important;padding:0 17px!important}.mp-title{padding:42px 14px 28px!important}.mp-title h1{font-size:44px!important}.mp-title p{font-size:12px!important}.mp-count{min-width:140px!important;padding:16px 20px!important}.mp-layout{padding:0 14px 55px!important;display:block!important}.mp-sidebar{display:flex!important;overflow:auto!important;position:static!important;margin-bottom:22px!important;padding:10px!important;gap:7px!important}.mp-sidebar h3,.mp-vendor-link{display:none!important}.mp-brand{width:auto!important;white-space:nowrap!important;padding:9px 12px!important}.mp-products{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important}.mp-product-info{padding:12px!important}.mp-product-info>a{font-size:11px!important;min-height:32px!important}.mp-product-info strong{font-size:14px!important}.mp-product-info button{padding:8px 9px!important;font-size:8px!important}}
</style>
