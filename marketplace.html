<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GrabZone Marketplace</title><link rel="stylesheet" href="/vendor.css"><style>body{background:#fff}.wrap{max-width:1200px;margin:auto;padding:28px 18px}.hero{background:#111;color:#fff;border-radius:28px;padding:42px 34px;margin-bottom:22px}.hero h1{font-size:clamp(34px,6vw,68px);letter-spacing:-3px;margin:0}.brands{display:flex;gap:10px;overflow:auto;padding:5px 0 18px}.brand{flex:0 0 auto;border:1px solid #e6e6eb;background:#fff;border-radius:999px;padding:10px 15px;font-weight:850;cursor:pointer}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.product{border:1px solid #e8e8ed;border-radius:18px;overflow:hidden;background:#fff}.product img{width:100%;aspect-ratio:1;object-fit:cover;background:#f4f4f6}.product .p{padding:14px}.brandtag{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#ff6b00;font-weight:900}.price{font-size:19px;font-weight:950;margin-top:6px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.tools a,.add{background:#111;color:#fff;text-decoration:none;border-radius:999px;padding:11px 15px;font-weight:900;border:0;cursor:pointer}.add{width:100%;margin-top:12px}@media(max-width:900px){.products{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.products{grid-template-columns:repeat(2,1fr)}.hero{padding:30px 22px}}</style></head><body data-gz-loader-wait><div class="wrap"><section class="hero"><div style="font-weight:950;letter-spacing:3px;color:#ff6b00">GRABZONE MARKETPLACE</div><h1>More brands.<br>One GrabZone.</h1><p style="color:#bbb;max-width:650px;line-height:1.7">Shop products from independent brands through one checkout, one GrabZone membership and one order tracking experience.</p><div class="tools"><a href="/track-order.html">Track an order →</a><a href="/">Back to GrabZone</a><a href="/checkout.html">Checkout →</a></div></section><h2>Shop by Brand</h2><div id="brands" class="brands"></div><div style="display:flex;justify-content:space-between;align-items:center;margin:18px 0"><h2 style="margin:0">All Products</h2><span id="cartCount" style="font-weight:800;color:#777"></span></div><div id="products" class="products"></div></div><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=n=>'৳'+Number(n||0).toLocaleString('en-BD');function readCart(){try{const x=JSON.parse(localStorage.getItem('grabzone_cart_v2')||'[]');return Array.isArray(x)?x:[]}catch{return[]}}function writeCart(x){localStorage.setItem('grabzone_cart_v2',JSON.stringify(x));updateCart()}function updateCart(){const n=readCart().reduce((s,x)=>s+Number(x.quantity||1),0);document.querySelector('#cartCount').textContent=n?`${n} item${n>1?'s':''} in cart`:''}function add(p){const cart=readCart(),id=String(p.id),found=cart.find(x=>String(x.product_id||x.id)===id);if(found)found.quantity=Number(found.quantity||1)+1;else cart.push({product_id:p.id,id:p.id,name:p.name,price:Number(p.price||0),image_url:p.image_url,quantity:1});writeCart(cart);alert(p.name+' added to cart.')}async function getJSON(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('Request failed: '+r.status);return r.json()}async function load(v=''){const box=document.querySelector('#products');try{const d=await getJSON('/api/marketplace/products'+(v?'?vendor='+encodeURIComponent(v):''));const ps=Array.isArray(d.products)?d.products:[];box.innerHTML=ps.map(p=>`<article class="product"><img src="${esc(p.image_url)}" alt=""><div class="p"><div class="brandtag">${esc(p.vendor_name)}</div><div style="font-weight:850;margin-top:5px">${esc(p.name)}</div><div class="price">${money(p.price)}</div><button class="add" data-id="${esc(p.id)}">Add to Cart</button></div></article>`).join('')||'<div class="gz-empty">No products found.</div>';ps.forEach(p=>document.querySelector('[data-id="'+CSS.escape(String(p.id))+'"]')?.addEventListener('click',()=>add(p)));return true}catch(err){box.innerHTML='<div class="gz-empty">Unable to load products right now.</div>';console.error(err);return false}}async function init(){const brandsBox=document.querySelector('#brands');try{const d=await getJSON('/api/marketplace/brands');brandsBox.innerHTML='<button class="brand" id="allBrands">All Brands</button>' +(Array.isArray(d.brands)?d.brands:[]).map(b=>`<button class="brand" data-brand="${esc(b.slug)}">${esc(b.brand_name)}</button>`).join('');document.querySelector('#allBrands').onclick=async()=>{GZLoading.show();await load();GZLoading.hide()};document.querySelectorAll('[data-brand]').forEach(b=>b.onclick=async()=>{GZLoading.show();await load(b.dataset.brand);GZLoading.hide()})}catch(err){brandsBox.innerHTML='<span style="color:#777">Brands unavailable</span>';console.error(err)}await load();updateCart();GZLoading.hide()}if(window.GZLoading)GZLoading.show();if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();</script></body></html>
