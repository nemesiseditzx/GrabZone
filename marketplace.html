<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GrabZone Marketplace</title><link rel="stylesheet" href="/vendor.css"><style>body{background:#fff}.wrap{max-width:1200px;margin:auto;padding:28px 18px}.hero{background:#111;color:#fff;border-radius:28px;padding:42px 34px;margin-bottom:22px}.hero h1{font-size:clamp(34px,6vw,68px);letter-spacing:-3px;margin:0}.brands{display:flex;gap:10px;overflow:auto;padding:5px 0 18px}.brand{flex:0 0 auto;border:1px solid #e6e6eb;background:#fff;border-radius:999px;padding:10px 15px;font-weight:850;cursor:pointer}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.product{border:1px solid #e8e8ed;border-radius:18px;overflow:hidden;background:#fff}.product img{width:100%;aspect-ratio:1;object-fit:cover;background:#f4f4f6}.product .p{padding:14px}.brandtag{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#ff6b00;font-weight:900}.price{font-size:19px;font-weight:950;margin-top:6px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.tools a{background:#fff;color:#111;text-decoration:none;border-radius:999px;padding:11px 15px;font-weight:900}@media(max-width:900px){.products{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.products{grid-template-columns:repeat(2,1fr)}.hero{padding:30px 22px}}</style></head><body><div class="wrap"><section class="hero"><div style="font-weight:950;letter-spacing:3px;color:#ff6b00">GRABZONE MARKETPLACE</div><h1>More brands.<br>One GrabZone.</h1><p style="color:#bbb;max-width:650px;line-height:1.7">Shop products from independent brands through one checkout, one GrabZone membership and one order tracking experience.</p><div class="tools"><a href="/marketplace-track.html">Track an order →</a><a href="/">Back to GrabZone</a></div></section><h2>Shop by Brand</h2><div id="brands" class="brands"></div><div style="display:flex;justify-content:space-between;align-items:center;margin:18px 0"><h2 style="margin:0">All Products</h2></div><div id="products" class="products"></div></div><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=n=>'৳'+Number(n||0).toLocaleString('en-BD');async function load(v=''){const r=await fetch('/api/marketplace/products'+(v?'?vendor='+encodeURIComponent(v):''));const d=await r.json();document.querySelector('#products').innerHTML=(d.products||[]).map(p=>`<article class="product"><img src="${esc(p.image_url)}" alt=""><div class="p"><div class="brandtag">${esc(p.vendor_name)}</div><div style="font-weight:850;margin-top:5px">${esc(p.name)}</div><div class="price">${money(p.price)}</div></div></article>`).join('')||'<div class="gz-empty">No products found.</div>'}async function init(){const d=await (await fetch('/api/marketplace/brands')).json();document.querySelector('#brands').innerHTML='<button class="brand" onclick="load()">All Brands</button>' +(d.brands||[]).map(b=>`<button class="brand" onclick="load('${esc(b.slug)}')">${esc(b.brand_name)}</button>`).join('');load()}init();</script></body></html>
