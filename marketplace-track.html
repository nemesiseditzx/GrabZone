<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GrabZone Order Tracking</title><link rel="stylesheet" href="/vendor.css"><style>body{background:#f7f7f3}.wrap{max-width:900px;margin:auto;padding:28px 18px}.hero,.card{background:#fff;border:1px solid #e7e7e2;border-radius:24px;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.05)}.hero{background:#111;color:#fff}.hero h1{font-size:clamp(34px,7vw,60px);letter-spacing:-3px;margin:5px 0}.track{display:flex;gap:10px;margin-top:20px}.track input{flex:1;min-width:0;border:1px solid #ddd;border-radius:14px;padding:14px;font-size:16px}.track button{border:0;border-radius:14px;padding:14px 18px;font-weight:900;background:#ff6b00;color:#fff;cursor:pointer}.vendor{border:1px solid #e7e7e2;border-radius:18px;padding:17px;margin-top:13px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{border-radius:999px;padding:6px 10px;background:#eee;font-size:11px;font-weight:900}.item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #eee}.muted{color:#777}.error{color:#b00020;font-weight:800}@media(max-width:600px){.track{flex-direction:column}.track button{width:100%}}</style></head><body><div class="wrap"><section class="hero"><div style="font-weight:950;letter-spacing:3px;color:#ff6b00">GRABZONE</div><h1>Track your order.</h1><p style="color:#bbb">One order. Every vendor shipment. One place to follow the progress.</p><form class="track" id="form"><input id="id" placeholder="Order ID or Tracking ID" autocomplete="off"><button>Track</button></form></section><div id="result" style="margin-top:18px"></div></div><script>const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=n=>'৳'+Number(n||0).toLocaleString('en-BD');const status=s=>s==='Partially Shipped'?'Partially Shipped':s||'Processing';async function load(id){$('result').innerHTML='<div class="card">Loading…</div>';try{const r=await fetch('/api/d1',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fn:'track_public_order',args:{p_tracking_id:id}})});const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||'Order not found.');const o=d.order||d.data||d;const groups=d.vendors||d.vendor_orders||[];$('result').innerHTML='<div class="card"><div class="muted">Order</div><h2 style="margin:4px 0">'+esc(o.order_number||id)+'</h2><div class="muted">Tracking: '+esc(o.public_tracking_id||id)+'</div><p><span class="badge">'+esc(status(o.status))+'</span></p>'+groups.map(v=>'<div class="vendor"><div class="head"><div><b>'+esc(v.brand_name||v.vendor_name||'Vendor')+'</b><div class="muted">'+esc(v.tracking_id||'Tracking pending')+'</div></div><span class="badge">'+esc(status(v.status))+'</span></div>'+(v.items||[]).map(i=>'<div class="item"><span>'+esc(i.name||i.product_name||'Product')+' × '+esc(i.quantity)+'</span><b>'+money(i.line_total)+'</b></div>').join('')+(v.shipments||[]).map(s=>'<div class="muted" style="margin-top:9px">'+esc(s.courier||'Courier')+' · '+esc(s.tracking_id||'No tracking ID')+'</div>').join('')+'</div>').join('')+'</div>'}catch(e){$('result').innerHTML='<div class="card error">'+esc(e.message)+'</div>'}}$('form').addEventListener('submit',e=>{e.preventDefault();const id=$('id').value.trim();if(id)load(id)});const q=new URLSearchParams(location.search).get('id');if(q){$('id').value=q;load(q)}</script></body></html>
