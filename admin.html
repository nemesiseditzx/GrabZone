<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRABZONE Admin</title><link rel="stylesheet" href="admin.css"></head>
<body><div class="wrap">
<div id="loginBox" class="box login"><h1>GRABZONE Admin</h1><p>Website control only. Customers do not log in.</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Sign in</button><div id="loginMsg"></div></div>
<div id="app" class="hidden">
<header><strong>GRABZONE ADMIN</strong><button class="light" onclick="logout()">Log out</button></header>
<div class="box"><h2>Add Product</h2><div class="grid"><label>Product name<input id="name"></label><label>Category<input id="category"></label><label>Price<input id="price" type="number"></label><label>Old price<input id="oldPrice" type="number"></label><label>Tag<input id="tag"></label><label>Published<select id="published"><option value="true">Yes</option><option value="false">No</option></select></label></div><label>Description<textarea id="description"></textarea></label><label>📷 Product image<input id="image" type="file" accept="image/*"></label><button onclick="addProduct()">Upload & Save Product</button><span id="productMsg"></span></div>
<div class="box"><div class="head"><h2>Products</h2><button class="light" onclick="loadProducts()">Refresh</button></div><div id="products"></div></div>
<div class="box"><h2>Notice Board</h2><div class="grid"><label>Title<input id="noticeTitle"></label><label>Sort order<input id="noticeOrder" type="number" value="0"></label></div><label>Message<textarea id="noticeMessage"></textarea></label><button onclick="addNotice()">Add Notice</button><div id="notices"></div></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
