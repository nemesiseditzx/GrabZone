<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRABZONE Admin</title><link rel="stylesheet" href="admin.css"></head><body><div class="wrap"><div id="loginBox" class="box login"><h1>GRABZONE Admin</h1><p>Website control center.</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Sign in</button><div id="loginMsg"></div></div><div id="app" class="hidden"><header><strong>GRABZONE ADMIN</strong><button class="light" onclick="logout()">Log out</button></header>
<div class="box"><h2>Website Settings</h2><p>Edit the storefront without touching code. Upload your logo and hero image, change text, links, colors and visibility.</p>
<div class="grid">
<label>Store name<input id="s_store_name"></label><label>Tagline<input id="s_tagline"></label>
<label>Logo image<input id="s_logo" type="file" accept="image/*"></label><label>Hero image<input id="s_hero" type="file" accept="image/*"></label>
<label>WhatsApp URL<input id="s_whatsapp"></label><label>Instagram URL<input id="s_instagram"></label><label>Messenger URL<input id="s_messenger"></label>
<label>Primary color<input id="s_primary" type="color"></label><label>Page background<input id="s_bg" type="color"></label>
</div>
<label>Hero eyebrow<input id="s_hero_eyebrow"></label><label>Hero title<input id="s_hero_title"></label><label>Hero emphasized title<input id="s_hero_em"></label><label>Hero description<textarea id="s_hero_description"></textarea></label>
<div class="grid"><label>Hero button text<input id="s_hero_btn"></label><label>Hero button link<input id="s_hero_link"></label></div>
<div class="grid"><label>Header link 1 label<input id="s_l1_label"></label><label>Header link 1 URL<input id="s_l1_url"></label><label>Header link 2 label<input id="s_l2_label"></label><label>Header link 2 URL<input id="s_l2_url"></label><label>Header link 3 label<input id="s_l3_label"></label><label>Header link 3 URL<input id="s_l3_url"></label></div>
<h3>Offer</h3><div class="grid"><label>Offer title<input id="s_offer_title"></label><label>Offer code<input id="s_offer_code"></label></div><label>Offer message<textarea id="s_offer_message"></textarea></label>
<h3>How to Order</h3><div class="grid"><label>Section title<input id="s_how_title"></label><label>Step 1 title<input id="s_step1_title"></label><label>Step 1 text<textarea id="s_step1_body"></textarea></label><label>Step 2 title<input id="s_step2_title"></label><label>Step 2 text<textarea id="s_step2_body"></textarea></label><label>Step 3 title<input id="s_step3_title"></label><label>Step 3 text<textarea id="s_step3_body"></textarea></label></div>
<h3>Referral</h3><div class="grid"><label>Referral title<input id="s_ref_title"></label><label>Button text<input id="s_ref_btn"></label></div><label>Referral text<textarea id="s_ref_body"></textarea></label>
<h3>Footer</h3><label>Footer text<input id="s_footer"></label>
<h3>Visibility</h3><div class="grid"><label>Notice <select id="s_show_notice"><option value="true">Show</option><option value="false">Hide</option></select></label><label>Offer <select id="s_show_offer"><option value="true">Show</option><option value="false">Hide</option></select></label><label>How to Order <select id="s_show_how"><option value="true">Show</option><option value="false">Hide</option></select></label><label>Referral <select id="s_show_ref"><option value="true">Show</option><option value="false">Hide</option></select></label></div>
<label>Custom CSS (advanced)<textarea id="s_css" placeholder="Optional CSS overrides"></textarea></label>
<button onclick="saveSettings()">Save Website Changes</button><span id="settingsMsg"></span></div><div class="box"><h2>Add Product</h2><div class="grid"><label>Product name<input id="name"></label><label>Category<input id="category"></label><label>Price<input id="price" type="number"></label><label>Old price<input id="oldPrice" type="number"></label><label>Tag<input id="tag"></label><label>Published<select id="published"><option value="true">Yes</option><option value="false">No</option></select></label></div><label>Description<textarea id="description"></textarea></label><label>📷 Product image<input id="image" type="file" accept="image/*"></label><button onclick="addProduct()">Upload & Save Product</button><span id="productMsg"></span></div><div class="box"><div class="head"><h2>Products</h2><button class="light" onclick="loadProducts()">Refresh</button></div><div id="products"></div></div><div class="box"><h2>Notice Board</h2><div class="grid"><label>Title<input id="noticeTitle"></label><label>Sort order<input id="noticeOrder" type="number" value="0"></label></div><label>Message<textarea id="noticeMessage"></textarea></label><button onclick="addNotice()">Add Notice</button><div id="notices"></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
