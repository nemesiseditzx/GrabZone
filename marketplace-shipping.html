<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketplace Shipping — GrabZone</title><link rel="stylesheet" href="/vendor.css"><script src="/d1-client.js"></script><script src="/marketplace-auth.js"></script></head><body><header class="gz-top"><div class="gz-logo">Grab<span>Zone</span> <small style="font-size:10px;color:#aaa;letter-spacing:1px">SHIPPING</small></div><a class="gz-btn light" href="/vendor-admin.html">← Marketplace Admin</a></header><main class="gz-main"><div class="gz-head"><div><h1>Vendor Shipping</h1><p>Each vendor can have its own shipping fee. Mixed carts add one fee per vendor.</p></div></div><div class="gz-card" style="overflow:auto"><table class="gz-table"><thead><tr><th>Vendor</th><th>Status</th><th>Shipping Fee</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const $=s=>document.querySelector(s),money=n=>'৳'+Number(n||0).toLocaleString('en-BD',{maximumFractionDigits:2});async function api(p,o={}){const r=await fetch(p,{credentials:'include',...o,headers:{'Content-Type':'application/json',...(o.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){const d=await api('/api/vendor/admin/vendors');$('#rows').innerHTML=(d.vendors||[]).map(v=>`<tr><td><b>${v.brand_name}</b><div style="font-size:11px;color:#777">${v.slug}</div></td><td>${v.status}</td><td><input id="fee_${v.id}" type="number" min="0" value="${Number(v.shipping_fee||0)}" style="width:110px"></td><td><button class="gz-btn light" onclick="save('${v.id}')">Save</button></td></tr>`).join('')||'<tr><td colspan="4">No vendors.</td></tr>'}async function save(id){try{await api('/api/vendor/admin/vendors/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({shipping_fee:Number(document.getElementById('fee_'+id).value)})});alert('Shipping fee saved.')}catch(e){alert(e.message)}}load().catch(e=>{alert(e.message);location.href='/admin.html'})</script></body></html>
