function distance(a,b){a=norm(a);b=norm(b);if(a===b)return 0;if(!a||!b)return 99;const prev=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let cur=[i];for(let j=1;j<=b.length;j++)cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));for(let j=0;j<=b.length;j++)prev[j]=cur[j]}return prev[b.length]}

 const paint=()=>{let rows=products.map(p=>({...p,__score:score(p,state.q)}));if(state.q)rows=rows.filter(p=>p.__score>0);if(state.cat)rows=rows.filter(p=>norm(p.category)===norm(state.cat));rows.sort((a,b)=>(b.__score-a.__score)||String(b.created_at||'').localeCompare(String(a.created_at||'')));const size=20,pages=Math.max(1,Math.ceil(rows.length/size));if(state.page>pages)state.page=pages;const shown=state.all?rows:rows.slice((state.page-1)*size,state.page*size);document.querySelector('#storeProducts').innerHTML=shown.length?shown.map(p=>'<article class="product"><a class="image" href="/product.html?id='+encodeURIComponent(p.id)+'"><img src="'+esc(img(p))+'" alt="'+esc(p.name)+'" loading="lazy"></a><div class="info"><small>'+esc(p.category||'Product')+'</small><a class="name" href="/product.html?id='+encodeURIComponent(p.id)+'">'+esc(p.name)+'</a><div class="price-row"><strong class="price">'+money(p.sale_price??p.price??0)+'</strong><button class="add" data-id="'+esc(p.id)+'">'+(String(p.product_type||'').toLowerCase()==='variable'?'Choose Options':'Add to Cart')+'</button></div></div></article>').join(''):'<div class="empty">No products match this store search.</div>';document.querySelector('#storeSummary').textContent=rows.length+' product'+(rows.length===1?'':'s')+' found'+(state.all?' · showing all':' · 20 per page');document.querySelector('#storeViewAll').textContent=state.all?'Use Pagination':'View All Products';const pg=document.querySelector('#storePages');pg.innerHTML=state.all||pages<=1?'':'<button id="spPrev" '+(state.page<=1?'disabled':'')+'>Previous</button><span style="font-size:9px;color:#777;font-weight:800">Page '+state.page+' of '+pages+'</span><button id="spNext" '+(state.page>=pages?'disabled':'')+'>Next</button>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const p=products.find(x=>String(x.id)===String(b.dataset.id));if(p)add(p)});document.querySelector('#spPrev')?.addEventListener('click',()=>{state.page--;paint()});document.querySelector('#spNext')?.addEventListener('click',()=>{state.page++;paint()})};
 const apply=()=>{state.q=document.querySelector('#storeSearch').value.trim();state.page=1;state.all=false;document.querySelectorAll('.store-cat').forEach(b=>b.classList.toggle('active',norm(b.dataset.cat)===norm(state.cat)));paint()};
