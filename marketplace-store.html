<body><div id="app"><div role="status" style="max-width:1180px;margin:80px auto;padding:32px 24px;text-align:center;font:600 14px system-ui;color:#6b7280">Loading store…</div></div>
<script>
(()=>{const esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));const money=n=>'৳'+Number(n||0).toLocaleString('en-BD');const CART='grabzone_cart_v2';const read=()=>{try{const x=JSON.parse(localStorage.getItem(CART)||'[]');return Array.isArray(x)?x:[]}catch{return[]}};const write=x=>{localStorage.setItem(CART,JSON.stringify(x));window.dispatchEvent(new Event('grabzone-cart-updated'))};const img=p=>p?.image_url||'/favicon.png';async function get(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(d.error||'Store unavailable')}return r.json()}function add(p){if(String(p.product_type||'').toLowerCase()==='variable'){location.href='/product.html?id='+encodeURIComponent(p.id);return}const c=read(),id=String(p.id),f=c.find(x=>String(x.product_id||x.id)===id);if(f)f.quantity=Number(f.quantity||1)+1;else c.push({product_id:p.id,id:p.id,name:p.name,price:Number(p.sale_price||p.price||0),image_url:img(p),quantity:1,vendor_id:p.vendor_id,vendor_slug:p.vendor_slug,vendor_name:p.vendor_name});write(c);toast('Added to cart')}function toast(t){let e=document.querySelector('.toast');if(!e){e=document.createElement('div');e.className='toast';e.style='position:fixed;right:18px;bottom:18px;z-index:9999;background:#111;color:#fff;padding:11px 15px;border-radius:9px;font-size:10px;font-weight:800';document.body.appendChild(e)}e.textContent=t;clearTimeout(window.__toast);e.style.opacity='1';window.__toast=setTimeout(()=>e.style.opacity='0',1500)}async function render(v,products){document.title=(v.brand_name||v.business_name||'Store')+' — GrabZone';document.querySelector('#app').innerHTML='<div class="store-page"><header class="store-header"><div class="store-top"><a class="logo" href="/"><img src="/favicon.png" alt="GrabZone"><b>Grab<span>Zone</span></b></a><a class="back" href="/marketplace">← Choose Another Store</a><button class="cart" id="cart">🛒 Cart</button></div></header><main><section class="hero"><div class="store-banner" id="storeBanner"></div><div class="store-logo" id="storeLogo"></div><div class="hero-copy"><div class="eyebrow">GRABZONE STORE</div><h1>'+esc(v.brand_name||v.business_name||v.slug)+'</h1><p>'+(esc(v.description||'Shop products from this brand.'))+'</p></div></section><section class="products">'+(products.length?products.map(p=>'<article class="product"><a class="image" href="/product.html?id='+encodeURIComponent(p.id)+'"><img src="'+esc(img(p))+'" alt="'+esc(p.name)+'" loading="lazy" decoding="async"></a><div class="info"><small>'+esc(p.category||'Product')+'</small><a class="name" href="/product.html?id='+encodeURIComponent(p.id)+'">'+esc(p.name)+'</a><div class="price-row"><strong class="price">'+money(p.sale_price||p.price)+'</strong><button class="add" data-id="'+esc(p.id)+'">Add to Cart</button></div></div></article>').join(''):'<div class="empty">This store has no products available right now.</div>')+'</section></main><footer class="footer">GrabZone Marketplace · <a href="/marketplace" style="color:#f65b0a;text-decoration:none;font-weight:900">Choose another store</a></footer></div>';const banner=document.querySelector('#storeBanner'),logo=document.querySelector('#storeLogo');if(banner)banner.style.backgroundImage=v.banner_url?`url("${String(v.banner_url).replace(/"/g,'\\"')}")`:'';if(logo)logo.innerHTML=v.logo_url?`<img src="${esc(v.logo_url)}" alt="${esc(v.brand_name||v.business_name||'Store')} logo">`:`<span>${esc(String(v.brand_name||v.business_name||'S').charAt(0).toUpperCase())}</span>`;document.querySelector('#cart').onclick=()=>{if(window.GrabZoneCart?.open)window.GrabZoneCart.open();else location.href='/checkout.html'};document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const p=products.find(x=>String(x.id)===String(b.dataset.id));if(p)add(p)});try{const er=await fetch('/api/rewards/eligibility?slug='+encodeURIComponent(v.slug||new URLSearchParams(location.search).get('slug')||''),{cache:'no-store'});if(er.ok){const e=await er.json(),rewards=!!e.rewards_enabled,referral=!!e.referral_enabled,layout=!!e.eligible_store_layout;if(rewards||referral||layout){document.querySelector('.store-page').classList.add('gz-member-store');const copy=document.querySelector('.hero-copy');const tag=document.createElement('div');tag.className='gz-store-member-tag';tag.textContent=(rewards||referral?'GRABZONE REWARDS · FEATURED PARTNER STORE':'GRABZONE · FEATURED PARTNER STORE');copy.insertBefore(tag,copy.firstChild);const perks=document.createElement('div');perks.className='gz-store-member-perks';perks.innerHTML=(rewards?'<span><b>✦</b> GrabPoints Rewards</span>':'')+(referral?'<span><b>↗</b> Referral Benefits</span>':'');copy.appendChild(perks);const value=document.createElement('div');value.className='member-value-strip';value.innerHTML=(rewards?'<div class="member-value-card"><span class="member-value-icon">✦</span><div><strong>GrabPoints Rewards</strong><small>Earn points on eligible purchases at this store.</small></div></div>':'')+(referral?'<div class="member-value-card"><span class="member-value-icon">↗</span><div><strong>Referral Benefits</strong><small>Referral perks are available on qualifying orders.</small></div></div>':'')+'<div class="member-value-card"><span class="member-value-icon">♛</span><div><strong>Featured Partner</strong><small>Shop this store directly inside GrabZone Marketplace.</small></div></div>';copy.appendChild(value)}}}catch(e){console.warn('Store benefits unavailable',e)}}async function init(){try{const slug=new URLSearchParams(location.search).get('slug')||'';if(!slug)throw Error('Store not selected');const d=await get('/api/marketplace/store?slug='+encodeURIComponent(slug));await render(d.vendor,d.products||[])}catch(e){document.querySelector('#app').innerHTML='<div style="padding:70px 20px;text-align:center;font-family:system-ui"><h2>Store unavailable</h2><p>'+esc(e.message)+'</p><a href="/marketplace" style="color:#f65b0a;font-weight:800">← Choose another store</a></div>'}}init()})()
