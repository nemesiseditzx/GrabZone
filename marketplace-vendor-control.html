<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor Control — GrabZone</title><link rel="stylesheet" href="/vendor.css"><script src="/d1-client.js"></script><script src="/marketplace-auth.js"></script><style>.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tab{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:#f1f1ee}.tab.active{background:#ff6b00;color:#fff}.panel{display:none}.panel.active{display:block}.section{margin-top:16px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.subtle{font-size:12px;color:#777}.error-card{border:1px solid #f0b8b8;background:#fff7f7}.error-box{white-space:pre-wrap;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:#fff;border:1px solid #eee;border-radius:10px;padding:12px;overflow:auto}.form-msg{margin-top:10px;padding:10px;border-radius:10px;font-size:13px;font-weight:800}.ok{background:#effff4;color:#176b35}.err{background:#fff1f1;color:#a11}.product-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product-form .full{grid-column:1/-1}@media(max-width:700px){.product-form{grid-template-columns:1fr}}.mini{font-size:11px;color:#777}.danger{color:#a11}</style></head><body><header class="gz-top"><div class="gz-logo">Grab<span>Zone</span> <small style="font-size:10px;color:#aaa;letter-spacing:1px">VENDOR CONTROL</small></div><a class="gz-btn light" href="/vendor-admin.html">← Marketplace Admin</a></header><main class="gz-main"><div id="app"><div class="gz-card">Loading vendor…</div></div></main><script>const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=n=>'৳'+Number(n||0).toLocaleString('en-BD',{maximumFractionDigits:2});async function api(p,o={}){const r=await fetch(p,{credentials:'include',cache:'no-store',...o,headers:{'Content-Type':'application/json',...(o.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||('Request failed ('+r.status+')'));return d}let id=new URLSearchParams(location.search).get('vendor'),data=null,categories=[];function showError(e){const msg=e?.message||String(e);$('#app').innerHTML='<div class="gz-card error-card"><h2>Could not load this vendor</h2><div class="error-box">'+esc(msg)+'</div><div class="actions"><button class="gz-btn primary" onclick="load()">Retry</button><a class="gz-btn light" href="/vendor-admin.html">Back</a></div></div>'}async function load(){try{const a=await api('/api/admin-auth');if(!a.authenticated){location.href='/admin.html';return}if(!id||id==='null'||id==='undefined'){const o=await api('/api/vendor/admin/overview');if(o.vendors?.length===1){id=o.vendors[0].id;history.replaceState({},'',location.pathname+'?vendor='+encodeURIComponent(id))}else{location.href='/vendor-admin.html';return}}data=await api('/api/vendor/admin/vendor-data?vendor_id='+encodeURIComponent(id));categories=(await api('/api/vendor/admin/categories')).categories||[];render()}catch(e){showError(e)}}function render(){const v=data.vendor;$('#app').innerHTML='<div class="gz-head"><div><h1>'+esc(v.brand_name||v.business_name)+'</h1><p>Super Admin control center · '+esc(v.slug)+'</p></div><div class="actions"><a class="gz-btn light" href="/brand.html?slug='+encodeURIComponent(v.slug)+'" target="_blank">View Store</a><button class="gz-btn light" onclick="load()">Refresh</button></div></div><div class="tabs"><button class="tab active" data-tab="profile">Profile</button><button class="tab" data-tab="products">Products</button><button class="tab" data-tab="orders">Orders</button><button class="tab" data-tab="store">Store Sections</button><button class="tab" data-tab="security">Login & Security</button></div><section id="profile" class="panel active"><div class="gz-card"><h2>Vendor Profile & Settings</h2><form id="vf" class="gz-form"><div class="gz-two"><div class="gz-field"><label>Business Name</label><input id="business_name" value="${esc(v.business_name)}"></div><div class="gz-field"><label>Brand Name</label><input id="brand_name" value="${esc(v.brand_name)}"></div></div><div class="gz-two"><div class="gz-field"><label>Business Email</label><input id="business_email" type="email" value="${esc(v.business_email||v.email)}"></div><div class="gz-field"><label>Phone</label><input id="phone" value="${esc(v.phone||'')}"></div></div><div class="gz-two"><div class="gz-field"><label>Order Notification Email</label><input id="order_notification_email" type="email" value="${esc(v.order_notification_email||v.email)}"></div><div class="gz-field"><label>Support Email</label><input id="support_email" type="email" value="${esc(v.support_email||v.email)}"></div></div><div class="gz-two"><div class="gz-field"><label>Status</label><select id="status"><option ${v.status==='Active'?'selected':''}>Active</option><option ${v.status==='Pending'?'selected':''}>Pending</option><option ${v.status==='Suspended'?'selected':''}>Suspended</option></select></div><div class="gz-field"><label>Shipping Fee</label><input id="shipping_fee" type="number" min="0" value="${Number(v.shipping_fee||0)}"></div></div><div class="gz-two"><div class="gz-field"><label>Commission Type</label><select id="commission_type"><option value="percentage" ${v.commission_type==='percentage'?'selected':''}>Percentage</option><option value="fixed" ${v.commission_type==='fixed'?'selected':''}>Fixed</option></select></div><div class="gz-field"><label>Commission Value</label><input id="commission_value" type="number" min="0" value="${Number(v.commission_value||0)}"></div></div><div class="gz-two"><div class="gz-field"><label>Logo URL</label><input id="logo_url" value="${esc(v.logo_url||'')}"></div><div class="gz-field"><label>Banner URL</label><input id="banner_url" value="${esc(v.banner_url||'')}"></div></div><div class="gz-field"><label>Description</label><textarea id="description" rows="4">${esc(v.description||'')}</textarea></div><div class="actions"><label><input id="homepage_visible" type="checkbox" ${v.homepage_visible?'checked':''}> Show in Shop by Brands</label><label><input id="featured" type="checkbox" ${v.featured?'checked':''}> Featured Brand</label></div><div id="profileMsg"></div><div class="actions"><button class="gz-btn primary">Save Vendor</button></div></form></div></section><section id="products" class="panel"><div class="gz-card"><h2>Add Product</h2><form id="pf" class="product-form"><div><label>Product Name *</label><input id="pn" required></div><div><label>SKU</label><input id="psku"></div><div><label>Price *</label><input id="pprice" type="number" min="0" step="0.01" required></div><div><label>Stock</label><input id="pstock" type="number" min="0" value="0"></div><div><label>Category</label><select id="pcat"><option value="">No category</option>${categories.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('')}</select></div><div><label>Image URL</label><input id="pimg"></div><div class="full"><label>Description</label><textarea id="pdesc" rows="4"></textarea></div><div><label><input id="ppub" type="checkbox" checked> Published</label></div><div class="actions"><button class="gz-btn primary">Add Product</button></div></form><div id="productMsg"></div></div><div class="gz-card section" style="overflow:auto"><h2>Products</h2><table class="gz-table"><thead><tr><th>Product</th><th>SKU</th><th>Price</th><th>Stock</th><th>Published</th><th></th></tr></thead><tbody>${data.products.map(p=>'<tr><td><b>'+esc(p.name)+'</b><div class="mini">'+esc(p.category_name||'')+'</div></td><td>'+esc(p.sku||'—')+'</td><td>'+money(p.price)+'</td><td><input data-stock="'+esc(p.id)+'" type="number" min="0" value="'+Number(p.stock||0)+'" style="width:85px"></td><td><input data-pub="'+esc(p.id)+'" type="checkbox" '+(p.published?'checked':'')+'></td><td><button class="gz-btn light" onclick="editProduct(\''+esc(p.id)+'\')">Edit</button></td></tr>').join('')||'<tr><td colspan="6">No products.</td></tr>'}</tbody></table><div class="actions"><button class="gz-btn primary" onclick="saveInventory()">Save Inventory</button></div></div></section><section id="orders" class="panel"><div class="gz-card" style="overflow:auto"><h2>Vendor Orders</h2><table class="gz-table"><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Subtotal</th><th>Status</th><th>Shipments</th></tr></thead><tbody>${data.orders.map(o=>'<tr><td><b>'+esc(o.order_number)+'</b><div class="mini">Tracking: '+esc(o.public_tracking_id||'—')+'</div></td><td>'+esc(o.customer_name||'')+'<div class="mini">'+esc(o.phone||'')+'</div></td><td>'+Number(o.items?.length||0)+'</td><td>'+money(o.subtotal)+'</td><td><select data-status="'+esc(o.id)+'" onchange="saveStatus(\''+esc(o.id)+'\',this.value)"><option '+(o.status==='Processing'?'selected':'')+'>Processing</option><option '+(o.status==='Picked Up'?'selected':'')+'>Picked Up</option><option '+(o.status==='In Transit'?'selected':'')+'>In Transit</option><option '+(o.status==='Out for Delivery'?'selected':'')+'>Out for Delivery</option><option '+(o.status==='Delivered'?'selected':'')+'>Delivered</option><option '+(o.status==='Failed'?'selected':'')+'>Failed</option><option '+(o.status==='Returned'?'selected':'')+'>Returned</option><option '+(o.status==='Cancelled'?'selected':'')+'>Cancelled</option></select></td><td>${(o.shipments||[]).map(s=>esc(s.courier||'Courier')+' · '+esc(s.tracking_id||'Pending')+' · '+esc(s.status||'Pending')).join('<br>')||'None'}</td></tr>').join('')||'<tr><td colspan="6">No orders.</td></tr>'}</tbody></table></div></section><section id="store" class="panel"><div class="gz-card"><h2>Store Sections</h2><p class="subtle">Manage the custom sections/content shown for this vendor store.</p><div id="sectionsList">Loading…</div><form id="sf" class="gz-form"><h3>Add Store Section</h3><div class="gz-two"><div class="gz-field"><label>Type</label><input id="st" value="custom"></div><div class="gz-field"><label>Title</label><input id="stitle"></div></div><div class="gz-field"><label>Content</label><textarea id="sbody" rows="4"></textarea></div><div class="gz-two"><div class="gz-field"><label>Sort Order</label><input id="ssort" type="number" value="0"></div><div><label><input id="senabled" type="checkbox" checked> Enabled</label></div></div><button class="gz-btn primary">Add Section</button></form></div></section><section id="security" class="panel"><div class="gz-card"><h2>Vendor Login Security</h2><p class="subtle">As Super Admin you can reset this vendor's login password.</p><form id="rf" class="gz-form"><div class="gz-field"><label>New Password</label><input id="newpass" type="password" minlength="8" required></div><div class="actions"><button class="gz-btn primary">Reset Vendor Password</button></div></form><div id="securityMsg"></div></div></section>';document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active');if(b.dataset.tab==='store')loadSections()});$('#vf').onsubmit=saveVendor;$('#pf').onsubmit=addProduct;$('#rf').onsubmit=resetPassword;loadSections()}async function saveVendor(e){e.preventDefault();const m=$('#profileMsg');try{await api('/api/vendor/admin/vendors/'+encodeURIComponent(data.vendor.id),{method:'PATCH',body:JSON.stringify({business_name:$('#business_name').value,brand_name:$('#brand_name').value,email:$('#business_email').value,business_email:$('#business_email').value,order_notification_email:$('#order_notification_email').value,support_email:$('#support_email').value,phone:$('#phone').value,status:$('#status').value,shipping_fee:Number($('#shipping_fee').value||0),commission_type:$('#commission_type').value,commission_value:Number($('#commission_value').value||0),logo_url:$('#logo_url').value,banner_url:$('#banner_url').value,description:$('#description').value,homepage_visible:$('#homepage_visible').checked,featured:$('#featured').checked})});m.className='form-msg ok';m.textContent='Saved ✓';await load()}catch(x){m.className='form-msg err';m.textContent=x.message}}async function addProduct(e){e.preventDefault();const m=$('#productMsg');try{await api('/api/vendor/admin/products',{method:'POST',body:JSON.stringify({vendor_id:data.vendor.id,name:$('#pn').value.trim(),sku:$('#psku').value.trim(),price:Number($('#pprice').value),stock:Number($('#pstock').value||0),category_id:$('#pcat').value||null,image_url:$('#pimg').value.trim(),description:$('#pdesc').value.trim(),published:$('#ppub').checked})});m.className='form-msg ok';m.textContent='Product added ✓';e.target.reset();$('#ppub').checked=true;await load()}catch(x){m.className='form-msg err';m.textContent=x.message}}async function saveInventory(){try{for(const p of data.products){const s=document.querySelector('[data-stock="'+p.id+'"]'),pub=document.querySelector('[data-pub="'+p.id+'"]');await api('/api/vendor/admin/products',{method:'PATCH',body:JSON.stringify({id:p.id,stock:Number(s.value),published:pub.checked})})}alert('Inventory saved.');await load()}catch(e){alert(e.message)}}async function editProduct(pid){const p=data.products.find(x=>x.id===pid);if(!p)return;const name=prompt('Product name',p.name);if(name===null)return;const price=prompt('Price',p.price);if(price===null)return;const stock=prompt('Stock',p.stock);if(stock===null)return;try{await api('/api/vendor/admin/products',{method:'PATCH',body:JSON.stringify({id:pid,name,price:Number(price),stock:Number(stock)})});await load()}catch(e){alert(e.message)}}async function saveStatus(oid,status){try{await api('/api/vendor/admin/order-status',{method:'PATCH',body:JSON.stringify({vendor_order_id:oid,status})});await load()}catch(e){alert(e.message)}}async function loadSections(){try{const d=await api('/api/vendor/admin/store-sections?vendor_id='+encodeURIComponent(data.vendor.id));const rows=d.sections||[];$('#sectionsList').innerHTML=rows.map(s=>'<div class="gz-card" style="margin:10px 0"><b>'+esc(s.title||s.section_type)+'</b><div class="mini">'+esc(s.section_type)+' · '+(s.enabled?'Enabled':'Disabled')+'</div><p>'+esc(s.body||'')+'</p><button class="gz-btn light" onclick="editSection(\''+esc(s.id)+'\')">Edit</button><button class="gz-btn light danger" onclick="deleteSection(\''+esc(s.id)+'\')">Delete</button></div>').join('')||'<p class="subtle">No custom store sections.</p>'}catch(e){$('#sectionsList').textContent=e.message}}$('#sf').onsubmit=async function(e){e.preventDefault();try{await api('/api/vendor/admin/store-sections?vendor_id='+encodeURIComponent(data.vendor.id),{method:'POST',body:JSON.stringify({section_type:$('#st').value,title:$('#stitle').value,body:$('#sbody').value,sort_order:Number($('#ssort').value||0),enabled:$('#senabled').checked})});this.reset();$('#senabled').checked=true;await loadSections()}catch(x){alert(x.message)}};async function editSection(id){const d=await api('/api/vendor/admin/store-sections?vendor_id='+encodeURIComponent(data.vendor.id));const s=(d.sections||[]).find(x=>x.id===id);if(!s)return;const title=prompt('Title',s.title||'');if(title===null)return;const body=prompt('Content',s.body||'');if(body===null)return;try{await api('/api/vendor/admin/store-sections?vendor_id='+encodeURIComponent(data.vendor.id),{method:'PATCH',body:JSON.stringify({id,title,body,section_type:s.section_type,sort_order:s.sort_order,enabled:!!s.enabled,data_json:s.data_json?JSON.parse(s.data_json):{}})});await loadSections()}catch(e){alert(e.message)}}async function deleteSection(id){if(!confirm('Delete this store section?'))return;try{await api('/api/vendor/admin/store-sections?vendor_id='+encodeURIComponent(data.vendor.id),{method:'DELETE',body:JSON.stringify({id})});await loadSections()}catch(e){alert(e.message)}}async function resetPassword(e){e.preventDefault();const m=$('#securityMsg');try{await api('/api/vendor/admin/reset-password',{method:'POST',body:JSON.stringify({vendor_id:data.vendor.id,password:$('#newpass').value})});m.className='form-msg ok';m.textContent='Vendor password reset successfully ✓';e.target.reset()}catch(x){m.className='form-msg err';m.textContent=x.message}}load();</script></body></html>
