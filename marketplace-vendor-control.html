<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor Control — GrabZone</title><link rel="stylesheet" href="/vendor.css"><script src="/d1-client.js"></script><script src="/marketplace-auth.js"></script><style>.section{margin-top:16px}.subtle{font-size:12px;color:#777}.danger{color:#a11}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.error-card{border:1px solid #f0b8b8;background:#fff7f7}.error-card h2{margin-top:0}.error-box{white-space:pre-wrap;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:#fff;border:1px solid #eee;border-radius:10px;padding:12px;overflow:auto}.loading{opacity:.65;pointer-events:none}</style></head><body><header class="gz-top"><div class="gz-logo">Grab<span>Zone</span> <small style="font-size:10px;color:#aaa;letter-spacing:1px">VENDOR CONTROL</small></div><a class="gz-btn light" href="/vendor-admin.html">← Marketplace Admin</a></header><main class="gz-main"><div id="app"><div class="gz-card">Loading vendor…</div></div></main><script>const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=n=>'৳'+Number(n||0).toLocaleString('en-BD',{maximumFractionDigits:2});async function api(p,o={}){const r=await fetch(p,{credentials:'include',cache:'no-store',...o,headers:{'Content-Type':'application/json',...(o.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||('Request failed ('+r.status+')'));return d}let id=new URLSearchParams(location.search).get('vendor');let data=null;function showError(e){const msg=e?.message||String(e||'Unknown error');$('#app').innerHTML='<div class="gz-card error-card"><h2>Could not load this vendor</h2><p>The Marketplace Admin is still working, but this vendor-control request failed.</p><div class="error-box">'+esc(msg)+'</div><div class="actions"><button class="gz-btn primary" onclick="load()">Retry</button><a class="gz-btn light" href="/vendor-admin.html">Back to Vendors</a></div></div>'}async function load(){try{const a=await api('/api/admin-auth');if(!a.authenticated){location.href='/admin.html';return}if(!id||id==='null'||id==='undefined'){const overview=await api('/api/vendor/admin/overview');const vendors=overview.vendors||[];if(vendors.length===1&&vendors[0].id){id=vendors[0].id;history.replaceState({},'',location.pathname+'?vendor='+encodeURIComponent(id));}else{location.href='/vendor-admin.html';return}}$('#app').innerHTML='<div class="gz-card">Loading vendor data…</div>';data=await api('/api/vendor/admin/vendor-data?vendor_id='+encodeURIComponent(id));if(!data?.vendor)throw Error('Vendor data was not returned.');render()}catch(e){showError(e)}}function render(){const v=data.vendor;$('#app').innerHTML=`<div class="gz-head"><div><h1>${esc(v.brand_name)}</h1><p>${esc(v.business_name)} · /brand/${esc(v.slug)}</p></div><div class="actions"><a class="gz-btn light" href="/brand.html?slug=${encodeURIComponent(v.slug)}" target="_blank">View Store</a><button class="gz-btn light" onclick="load()">Refresh</button></div></div><div class="gz-grid"><div class="gz-card gz-stat"><div class="label">Products</div><div class="num">${data.products.length}</div></div><div class="gz-card gz-stat"><div class="label">Orders</div><div class="num">${data.orders.length}</div></div><div class="gz-card gz-stat"><div class="label">Shipping</div><div class="num">${money(v.shipping_fee)}</div></div><div class="gz-card gz-stat"><div class="label">Commission</div><div class="num">${v.commission_type==='fixed'?money(v.commission_value):esc(v.commission_value)+'%'}</div></div></div><div class="gz-card section"><h2>Vendor Profile & Control</h2><form id="vf" class="gz-form"><div class="gz-two"><div class="gz-field"><label>Business Name</label><input id="business_name" value="${esc(v.business_name)}"></div><div class="gz-field"><label>Brand Name</label><input id="brand_name" value="${esc(v.brand_name)}"></div></div><div class="gz-two"><div class="gz-field"><label>Business Email</label><input id="business_email" type="email" value="${esc(v.business_email||v.email)}"></div><div class="gz-field"><label>Phone</label><input id="phone" value="${esc(v.phone||'')}"></div></div><div class="gz-two"><div class="gz-field"><label>Order Notification Email</label><input id="order_notification_email" type="email" value="${esc(v.order_notification_email||v.email)}"></div><div class="gz-field"><label>Support Email</label><input id="support_email" type="email" value="${esc(v.support_email||v.email)}"></div></div><div class="gz-two"><div class="gz-field"><label>Status</label><select id="status"><option ${v.status==='Active'?'selected':''}>Active</option><option ${v.status==='Pending'?'selected':''}>Pending</option><option ${v.status==='Suspended'?'selected':''}>Suspended</option></select></div><div class="gz-field"><label>Shipping Fee</label><input id="shipping_fee" type="number" min="0" value="${Number(v.shipping_fee||0)}"></div></div><div class="gz-two"><div class="gz-field"><label>Commission Type</label><select id="commission_type"><option value="percentage" ${v.commission_type==='percentage'?'selected':''}>Percentage</option><option value="fixed" ${v.commission_type==='fixed'?'selected':''}>Fixed</option></select></div><div class="gz-field"><label>Commission Value</label><input id="commission_value" type="number" min="0" value="${Number(v.commission_value||0)}"></div></div><div class="gz-two"><div class="gz-field"><label>Logo URL</label><input id="logo_url" value="${esc(v.logo_url||'')}"></div><div class="gz-field"><label>Banner URL</label><input id="banner_url" value="${esc(v.banner_url||'')}"></div></div><div class="gz-field"><label>Description</label><textarea id="description" rows="3">${esc(v.description||'')}</textarea></div><label><input id="homepage_visible" type="checkbox" ${v.homepage_visible?'checked':''}> Visible on Shop by Brands</label><label><input id="featured" type="checkbox" ${v.featured?'checked':''}> Featured brand</label><div class="actions"><button class="gz-btn primary">Save Vendor</button><span id="saveMsg" class="subtle"></span></div></form></div><div class="gz-card section" style="overflow:auto"><h2>Inventory & Products</h2><table class="gz-table"><thead><tr><th>Product</th><th>SKU</th><th>Price</th><th>Stock</th><th>Published</th></tr></thead><tbody>${data.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku||'—')}</td><td>${money(p.price)}</td><td><input data-stock="${esc(p.id)}" type="number" min="0" value="${Number(p.stock||0)}" style="width:90px"></td><td><input data-pub="${esc(p.id)}" type="checkbox" ${p.published?'checked':''}></td></tr>`).join('')||'<tr><td colspan="5">No products.</td></tr>'}</tbody></table><div class="actions"><button class="gz-btn primary" onclick="saveInventory()">Save Inventory</button></div></div><div class="gz-card section" style="overflow:auto"><h2>Vendor Orders</h2><table class="gz-table"><thead><tr><th>Order</th><th>Customer</th><th>Subtotal</th><th>Status</th><th>Shipments</th></tr></thead><tbody>${data.orders.map(o=>`<tr><td>${esc(o.order_number)}</td><td>${esc(o.customer_name)}</td><td>${money(o.subtotal)}</td><td><select data-status="${esc(o.id)}" onchange="saveStatus('${o.id}',this.value)"><option ${o.status==='Processing'?'selected':''}>Processing</option><option ${o.status==='Picked Up'?'selected':''}>Picked Up</option><option ${o.status==='In Transit'?'selected':''}>In Transit</option><option ${o.status==='Out for Delivery'?'selected':''}>Out for Delivery</option><option ${o.status==='Delivered'?'selected':''}>Delivered</option><option ${o.status==='Failed'?'selected':''}>Failed</option><option ${o.status==='Returned'?'selected':''}>Returned</option><option ${o.status==='Cancelled'?'selected':''}>Cancelled</option></select></td><td>${(o.shipments||[]).map(s=>esc(s.courier||'Courier')+' · '+esc(s.tracking_id||'Pending')+' · '+esc(s.status)).join('<br>')||'None'}</td></tr>`).join('')||'<tr><td colspan="5">No orders.</td></tr>'}</tbody></table></div>`;$('#vf').onsubmit=saveVendor}async function saveVendor(e){e.preventDefault();const msg=$('#saveMsg');msg.textContent='Saving…';try{await api('/api/vendor/admin/vendors/'+encodeURIComponent(data.vendor.id),{method:'PATCH',body:JSON.stringify({business_name:$('#business_name').value,brand_name:$('#brand_name').value,email:$('#business_email').value,business_email:$('#business_email').value,order_notification_email:$('#order_notification_email').value,support_email:$('#support_email').value,phone:$('#phone').value,status:$('#status').value,shipping_fee:$('#shipping_fee').value,commission_type:$('#commission_type').value,commission_value:$('#commission_value').value,logo_url:$('#logo_url').value,banner_url:$('#banner_url').value,description:$('#description').value,homepage_visible:$('#homepage_visible').checked,featured:$('#featured').checked})});msg.textContent='Saved ✓';await load()}catch(x){msg.textContent=x.message}}async function saveInventory(){try{for(const p of data.products){const stock=document.querySelector('[data-stock="'+p.id+'"]'),pub=document.querySelector('[data-pub="'+p.id+'"]');await api('/api/vendor/products',{method:'PATCH',body:JSON.stringify({id:p.id,stock:Number(stock.value),published:pub.checked})})}alert('Inventory saved.');await load()}catch(e){alert(e.message)}}async function saveStatus(id,status){try{await api('/api/vendor/admin/order-status',{method:'PATCH',body:JSON.stringify({vendor_order_id:id,status})});await load()}catch(e){alert(e.message)}}load();</script></body></html>
