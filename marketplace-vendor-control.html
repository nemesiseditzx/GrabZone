<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor Control — GrabZone</title><link rel="stylesheet" href="/vendor.css"></head><body><header class="gz-top"><div class="gz-logo">Grab<span>Zone</span> <small style="font-size:10px;color:#aaa;letter-spacing:1px">VENDOR CONTROL</small></div><a class="gz-btn light" href="/vendor-admin.html">← Marketplace Admin</a></header><main class="gz-main"><div id="app"><div class="gz-card">Loading vendor…</div></div></main><script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=n=>'৳'+Number(n||0).toLocaleString('en-BD',{maximumFractionDigits:2});
async function api(p,o={}){const r=await fetch(p,{credentials:'include',...o,headers:{'Content-Type':'application/json',...(o.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
const id=new URLSearchParams(location.search).get('vendor');
async function load(){const a=await api('/api/admin-auth');if(!a.authenticated){location.href='/admin.html';return}if(!id)throw Error('Vendor ID missing');const d=await api('/api/vendor/admin/vendor-data?vendor_id='+encodeURIComponent(id)),v=d.vendor;$('#app').innerHTML=`<div class="gz-head"><div><h1>${esc(v.brand_name)}</h1><p>${esc(v.business_name)} · ${esc(v.slug)}</p></div><a class="gz-btn light" href="/brand.html?slug=${encodeURIComponent(v.slug)}" target="_blank">View Store</a></div><div class="gz-grid"><div class="gz-card gz-stat"><div class="label">Products</div><div class="num">${d.products.length}</div></div><div class="gz-card gz-stat"><div class="label">Orders</div><div class="num">${d.orders.length}</div></div><div class="gz-card gz-stat"><div class="label">Shipping</div><div class="num">${money(v.shipping_fee)}</div></div><div class="gz-card gz-stat"><div class="label">Commission</div><div class="num">${v.commission_type==='fixed'?money(v.commission_value):esc(v.commission_value)+'%'}</div></div></div><div class="gz-card" style="margin:16px 0"><h2>Vendor Profile</h2><form id="vf" class="gz-form"><div class="gz-two"><div class="gz-field"><label>Business Name</label><input id="business_name" value="${esc(v.business_name)}"></div><div class="gz-field"><label>Brand Name</label><input id="brand_name" value="${esc(v.brand_name)}"></div></div><div class="gz-two"><div class="gz-field"><label>Status</label><select id="status"><option ${v.status==='Active'?'selected':''}>Active</option><option ${v.status==='Pending'?'selected':''}>Pending</option><option ${v.status==='Suspended'?'selected':''}>Suspended</option></select></div><div class="gz-field"><label>Shipping Fee</label><input id="shipping_fee" type="number" min="0" value="${Number(v.shipping_fee||0)}"></div></div><div class="gz-two"><div class="gz-field"><label>Commission Type</label><select id="commission_type"><option value="percentage" ${v.commission_type==='percentage'?'selected':''}>Percentage</option><option value="fixed" ${v.commission_type==='fixed'?'selected':''}>Fixed</option></select></div><div class="gz-field"><label>Commission Value</label><input id="commission_value" type="number" min="0" value="${Number(v.commission_value||0)}"></div></div><label><input id="homepage_visible" type="checkbox" ${v.homepage_visible?'checked':''}> Visible on Shop by Brands</label><label><input id="featured" type="checkbox" ${v.featured?'checked':''}> Featured</label><button class="gz-btn primary">Save Vendor</button></form></div><div class="gz-card" style="overflow:auto"><h2>Inventory & Products</h2><table class="gz-table"><thead><tr><th>Product</th><th>SKU</th><th>Price</th><th>Stock</th><th>Published</th><th></th></tr></thead><tbody>${d.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku||'—')}</td><td>${money(p.price)}</td><td><input data-stock="${esc(p.id)}" type="number" min="0" value="${Number(p.stock||0)}" style="width:90px"></td><td>${p.published?'Yes':'No'}</td><td><button class="gz-btn light" onclick="saveStock('${p.id}')">Save</button></td></tr>`).join('')||'<tr><td colspan="6">No products.</td></tr>'}</tbody></table></div><div class="gz-card" style="overflow:auto;margin-top:16px"><h2>Vendor Orders</h2><table class="gz-table"><thead><tr><th>Order</th><th>Customer</th><th>Subtotal</th><th>Status</th><th>Tracking</th></tr></thead><tbody>${d.orders.map(o=>`<tr><td>${esc(o.order_number)}</td><td>${esc(o.customer_name)}</td><td>${money(o.subtotal)}</td><td><select onchange="status('${o.id}',this.value)"><option ${o.status==='Processing'?'selected':''}>Processing</option><option ${o.status==='Picked Up'?'selected':''}>Picked Up</option><option ${o.status==='In Transit'?'selected':''}>In Transit</option><option ${o.status==='Out for Delivery'?'selected':''}>Out for Delivery</option><option ${o.status==='Delivered'?'selected':''}>Delivered</option><option ${o.status==='Failed'?'selected':''}>Failed</option><option ${o.status==='Returned'?'selected':''}>Returned</option><option ${o.status==='Cancelled'?'selected':''}>Cancelled</option></select></td><td>${esc(o.public_tracking_id)}</td></tr>`).join('')||'<tr><td colspan="5">No orders.</td></tr>'}</tbody></table></div>`;$('#vf').onsubmit=async e=>{e.preventDefault();await api('/api/vendor/admin/vendors/'+encodeURIComponent(v.id),{method:'PATCH',body:JSON.stringify({business_name:$('#business_name').value,brand_name:$('#brand_name').value,status:$('#status').value,shipping_fee:$('#shipping_fee').value,commission_type:$('#commission_type').value,commission_value:$('#commission_value').value,homepage_visible:$('#homepage_visible').checked,featured:$('#featured').checked})});alert('Vendor saved.');load()}}
async function saveStock(pid){const input=document.querySelector('[data-stock="'+pid+'"]');await api('/api/vendor/products',{method:'PATCH',body:JSON.stringify({id:pid,stock:Number(input.value)})});input.style.outline='2px solid #0a6';}
async function status(id,value){await api('/api/vendor/admin/order-status',{method:'PATCH',body:JSON.stringify({vendor_order_id:id,status:value})});alert('Order status updated.');load()}
load().catch(e=>{alert(e.message);location.href='/vendor-admin.html'});
</script></body></html>
