<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GrabZone Brand Store</title>
  <script>
    (() => {
      try {
        const slug = new URLSearchParams(location.search).get('slug');
        location.replace(
          slug
            ? '/marketplace-store?slug=' + encodeURIComponent(slug)
            : '/marketplace.html'
        );
      } catch {
        location.replace('/marketplace.html');
      }
    })();
  </script>
</head>
<body></body>
</html>
