<script>
/* A brand page opened without ?slug= used to render only "Store not found.".
   Send the visitor to the marketplace index instead of a dead end. */
(function(){
  try{
    var slug=new URLSearchParams(location.search).get('slug');
    if(slug){ location.replace('/marketplace-store?slug='+encodeURIComponent(slug)); }
    else{ location.replace('/marketplace.html'); }
  }catch(e){}
})();

const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const slug=new URLSearchParams(location.search).get('slug')||'';const money=n=>'৳'+Number(n||0).toLocaleString('en-BD');const safeColor=x=>/^#[0-9a-f]{3,8}$/i.test(String(x||''))?x:'#ff6b00';
async function init(){try{const r=await fetch('/api/marketplace/store?slug='+encodeURIComponent(slug),{cache:'no-store'});const d=await r.json();if(!r.ok||!d.vendor)throw Error('Store not found');const v=d.vendor;document.title=(v.brand_name||v.business_name||'Store')+' · GrabZone';const accent=safeColor(v.accent_color);document.documentElement.style.setProperty('--store-accent',accent);document.documentElement.style.setProperty('--store-accent-soft',accent+'18');const banner=document.querySelector('#banner');banner.style.backgroundColor=accent;const vs=await fetch('/api/rewards/eligibility?slug='+encodeURIComponent(slug),{cache:'no-store'}).then(x=>x.ok?x.json():{}).catch(()=>({}));const eligible=!!vs.eligible_store_layout,hasRewards=!!vs.rewards_enabled,hasReferral=!!vs.referral_enabled,featured=hasRewards||hasReferral;document.querySelector('.store').classList.toggle('gz-eligible',eligible);document.querySelector('.store').classList.toggle('gz-featured-store',featured);const logo=v.logo_url?'<img class="store-logo" src="'+esc(v.logo_url)+'" alt="'+esc(v.brand_name||v.business_name||'Store')+' logo">':'';const badges=(hasRewards?'<span class="gz-benefit">GrabPoints & Rewards</span>':'')+(hasReferral?'<span class="gz-benefit">Referral benefits</span>':'');banner.innerHTML='<div>'+(featured?'<div class="member-feature-label">GrabZone Rewards · Featured Partner Store</div>':'')+'<div class="store-brandline">'+logo+'<span class="store-kicker">'+(featured?'EXCLUSIVE REWARDS PARTNER':'GRABZONE PARTNER STORE')+'</span></div><h1>'+esc(v.brand_name||v.business_name||'Store')+'</h1><div class="store-benefits">'+badges+'</div><p class="store-desc">'+esc(v.description||v.tagline||'Discover products from this store.')+'</p>'+(hasRewards?'<div class="member-perk-line"><span>✦</span> Rewards-enabled store · Eligible purchases can earn GrabPoints</div>':'')+'</div>';if(v.banner_url&&/^https?:\/\//i.test(v.banner_url)){const img=document.createElement('img');img.src=v.banner_url;img.alt='';img.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.46;z-index:0';banner.insertBefore(img,banner.firstChild);}const strip=document.querySelector('#benefitStrip');if(hasRewards||hasReferral){strip.hidden=false;strip.innerHTML=(hasRewards?'<div class="benefit-tile"><span class="benefit-icon">✦</span><div><b>GrabPoints Rewards</b><small>Earn points on eligible purchases at this featured partner store.</small></div></div>':'')+(hasReferral?'<div class="benefit-tile"><span class="benefit-icon">↗</span><div><b>Referral benefits</b><small>Referral benefits apply where the purchase is eligible.</small></div></div>':'')+'<div class="benefit-tile"><span class="benefit-icon">♛</span><div><b>Featured partner store</b><small>'+esc(v.brand_name||v.business_name||'This store')+' is part of GrabZone’s eligible store network.</small></div></div>'}const products=d.products||[];document.querySelector('#productCount').textContent=products.length+' product'+(products.length===1?'':'s')+' available';const cards=await Promise.all(products.map(async p=>{const e=await fetch('/api/rewards/eligibility?product_id='+encodeURIComponent(p.id),{cache:'no-store'}).then(x=>x.ok?x.json():{}).catch(()=>({}));const pb=(e.rewards_eligible?'<span class="gz-benefit">✦ Rewards</span>':'')+(e.referral_eligible?'<span class="gz-benefit">↗ Referral</span>':'');return '<article class="product"><img loading="lazy" src="'+esc(p.image_url||'')+'" alt="'+esc(p.name)+'"><div class="p"><div class="product-badges">'+pb+'</div><b class="product-name">'+esc(p.name||'Product')+'</b><div class="product-price">'+money(p.price)+'</div></div></article>'}));document.querySelector('#products').innerHTML=cards.join('')||'<div class="store-empty">No published products yet.</div>'}catch(e){document.querySelector('main').innerHTML='<div class="store-empty">'+esc(e.message||'Unable to load this store.')+'<p><a class="store-link" href="/marketplace.html">← Back to marketplace</a></p></div>'}}init();
