<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vendor Control — GrabZone</title>
<link rel="stylesheet" href="/vendor.css">
<style>
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tab{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:#f1f1ee}.tab.active{background:#ff6b00;color:#fff}.panel{display:none}.panel.active{display:block}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.subtle{font-size:12px;color:#777}.msg{padding:10px;border-radius:10px;margin-top:10px;font-weight:800}.msg.ok{background:#effff4;color:#176b35}.msg.err{background:#fff1f1;color:#a11}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid2{grid-template-columns:1fr}}.error{white-space:pre-wrap;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;padding:12px;background:#fff7f7;border:1px solid #e8b8b8;border-radius:10px}.table-wrap{overflow:auto}.empty{padding:18px;color:#777}.danger{color:#a11}.gz-upload-box{border:1px dashed #cfcfc8;border-radius:14px;padding:14px;background:#fafaf8}.gz-upload-box input[type=file]{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;background:#fff}.gz-upload-note{font-size:12px;color:#777;margin-top:7px}.gz-image-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px;margin-top:10px}.gz-image-preview img{width:100%;height:82px;object-fit:cover;border-radius:10px;border:2px solid transparent;background:#f3f3f0}.gz-image-preview img.main{border-color:#ff6b00}.gz-current-image{width:100%;max-height:150px;object-fit:contain;border:1px solid #eee;border-radius:12px;background:#fafaf8;margin-top:8px}
</style>
</head>
<body>
<header class="gz-top">
  <div class="gz-logo">Grab<span>Zone</span> <small style="font-size:10px;color:#aaa;letter-spacing:1px">VENDOR CONTROL</small></div>
  <a class="gz-btn light" href="/vendor-admin.html">← Marketplace Admin</a>
</header>
<main class="gz-main">
  <div id="app"><div class="gz-card">Loading vendor...</div></div>
</main>
<script>
(function(){
  'use strict';
  var app=document.getElementById('app');
  var vendorKey=new URLSearchParams(location.search).get('vendor');
  var state={vendor:null,products:[],orders:[],categories:[],sections:[],productFiles:[],productMainIndex:0};
  var MAX_IMAGES=10,MAX_BYTES=1024*1024;

  function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){var map={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};return map[ch];});}
  function money(value){return '৳'+Number(value||0).toLocaleString('en-BD',{maximumFractionDigits:2});}
  async function api(url,options){options=options||{};options.credentials='include';options.cache='no-store';options.headers=Object.assign({'Content-Type':'application/json'},options.headers||{});var response=await fetch(url,options);var data=await response.json().catch(function(){return {};});if(!response.ok)throw new Error(data.error||('Request failed ('+response.status+')'));return data;}
  async function uploadFile(file,kind){if(!file)return '';if(file.size>MAX_BYTES)throw new Error(file.name+' is larger than 1 MB. Maximum is 1 MB per image.');var fd=new FormData();fd.append('file',file,file.name);fd.append('kind',kind);fd.append('vendor_id',state.vendor.id);var r=await fetch('/api/vendor/upload',{method:'POST',credentials:'include',body:fd});var d=await r.json().catch(function(){return {};});if(!r.ok)throw new Error(d.error||'Image upload failed.');return d.url;}
  function showError(error){app.innerHTML='<div class="gz-card"><h2>Could not load vendor</h2><div class="error">'+esc(error&&error.message||error)+'</div><div class="actions"><button id="retry" class="gz-btn primary">Retry</button><a class="gz-btn light" href="/vendor-admin.html">Back</a></div></div>';document.getElementById('retry').onclick=load;}
  function setMessage(id,text,ok){var el=document.getElementById(id);if(!el)return;el.className='msg '+(ok?'ok':'err');el.textContent=text;}
  function inputField(label,id,type,value){return '<div class="gz-field"><label>'+label+'</label><input id="'+id+'" type="'+(type||'text')+'" value="'+esc(value==null?'':value)+'"></div>';}
  async function load(){try{var auth=await api('/api/admin-auth');if(!auth.authenticated){location.href='/admin.html';return;}if(!vendorKey)throw new Error('Missing vendor ID. Open Manage from Marketplace Admin.');var data=await api('/api/vendor/admin/vendor-data?vendor_id='+encodeURIComponent(vendorKey));state.vendor=data.vendor;state.products=data.products||[];state.orders=data.orders||[];var categoryData=await api('/api/vendor/admin/categories').catch(function(){return {categories:[]};});state.categories=categoryData.categories||[];render();}catch(error){showError(error);}}
  function render(){
    var v=state.vendor;
    var categoryOptions='<option value="">No category</option>'+state.categories.map(function(c){return '<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>';}).join('');
    app.innerHTML='<div class="gz-head"><div><h1>'+esc(v.brand_name||v.business_name||v.slug)+'</h1><p>Super Admin control center · '+esc(v.slug||'')+'</p></div><div class="actions"><a class="gz-btn light" target="_blank" href="/brand.html?slug='+encodeURIComponent(v.slug||'')+'">View Store</a><button id="refresh" class="gz-btn light">Refresh</button></div></div>'+
      '<div class="tabs"><button class="tab active" data-tab="profile">Profile</button><button class="tab" data-tab="products">Products</button><button class="tab" data-tab="orders">Orders</button><button class="tab" data-tab="store">Store</button><button class="tab" data-tab="security">Security</button></div>'+
      '<section id="profile" class="panel active"><div class="gz-card"><h2>Vendor Profile & Settings</h2><form id="profileForm" class="gz-form">'+
      '<div class="grid2">'+inputField('Business Name','businessName','text',v.business_name)+' '+inputField('Brand Name','brandName','text',v.brand_name)+' '+inputField('Business Email','businessEmail','email',v.business_email||v.email)+' '+inputField('Phone','phone','text',v.phone)+' '+inputField('Order Notification Email','orderEmail','email',v.order_notification_email||v.email)+' '+inputField('Support Email','supportEmail','email',v.support_email||v.email)+
      '<div class="gz-field"><label>Status</label><select id="vendorStatus"><option value="Active">Active</option><option value="Pending">Pending</option><option value="Suspended">Suspended</option></select></div>'+inputField('Shipping Fee','shippingFee','number',Number(v.shipping_fee||0))+
      '<div class="gz-field"><label>Commission Type</label><select id="commissionType"><option value="percentage">Percentage</option><option value="fixed">Fixed</option></select></div>'+inputField('Commission Value','commissionValue','number',Number(v.commission_value||0))+
      '<div class="gz-field"><label>Logo</label><div class="gz-upload-box"><input id="logoFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif"><div class="gz-upload-note">Choose a logo from your PC · Maximum 1 MB</div><div id="logoPreview"></div></div></div>'+
      '<div class="gz-field"><label>Banner</label><div class="gz-upload-box"><input id="bannerFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif"><div class="gz-upload-note">Choose a banner from your PC · Maximum 1 MB</div><div id="bannerPreview"></div></div></div></div>'+
      '<div class="gz-field"><label>Description</label><textarea id="description" rows="4">'+esc(v.description||'')+'</textarea></div><div class="actions"><label><input id="homepageVisible" type="checkbox"> Show in Shop by Brands</label><label><input id="featured" type="checkbox"> Featured Brand</label></div><div id="profileMsg"></div><button class="gz-btn primary">Save Vendor</button></form></div></section>'+
      '<section id="products" class="panel"><div class="gz-card"><h2>Add Product</h2><form id="productForm" class="gz-form"><div class="grid2">'+inputField('Product Name *','productName','text','')+inputField('SKU','productSku','text','')+inputField('Price *','productPrice','number','')+inputField('Stock','productStock','number','0')+'<div class="gz-field"><label>Category</label><select id="productCategory">'+categoryOptions+'</select></div><div class="gz-field"><label>Product Images *</label><div class="gz-upload-box"><input id="productFiles" type="file" multiple accept="image/jpeg,image/png,image/webp,image/gif,image/avif"><div class="gz-upload-note">Up to 10 images · Maximum 1 MB per image · First image is main. Click a preview to change main image.</div><div id="productPreview" class="gz-image-preview"></div></div></div></div><div class="gz-field"><label>Description</label><textarea id="productDescription" rows="4"></textarea></div><label><input id="productPublished" type="checkbox" checked> Published</label><div id="productMsg"></div><button class="gz-btn primary">Add Product</button></form></div><div class="gz-card" style="margin-top:16px"><h2>Products</h2><div class="table-wrap"><table class="gz-table"><thead><tr><th>Product</th><th>SKU</th><th>Price</th><th>Stock</th><th>Published</th><th></th></tr></thead><tbody id="productRows"></tbody></table></div><div class="actions"><button id="saveInventory" class="gz-btn primary">Save Inventory</button></div></div></section>'+
      '<section id="orders" class="panel"><div class="gz-card"><h2>Vendor Orders</h2><div class="table-wrap"><table class="gz-table"><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Subtotal</th><th>Status</th><th>Shipments</th></tr></thead><tbody id="orderRows"></tbody></table></div></div></section>'+
      '<section id="store" class="panel"><div class="gz-card"><h2>Store Sections</h2><div id="sectionsList" class="empty">Loading...</div><form id="sectionForm" class="gz-form"><div class="grid2"><div class="gz-field"><label>Type</label><input id="sectionType" value="custom"></div><div class="gz-field"><label>Title</label><input id="sectionTitle"></div></div><div class="gz-field"><label>Content</label><textarea id="sectionBody" rows="4"></textarea></div><button class="gz-btn primary">Add Section</button></form></div></section>'+
      '<section id="security" class="panel"><div class="gz-card"><h2>Vendor Login Security</h2><p class="subtle">Reset this vendor login password.</p><form id="resetForm" class="gz-form"><div class="gz-field"><label>New Password</label><input id="newPassword" type="password" minlength="8" required></div><button class="gz-btn primary">Reset Password</button></form><div id="securityMsg"></div></div></section>';
    document.getElementById('vendorStatus').value=v.status||'Active';document.getElementById('commissionType').value=v.commission_type||'percentage';document.getElementById('homepageVisible').checked=!!v.homepage_visible;document.getElementById('featured').checked=!!v.featured;
    document.getElementById('refresh').onclick=load;document.getElementById('profileForm').onsubmit=saveProfile;document.getElementById('productForm').onsubmit=addProduct;document.getElementById('saveInventory').onclick=saveInventory;document.getElementById('resetForm').onsubmit=resetPassword;document.getElementById('sectionForm').onsubmit=addSection;
    document.getElementById('productFiles').onchange=previewProductFiles;document.getElementById('logoFile').onchange=function(){previewSingle(this,'logoPreview')};document.getElementById('bannerFile').onchange=function(){previewSingle(this,'bannerPreview')};
    document.querySelectorAll('.tab').forEach(function(button){button.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});document.querySelectorAll('.panel').forEach(function(x){x.classList.remove('active');});button.classList.add('active');document.getElementById(button.getAttribute('data-tab')).classList.add('active');if(button.getAttribute('data-tab')==='store')loadSections();};});
    renderProducts();renderOrders();renderCurrentBrandImages();loadSections();
  }
  function renderCurrentBrandImages(){var l=document.getElementById('logoPreview'),b=document.getElementById('bannerPreview');if(l&&state.vendor.logo_url)l.innerHTML='<img class="gz-current-image" src="'+esc(state.vendor.logo_url)+'" alt="Current logo">';if(b&&state.vendor.banner_url)b.innerHTML='<img class="gz-current-image" src="'+esc(state.vendor.banner_url)+'" alt="Current banner">';}
  function previewSingle(input,targetId){var box=document.getElementById(targetId);box.innerHTML='';var f=input.files&&input.files[0];if(!f)return;if(f.size>MAX_BYTES){input.value='';alert(f.name+' is larger than 1 MB. Maximum is 1 MB per image.');return;}var img=document.createElement('img');img.className='gz-current-image';img.src=URL.createObjectURL(f);box.appendChild(img);}
  function previewProductFiles(){var files=[].slice.call(document.getElementById('productFiles').files||[]);if(files.length>MAX_IMAGES){alert('Maximum 10 images per product.');document.getElementById('productFiles').value='';state.productFiles=[];renderProductPreview();return;}var bad=files.find(function(f){return f.size>MAX_BYTES;});if(bad){alert(bad.name+' is larger than 1 MB. Maximum is 1 MB per image.');document.getElementById('productFiles').value='';state.productFiles=[];renderProductPreview();return;}state.productFiles=files;state.productMainIndex=0;renderProductPreview();}
  function renderProductPreview(){var box=document.getElementById('productPreview');if(!box)return;box.innerHTML='';state.productFiles.forEach(function(f,i){var img=document.createElement('img');img.className=i===state.productMainIndex?'main':'';img.title=i===state.productMainIndex?'Main image':'Click to make main image';img.src=URL.createObjectURL(f);img.onclick=function(){state.productMainIndex=i;renderProductPreview();};box.appendChild(img);});}
  function renderProducts(){var rows=state.products.map(function(p){return '<tr><td><b>'+esc(p.name)+'</b><div class="subtle">'+esc(p.category_name||'')+'</div></td><td>'+esc(p.sku||'—')+'</td><td>'+money(p.price)+'</td><td><input class="inventoryStock" data-id="'+esc(p.id)+'" type="number" min="0" value="'+Number(p.stock||0)+'" style="width:85px"></td><td><input class="inventoryPublished" data-id="'+esc(p.id)+'" type="checkbox" '+(p.published?'checked':'')+'></td><td><button class="gz-btn light productEdit" data-id="'+esc(p.id)+'">Edit</button></td></tr>';}).join('');document.getElementById('productRows').innerHTML=rows||'<tr><td colspan="6" class="empty">No products.</td></tr>';document.querySelectorAll('.productEdit').forEach(function(btn){btn.onclick=function(){editProduct(btn.getAttribute('data-id'));};});}
  function renderOrders(){var statuses=['Processing','Picked Up','In Transit','Out for Delivery','Delivered','Failed','Returned','Cancelled'];var rows=state.orders.map(function(o){var options=statuses.map(function(s){return '<option value="'+esc(s)+'" '+(o.status===s?'selected':'')+'>'+esc(s)+'</option>';}).join('');var shipments=(o.shipments||[]).map(function(s){return esc(s.courier||'Courier')+' · '+esc(s.tracking_id||'Pending')+' · '+esc(s.status||'Pending');}).join('<br>')||'None';return '<tr><td><b>'+esc(o.order_number||o.id)+'</b><div class="subtle">Tracking: '+esc(o.public_tracking_id||'—')+'</div></td><td>'+esc(o.customer_name||'')+'<div class="subtle">'+esc(o.phone||'')+'</div></td><td>'+Number((o.items||[]).length)+'</td><td>'+money(o.subtotal)+'</td><td><select class="orderStatus" data-id="'+esc(o.id)+'">'+options+'</select></td><td>'+shipments+'</td></tr>';}).join('');document.getElementById('orderRows').innerHTML=rows||'<tr><td colspan="6" class="empty">No vendor orders.</td></tr>';document.querySelectorAll('.orderStatus').forEach(function(select){select.onchange=function(){saveStatus(select.getAttribute('data-id'),select.value);};});}
  async function saveProfile(event){event.preventDefault();try{var logoUrl=state.vendor.logo_url||'',bannerUrl=state.vendor.banner_url||'';var lf=document.getElementById('logoFile').files[0],bf=document.getElementById('bannerFile').files[0];if(lf)logoUrl=await uploadFile(lf,'vendor-logo');if(bf)bannerUrl=await uploadFile(bf,'vendor-banner');await api('/api/vendor/admin/vendors/'+encodeURIComponent(state.vendor.id),{method:'PATCH',body:JSON.stringify({business_name:document.getElementById('businessName').value.trim(),brand_name:document.getElementById('brandName').value.trim(),email:document.getElementById('businessEmail').value.trim(),business_email:document.getElementById('businessEmail').value.trim(),phone:document.getElementById('phone').value.trim(),order_notification_email:document.getElementById('orderEmail').value.trim(),support_email:document.getElementById('supportEmail').value.trim(),status:document.getElementById('vendorStatus').value,shipping_fee:Number(document.getElementById('shippingFee').value||0),commission_type:document.getElementById('commissionType').value,commission_value:Number(document.getElementById('commissionValue').value||0),logo_url:logoUrl,banner_url:bannerUrl,description:document.getElementById('description').value,homepage_visible:document.getElementById('homepageVisible').checked,featured:document.getElementById('featured').checked})});setMessage('profileMsg','Vendor saved successfully.',true);await load();}catch(error){setMessage('profileMsg',error.message,false);}}
  async function addProduct(event){event.preventDefault();var btn=event.target.querySelector('button[type=submit]');if(btn)btn.disabled=true;try{var files=state.productFiles||[];if(!files.length)throw new Error('Please choose at least one product image.');if(files.length>MAX_IMAGES)throw new Error('Maximum 10 images per product.');var uploaded=[];for(var i=0;i<files.length;i++)uploaded.push(await uploadFile(files[i],'product-image'));var mainUrl=uploaded[state.productMainIndex]||uploaded[0];await api('/api/vendor/admin/products',{method:'POST',body:JSON.stringify({vendor_id:state.vendor.id,name:document.getElementById('productName').value.trim(),sku:document.getElementById('productSku').value.trim(),price:Number(document.getElementById('productPrice').value),stock:Number(document.getElementById('productStock').value||0),category_id:document.getElementById('productCategory').value||null,image_url:mainUrl,image_urls:uploaded,description:document.getElementById('productDescription').value,published:document.getElementById('productPublished').checked})});setMessage('productMsg','Product added successfully.',true);document.getElementById('productForm').reset();document.getElementById('productPublished').checked=true;state.productFiles=[];state.productMainIndex=0;renderProductPreview();await load();}catch(error){setMessage('productMsg',error.message,false);}finally{if(btn)btn.disabled=false;}}
  async function saveInventory(){try{for(var i=0;i<state.products.length;i++){var p=state.products[i],stock=document.querySelector('.inventoryStock[data-id="'+p.id+'"]'),published=document.querySelector('.inventoryPublished[data-id="'+p.id+'"]');if(stock&&published)await api('/api/vendor/admin/products',{method:'PATCH',body:JSON.stringify({id:p.id,stock:Number(stock.value||0),published:published.checked})});}await load();alert('Inventory saved.');}catch(error){alert(error.message);}}
  async function editProduct(id){var product=state.products.find(function(p){return String(p.id)===String(id);});if(!product)return;var name=prompt('Product name',product.name);if(name===null)return;var price=prompt('Price',product.price);if(price===null)return;var stock=prompt('Stock',product.stock);if(stock===null)return;try{await api('/api/vendor/admin/products',{method:'PATCH',body:JSON.stringify({id:product.id,name:name.trim(),price:Number(price),stock:Number(stock)})});await load();}catch(error){alert(error.message);}}
  async function saveStatus(id,status){try{await api('/api/vendor/admin/order-status',{method:'PATCH',body:JSON.stringify({vendor_order_id:id,status:status})});await load();}catch(error){alert(error.message);}}
  async function loadSections(){var box=document.getElementById('sectionsList');if(!box||!state.vendor)return;try{var data=await api('/api/vendor/admin/store-sections?vendor_id='+encodeURIComponent(state.vendor.id));state.sections=data.sections||[];box.innerHTML=state.sections.map(function(s){return '<div class="gz-card" style="margin:10px 0"><b>'+esc(s.title||s.section_type)+'</b><div class="subtle">'+esc(s.section_type||'custom')+' · '+(s.enabled?'Enabled':'Disabled')+'</div><p>'+esc(s.body||'')+'</p><button class="gz-btn light sectionEdit" data-id="'+esc(s.id)+'">Edit</button> <button class="gz-btn light danger sectionDelete" data-id="'+esc(s.id)+'">Delete</button></div>';}).join('')||'<div class="empty">No custom store sections.</div>';document.querySelectorAll('.sectionEdit').forEach(function(b){b.onclick=function(){editSection(b.getAttribute('data-id'));};});document.querySelectorAll('.sectionDelete').forEach(function(b){b.onclick=function(){deleteSection(b.getAttribute('data-id'));};});}catch(error){box.textContent=error.message;}}
  async function addSection(event){event.preventDefault();try{await api('/api/vendor/admin/store-sections?vendor_id='+encodeURIComponent(state.vendor.id),{method:'POST',body:JSON.stringify({section_type:document.getElementById('sectionType').value,title:document.getElementById('sectionTitle').value,body:document.getElementById('sectionBody').value,sort_order:0,enabled:true})});event.target.reset();document.getElementById('sectionType').value='custom';await loadSections();}catch(error){alert(error.message);}}
  async function editSection(id){var section=state.sections.find(function(s){return String(s.id)===String(id);});if(!section)return;var title=prompt('Title',section.title||'');if(title===null)return;var body=prompt('Content',section.body||'');if(body===null)return;try{await api('/api/vendor/admin/store-sections?vendor_id='+encodeURIComponent(state.vendor.id),{method:'PATCH',body:JSON.stringify({id:section.id,title:title,body:body,section_type:section.section_type||'custom',sort_order:Number(section.sort_order||0),enabled:!!section.enabled,data_json:{}})});await loadSections();}catch(error){alert(error.message);}}
  async function deleteSection(id){if(!confirm('Delete this store section?'))return;try{await api('/api/vendor/admin/store-sections?vendor_id='+encodeURIComponent(state.vendor.id),{method:'DELETE',body:JSON.stringify({id:id})});await loadSections();}catch(error){alert(error.message);}}
  async function resetPassword(event){event.preventDefault();try{await api('/api/vendor/admin/reset-password',{method:'POST',body:JSON.stringify({vendor_id:state.vendor.id,password:document.getElementById('newPassword').value})});setMessage('securityMsg','Vendor password reset successfully.',true);event.target.reset();}catch(error){setMessage('securityMsg',error.message,false);}}
  load();
})();
</script>
<script defer src="/vendor-control-product-editor.js?v=20260917-v8" data-gz-vendor-product-editor-direct></script>
</body>
</html>
