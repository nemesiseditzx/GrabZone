/* FUTURISTIC TRACKING EXPERIENCE */
.track-page{
  min-height:100vh!important;
  background:
    radial-gradient(circle at 15% 10%,rgba(255,101,0,.12),transparent 28%),
    radial-gradient(circle at 85% 80%,rgba(59,130,246,.08),transparent 30%),
    linear-gradient(135deg,#f8fafc 0%,#eef1f5 48%,#f7f8fa 100%)!important;
  position:relative;
}
.track-page::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.32;
  background-image:linear-gradient(rgba(17,24,39,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(17,24,39,.035) 1px,transparent 1px);
  background-size:32px 32px;
  mask-image:linear-gradient(to bottom,black,transparent 85%);
}
.track-page .track-wrap{position:relative;z-index:1;animation:gzTrackEnter .7s cubic-bezier(.2,.8,.2,1) both}
.track-page .track-card{
  position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,.9)!important;
  background:rgba(255,255,255,.88)!important;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 30px 80px rgba(15,23,42,.12),0 2px 0 rgba(255,255,255,.8) inset!important;
}
.track-page .track-card::before{
  content:'';position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,#ff6500,#ff9d4d,#111827,#ff6500);
  background-size:240% 100%;animation:gzTrackGradient 5s linear infinite;
}
.track-page .eyebrow{
  padding:7px 10px!important;border:1px solid #e6e9ee;border-radius:999px;
  background:rgba(255,255,255,.8);box-shadow:0 5px 18px rgba(15,23,42,.05);
}
.track-page .eyebrow::before{box-shadow:0 0 0 4px rgba(255,101,0,.12),0 0 16px rgba(255,101,0,.7);animation:gzPulse 1.8s ease-in-out infinite}
.track-page h1{font-weight:950!important;text-shadow:0 2px 20px rgba(17,24,39,.06)}
.track-page .intro{max-width:650px}
.track-page .track-form{padding:6px;background:rgba(247,248,250,.85);border:1px solid #e4e7eb;border-radius:17px;box-shadow:0 10px 28px rgba(15,23,42,.06)}
.track-page .track-form input{
  border:0!important;background:transparent!important;box-shadow:none!important;
  min-height:48px!important;padding-left:12px!important;font-weight:750;letter-spacing:.02em;
}
.track-page .track-form button{
  position:relative;overflow:hidden;min-width:145px!important;border-radius:12px!important;
  box-shadow:0 8px 22px rgba(17,21,26,.18)!important;
  transition:transform .2s ease,box-shadow .2s ease,background .2s ease!important;
}
.track-page .track-form button::after,.track-page .invoice-btn::after,.track-page .tracking-link::after,.track-page .back-store::after{
  content:'';position:absolute;top:-40%;left:-80%;width:45%;height:180%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.38),transparent);
  transform:skewX(-20deg);transition:left .55s ease;
}
.track-page .track-form button:hover,.track-page .invoice-btn:hover,.track-page .tracking-link:hover,.track-page .back-store:hover{
  transform:translateY(-2px);box-shadow:0 12px 28px rgba(15,23,42,.16)!important;
}
.track-page .track-form button:hover::after,.track-page .invoice-btn:hover::after,.track-page .tracking-link:hover::after,.track-page .back-store:hover::after{left:135%}
.track-page .track-msg{padding-left:4px;min-height:18px}
.track-page .result{animation:gzResultIn .5s cubic-bezier(.2,.8,.2,1) both}
.track-page .current-status{
  position:relative;overflow:hidden;
  background:linear-gradient(110deg,#11151a,#242a31 55%,#11151a)!important;
  background-size:200% 100%;animation:gzStatusShift 5s ease infinite;
  box-shadow:0 14px 30px rgba(17,21,26,.16)!important;
}
.track-page .current-status::after{
  content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 25%,rgba(255,255,255,.08) 50%,transparent 75%);
  transform:translateX(-100%);animation:gzSweep 4s ease-in-out infinite;
}
.track-page .track-status-line{margin:22px 0}
.track-page .track-status-line::before{background:linear-gradient(90deg,#a8d4b1,#d8dde3,#d8dde3)!important}
.track-page .track-status-step{
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease!important;
  box-shadow:0 5px 14px rgba(15,23,42,.04);
}
.track-page .track-status-step:hover{transform:translateY(-4px);box-shadow:0 12px 25px rgba(15,23,42,.1)}
.track-page .track-status-step.completed{box-shadow:0 7px 20px rgba(22,163,74,.09)}
.track-page .track-status-step.current{
  box-shadow:0 12px 30px rgba(17,21,26,.24)!important;
  animation:gzCurrentFloat 2.6s ease-in-out infinite;
}
.track-page .track-status-icon{transition:transform .25s ease,box-shadow .25s ease!important}
.track-page .track-status-step:hover .track-status-icon{transform:scale(1.08)}
.track-page .invoice-btn,.track-page .tracking-link,.track-page .back-store{
  position:relative;overflow:hidden;
  border:1px solid #11151a!important;
  box-shadow:0 7px 18px rgba(17,21,26,.1);
  transition:transform .2s ease,box-shadow .2s ease,background .2s ease!important;
}
.track-page .invoice-btn{
  margin-top:12px!important;background:#11151a!important;color:#fff!important;
  padding:12px 17px!important;border-radius:12px!important;
}
.track-page .invoice-btn::before{content:'↗';margin-right:8px;font-size:15px}
.track-page .tracking-box{
  position:relative;overflow:hidden;
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease!important;
}
.track-page .tracking-box:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(15,23,42,.08);border-color:#cbd2da!important}
.track-page .tracking-box::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(#ff6500,#ffb06e);opacity:.9;
}
.track-page .tracking-link{background:#11151a!important}
.track-page .help{border-top-color:#d9dee5}
.track-page .help-grid a{
  position:relative;overflow:hidden;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease!important;
}
.track-page .help-grid a:hover{transform:translateY(-3px)!important;box-shadow:0 12px 25px rgba(15,23,42,.09)!important;border-color:#c5ccd5!important}
.track-page .back-store{background:linear-gradient(110deg,#11151a,#292e34)!important}
.track-page .invoice-modal{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:gzModalBg .25s ease both}
.track-page .invoice-sheet{
  border:1px solid rgba(255,255,255,.9)!important;
  box-shadow:0 35px 100px rgba(0,0,0,.3)!important;
  animation:gzModalIn .35s cubic-bezier(.2,.8,.2,1) both;
}
.track-page .invoice-head{border-bottom-color:#e4e7eb}
.track-page .invoice-close{
  transition:transform .2s ease,background .2s ease,box-shadow .2s ease!important;
}
.track-page .invoice-close:hover{transform:rotate(2deg) scale(1.03);box-shadow:0 7px 18px rgba(15,23,42,.1)}
.track-page .invoice-vendor{
  transition:transform .2s ease,box-shadow .2s ease!important;
}
.track-page .invoice-vendor:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(15,23,42,.06)}
.track-page .product-card{transition:background .2s ease!important}
.track-page .product-card:hover{background:#f8fafc!important}
.track-page .product-thumb{transition:transform .25s ease,box-shadow .25s ease!important}
.track-page .product-card:hover .product-thumb{transform:scale(1.035);box-shadow:0 7px 18px rgba(15,23,42,.1)}
.track-page .invoice-total{
  background:linear-gradient(90deg,#f7f8fa,#fff);border-radius:10px;padding:12px 10px!important;
}
@keyframes gzTrackEnter{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes gzResultIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes gzTrackGradient{to{background-position:240% 0}}
@keyframes gzPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.82);opacity:.65}}
@keyframes gzStatusShift{0%,100%{background-position:0 0}50%{background-position:100% 0}}
@keyframes gzSweep{0%,65%{transform:translateX(-100%)}100%{transform:translateX(130%)}}
@keyframes gzCurrentFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes gzModalBg{from{opacity:0}to{opacity:1}}
@keyframes gzModalIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@media(max-width:600px){
  .track-page .track-card{padding:18px!important}
  .track-page .track-form{padding:5px}
  .track-page .track-form button{min-width:0!important;width:100%!important}
  .track-page .track-status-step{min-height:110px}
  .track-page .invoice-btn{width:100%!important}
}
@media(prefers-reduced-motion:reduce){
  .track-page *, .track-page *::before,.track-page *::after{animation:none!important;transition:none!important}
}

/* GRABZONE receipt printer: settle -> paper feeds -> invoice expands */
.track-page .invoice-modal.printing{
 display:flex!important;align-items:center!important;justify-content:center!important;
 overflow:hidden!important;perspective:1400px!important;
 background:radial-gradient(ellipse at 50% 44%,#202329 0%,#101114 62%,#08090b 100%)!important;
}
.track-page .invoice-modal.printing .invoice-printer-stage{
 position:absolute!important;inset:0!important;display:flex!important;align-items:center!important;
 justify-content:center!important;z-index:5!important;pointer-events:none!important;overflow:hidden!important;
}
.track-page .receipt-printer{
 position:relative!important;width:min(420px,84vw)!important;flex:0 0 auto!important;
 transform-style:preserve-3d!important;filter:drop-shadow(0 28px 34px rgba(0,0,0,.48))!important;
 opacity:1!important;transform:translate3d(0,0,0) rotateX(0)!important;
 transition:opacity .8s ease,transform .9s cubic-bezier(.2,.75,.2,1)!important;
}
.track-page .invoice-modal.printer-phase .receipt-printer{animation:gzPrinterSettle .9s cubic-bezier(.2,.75,.2,1) both!important}
.track-page .printer-top{
 position:relative!important;height:58px!important;box-sizing:border-box!important;
 background:linear-gradient(145deg,#4b5059 0%,#292d35 50%,#17191f 100%)!important;
 border:1px solid #646b75!important;border-radius:20px 20px 8px 8px!important;
 box-shadow:inset 0 1px rgba(255,255,255,.2),0 9px 18px rgba(0,0,0,.4)!important;z-index:4!important;
}
.track-page .printer-top::before{
 content:''!important;position:absolute!important;left:30px!important;right:30px!important;top:18px!important;
 height:11px!important;border-radius:99px!important;background:#030405!important;
 border:1px solid #747b84!important;box-shadow:inset 0 3px 6px #000!important;
}
.track-page .printer-body{
 height:210px!important;position:relative!important;box-sizing:border-box!important;padding:28px 30px 0!important;
 background:linear-gradient(145deg,#30353d 0%,#1b1e24 58%,#101216 100%)!important;
 border:1px solid #4e555f!important;border-top:0!important;border-radius:8px 8px 25px 25px!important;
 box-shadow:inset 0 1px rgba(255,255,255,.09),0 18px 32px rgba(0,0,0,.36)!important;z-index:3!important;
}
.track-page .printer-slot{
 position:relative!important;height:17px!important;border-radius:10px!important;background:#030405!important;
 border:1px solid #707782!important;box-shadow:inset 0 3px 6px #000!important;z-index:9!important;
}
.track-page .printer-slot::after{
 content:''!important;position:absolute!important;left:12px!important;right:12px!important;top:6px!important;
 height:3px!important;border-radius:9px!important;background:#ff6500!important;
 box-shadow:0 0 13px rgba(255,101,0,.8)!important;animation:gzPrinterGlow .8s ease-in-out infinite alternate!important;
}
.track-page .printer-led{right:31px!important;top:35px!important;width:9px!important;height:9px!important;background:#ff6500!important;box-shadow:0 0 0 4px rgba(255,101,0,.13),0 0 15px rgba(255,101,0,.85)!important;animation:gzPrinterGlow .8s ease-in-out infinite alternate!important}
.track-page .printer-brand{margin:20px 0 0 2px!important;color:#fff!important;font-size:15px!important;font-weight:950!important;letter-spacing:.24em!important;text-shadow:0 2px 8px rgba(0,0,0,.55)!important}
.track-page .printer-printing-label{position:absolute!important;left:0!important;right:0!important;bottom:23px!important;text-align:center!important;color:#c4c8ce!important;font-size:10px!important;font-weight:900!important;letter-spacing:.12em!important;text-transform:uppercase!important}
.track-page .invoice-modal.printing .receipt-paper{
 display:block!important;position:absolute!important;left:50%!important;bottom:164px!important;width:74%!important;height:0!important;
 transform:translateX(-50%) translateZ(2px)!important;overflow:hidden!important;z-index:6!important;box-sizing:border-box!important;
 background:linear-gradient(90deg,#f3f3f3 0%,#fff 9%,#fff 92%,#ececec 100%)!important;
 border:1px solid #d8d8d8!important;border-bottom:0!important;border-radius:2px 2px 0 0!important;
 box-shadow:0 -5px 16px rgba(0,0,0,.2)!important;
 transition:height 3.5s cubic-bezier(.18,.62,.25,1)!important;
}
.track-page .invoice-modal.printing.paper-feeding .receipt-paper{height:258px!important}
.track-page .invoice-modal.printing .receipt-lines{
 display:flex!important;flex-direction:column!important;gap:10px!important;padding:15px 13px!important;
 opacity:0!important;transition:opacity .6s ease .35s!important;
}
.track-page .invoice-modal.printing.paper-feeding .receipt-lines{opacity:1!important}
.track-page .invoice-modal.printing .receipt-lines::before{
 content:'GRABZONE  •  ORDER RECEIPT'!important;display:block!important;font-size:9px!important;font-weight:950!important;
 letter-spacing:.8px!important;color:#222!important;border-bottom:1px dashed #aaa!important;padding-bottom:10px!important;margin-bottom:2px!important;
}
.track-page .invoice-modal.printing .receipt-lines i{display:block!important;height:4px!important;border-radius:2px!important;background:#c9c9c9!important;width:88%!important;flex:0 0 auto!important}
.track-page .invoice-modal.printing .receipt-lines i:nth-child(2){width:64%!important}
.track-page .invoice-modal.printing .receipt-lines i:nth-child(3){width:92%!important}
.track-page .invoice-modal.printing .receipt-lines i:nth-child(4){width:58%!important}
.track-page .invoice-modal.printing .receipt-lines i:nth-child(5){width:76%!important}
.track-page .invoice-modal.printing .invoice-sheet{
 position:absolute!important;z-index:10!important;left:50%!important;top:50%!important;
 width:min(760px,calc(100% - 32px))!important;max-height:88vh!important;overflow:auto!important;
 box-sizing:border-box!important;opacity:0!important;visibility:visible!important;pointer-events:none!important;
 transform:translate(-50%,-42%) scale(.42)!important;transform-origin:50% 50%!important;
 border-radius:8px!important;box-shadow:0 30px 90px rgba(0,0,0,.55)!important;
 transition:opacity .7s ease,transform 1.15s cubic-bezier(.16,.78,.2,1)!important;will-change:transform,opacity;
}
.track-page .invoice-modal.printing.invoice-reveal .receipt-printer{opacity:0!important;transform:translate3d(0,70px,-30px) scale(.88)!important}
.track-page .invoice-modal.printing.invoice-reveal .receipt-paper{opacity:0!important;height:258px!important;transition:opacity .45s ease!important}
.track-page .invoice-modal.printing.invoice-reveal .invoice-sheet{opacity:1!important;transform:translate(-50%,-50%) scale(1)!important;pointer-events:auto!important}
.track-page .invoice-modal.printed .invoice-printer-stage,.track-page .invoice-modal.printed .receipt-paper{display:none!important}
.track-page .invoice-modal.printed .invoice-sheet{opacity:1!important;pointer-events:auto!important;animation:gzInvoiceSettle .4s ease both}
@keyframes gzPrinterSettle{0%{opacity:0;transform:translate3d(0,65px,0) scale(.86) rotateX(7deg)}72%{opacity:1;transform:translate3d(0,-4px,0) scale(1.015) rotateX(0)}100%{opacity:1;transform:translate3d(0,0,0) scale(1) rotateX(0)}}
@keyframes gzPrinterGlow{from{opacity:.45}to{opacity:1}}
@keyframes gzInvoiceSettle{from{opacity:.9;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:600px){
 .track-page .receipt-printer{width:min(350px,88vw)!important}
 .track-page .printer-top{height:52px!important}
 .track-page .printer-body{height:190px!important;padding:24px 24px 0!important}
 .track-page .invoice-modal.printing .receipt-paper{bottom:148px!important;width:78%!important}
 .track-page .invoice-modal.printing.paper-feeding .receipt-paper{height:225px!important}
 .track-page .invoice-modal.printing .invoice-sheet{width:calc(100% - 20px)!important;max-height:88vh!important}
}
@media(prefers-reduced-motion:reduce){
 .track-page .invoice-modal.printing .receipt-printer,.track-page .invoice-modal.printing .receipt-paper,.track-page .invoice-modal.printing .receipt-lines,.track-page .invoice-modal.printing .invoice-sheet{animation:none!important;transition:none!important}
}

</style>

  <section class="track-card">

    </div>
  </section>
</main>
