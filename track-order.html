<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track Your Order | GrabZone</title>
<link rel="icon" href="favicon.png"><link rel="stylesheet" href="styles.css">
<style>
body{background:#f7f7f4}.track-wrap{max-width:760px;margin:70px auto;padding:20px}.track-card{background:#fff;border:1px solid #e5e5e1;border-radius:24px;padding:28px;box-shadow:0 10px 35px rgba(0,0,0,.06)}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em;color:#777}.track-card h1{margin:8px 0 8px;font-size:34px}.track-card p{color:#666}.track-form{display:flex;gap:10px;margin-top:22px}.track-form input{flex:1;border:1px solid #ddd;border-radius:12px;padding:14px;font:inherit;text-transform:uppercase}.track-form button{border:0;background:#111;color:#fff;border-radius:12px;padding:0 20px;font-weight:800;cursor:pointer}.track-msg{margin-top:12px;font-size:13px;font-weight:700}.result{margin-top:24px}.track-status-line{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin:18px 0;position:relative}.track-status-line::before{content:'';position:absolute;left:5%;right:5%;top:46px;height:2px;background:#ddd;z-index:0}.track-status-step{position:relative;z-index:1;min-height:112px;padding:13px 8px 10px;border:1px solid #e1e1dd;border-radius:14px;background:#f5f5f2;color:#777;font-size:12px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;box-sizing:border-box;gap:7px}.track-status-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#888;background:#fff;border:1px solid #ddd}.track-status-icon svg{width:19px;height:19px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.track-status-step.completed{background:#eef7ef;border-color:#b9d8bd;color:#176b2c}.track-status-step.completed .track-status-icon{color:#176b2c;border-color:#b9d8bd}.track-status-step.current{background:#111;color:#fff;border-color:#111;box-shadow:0 7px 18px rgba(0,0,0,.12)}.track-status-step.current .track-status-icon{background:#fff;color:#111;border-color:#fff}.track-status-step.cancelled{background:#fff0f0;color:#a11;border-color:#efc4c4}.track-status-step.cancelled .track-status-icon{color:#c33;border-color:#efc4c4}.help{margin-top:24px;padding-top:22px;border-top:1px solid #eee}.help-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.help-grid a{display:flex;align-items:center;justify-content:center;gap:9px;padding:12px;border:1px solid #ddd;border-radius:12px;text-decoration:none;color:#111;text-align:center;font-weight:800;background:#fff;transition:.15s ease}.help-grid a:hover{background:#f6f6f3;transform:translateY(-1px)}.help-icon{width:24px;height:24px;display:grid;place-items:center;border-radius:7px;color:#fff;flex:0 0 24px}.help-icon svg{width:16px;height:16px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.help-icon.instagram{background:linear-gradient(135deg,#833ab4,#fd1d1d 52%,#fcb045)}.help-icon.facebook{background:#1877f2}.help-icon.whatsapp{background:#25d366}.back-store{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:12px;padding:13px 16px;border-radius:12px;background:#111;color:#fff;text-decoration:none;font-weight:800;transition:.15s ease}.back-store:hover{transform:translateY(-1px);background:#222}.back-store svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.current-status{margin:4px 0 16px;padding:13px 15px;border-radius:13px;background:#111;color:#fff;font-size:14px;font-weight:800}.current-status small{display:block;margin-top:4px;color:#cfcfcf;font-size:12px;font-weight:600}.tracking-box{margin-top:18px;padding:18px;background:#f5f5f2;border-radius:16px}.tracking-link{display:inline-block;margin-top:10px;padding:11px 15px;background:#111;color:#fff;border-radius:10px;text-decoration:none;font-weight:800}.help{margin-top:24px;padding-top:22px;border-top:1px solid #eee}.help-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.help-grid a{display:flex;align-items:center;justify-content:center;gap:9px;padding:12px;border:1px solid #ddd;border-radius:12px;text-decoration:none;color:#111;text-align:center;font-weight:800;background:#fff;transition:.15s ease}.items{margin-top:18px;border-top:1px solid #eee;padding-top:15px}.item{display:flex;justify-content:space-between;padding:8px 0;font-size:13px}@media(max-width:760px){.track-status-line{grid-template-columns:repeat(4,minmax(0,1fr))}.track-status-line::before{display:none}}@media(max-width:600px){.track-wrap{margin:25px auto}.track-card{padding:20px}.track-card h1{font-size:28px}.track-form{flex-direction:column}.track-form button{height:48px}.track-status-line{grid-template-columns:repeat(2,minmax(0,1fr))}.help-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="track-wrap"><div class="track-card">
<div class="eyebrow">GRABZONE ORDER TRACKING</div><h1>Track Your Order</h1>
<p>Enter your Order Tracking ID to see the latest status of your order.</p>
<form class="track-form" id="trackForm"><input id="orderId" placeholder="GZ-XXXXXXXXXXXXXXX" autocomplete="off" required><button>Track Order</button></form>
<div id="msg" class="track-msg"></div><div id="result" class="result" hidden></div>
<div class="help"><b>Need help with your order?</b><div class="help-grid">
<a id="ig" target="_blank" rel="noopener"><span class="help-icon instagram"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.5"/><circle cx="17.3" cy="6.8" r="1" fill="currentColor" stroke="none"/></svg></span><span>Instagram</span></a>
<a id="fb" target="_blank" rel="noopener"><span class="help-icon facebook"><svg viewBox="0 0 24 24"><path d="M14 8h3V4.5h-3c-3 0-5 2-5 5V12H6v3.5h3V21h3.5v-5.5H16l.7-3.5h-4.2V9.7c0-1.1.5-1.7 1.5-1.7Z" fill="currentColor" stroke="none"/></svg></span><span>Facebook</span></a>
<a id="wa" target="_blank" rel="noopener"><span class="help-icon whatsapp"><svg viewBox="0 0 24 24"><path d="M7 20l1.2-3A7.8 7.8 0 1 1 17 18.3L14 19.5 7 20Z"/><path d="M9.5 9.3c.2 1.4 2 3.4 3.3 4.1.5.3 1 .3 1.5-.1l.7-.6"/></svg></span><span>WhatsApp</span></a>
</div><a class="back-store" href="index.html"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></svg><span>Back to Store</span></a></div>
</div></div>
<script src="config.js"></script>
<script src="d1-client.js?v=20260902cloudflarefix1"></script><script>
(()=> {
 const C=window.GRABZONE_CONFIG||{};
 const $=id=>document.getElementById(id);
 const statuses=['New','Contacting','Confirmed','Processing','Shipped','Delivered','Cancelled'];
 const statusIcons={
   New:'<svg viewBox="0 0 24 24"><path d="M4 9.5 12 4l8 5.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5v-9Z"/><path d="M8 20v-6h8v6"/></svg>',
   Contacting:'<svg viewBox="0 0 24 24"><path d="M7 4h3l1.5 4-2 1.5a13 13 0 0 0 5 5l1.5-2 4 1.5v3c0 1-1 1.5-2 1.5C11 18.5 5.5 13 5.5 6 5.5 5 6 4 7 4Z"/></svg>',
   Confirmed:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg>',
   Processing:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>',
   Shipped:'<svg viewBox="0 0 24 24"><path d="M3 6h11v11H3zM14 10h4l3 3v4h-7z"/><circle cx="7" cy="19" r="1.5"/><circle cx="18" cy="19" r="1.5"/></svg>',
   Delivered:'<svg viewBox="0 0 24 24"><path d="M5 12h10M11 8l4 4-4 4"/><path d="M4 5h16v14H4z"/></svg>',
   Cancelled:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m9 9 6 6M15 9l-6 6"/></svg>'
 };

 async function loadSocial(){
   try{
     if(window.grabzoneD1){
       const sb=window.grabzoneD1;
       const q=await sb.from('site_settings').select('whatsapp,instagram,messenger').eq('id',1).maybeSingle();
       const s=q.data||{};
       const wa=String(s.whatsapp||C.whatsapp||'').trim();
       const ig=String(s.instagram||C.instagram||'').trim();
       const fb=String(s.messenger||C.messenger||'').trim();
       if(wa&&!wa.includes('XXXXXXXX')) $('wa').href=wa; else $('wa').removeAttribute('href');
       if(ig&&!ig.includes('yourstore')) $('ig').href=ig; else $('ig').removeAttribute('href');
       if(fb&&!fb.includes('yourpage')) $('fb').href=fb; else $('fb').removeAttribute('href');
     }
   }catch(e){console.error('Social links:',e)}
 }
 loadSocial();

 function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
 const money=v=>'৳'+Number(v||0).toLocaleString('en-BD');
 function render(payload){
   const o=payload.order||payload;
   const vendorOrders=Array.isArray(payload.vendor_orders)?payload.vendor_orders:[];
   const shipments=Array.isArray(payload.shipments)?payload.shipments:[];
   const statusMap={New:0,Contacting:1,Confirmed:2,Processing:3,'Partially Shipped':4,Shipped:4,Delivered:5,Completed:5,Cancelled:6};
   const currentIndex=statusMap[o.status]??0;
   const descriptions={New:'Order received',Contacting:'We are contacting you to confirm the order',Confirmed:'Order confirmed successfully',Processing:'Your order is being prepared', 'Partially Shipped':'Some seller packages are on the way',Shipped:'Your order has been shipped',Delivered:'Order delivered',Completed:'All seller packages have been delivered',Cancelled:'This order has been cancelled'};
   $('result').hidden=false;
   const statusMarkup=['New','Contacting','Confirmed','Processing','Shipped','Delivered','Cancelled'].map((s,i)=>{
     const cls=o.status==='Cancelled'?(s==='Cancelled'?'cancelled current':''):(i<currentIndex?'completed':(i===currentIndex||((o.status==='Partially Shipped')&&s==='Shipped')?'current':''));
     return '<div class="track-status-step '+cls+'"><span class="track-status-icon">'+statusIcons[s]+'</span><span>'+esc(s)+'</span></div>';
   }).join('');
   const vendorMarkup=vendorOrders.length?'<div style="display:grid;gap:14px;margin-top:18px">'+vendorOrders.map(v=>{
     const vs=String(v.status||'New');
     const items=(v.items||[]).map(i=>'<div class="item"><span>'+esc(i.product_name)+' × '+Number(i.quantity||1)+'</span><span>'+money(Number(i.line_total||0))+'</span></div>').join('');
     const sellerShip=shipments.filter(s=>String(s.vendor_id)===String(v.vendor_id)||String(s.vendor_order_id)===String(v.id));
     const shipMarkup=sellerShip.length?sellerShip.map(s=>'<div style="margin-top:9px;padding:10px;border:1px solid #e4e4df;border-radius:12px"><b>'+esc(s.shipment_tracking_id)+'</b><div style="font-size:12px;color:#666;margin-top:4px">'+esc(s.courier_name||'Courier pending')+(s.courier_tracking_number?' · '+esc(s.courier_tracking_number):'')+' · '+esc(s.status||'Processing')+'</div>'+(s.courier_tracking_url?'<a class="tracking-link" href="'+esc(s.courier_tracking_url)+'" target="_blank" rel="noopener">Track with courier →</a>':'')+'</div>').join(''):'<div style="font-size:12px;color:#777;margin-top:8px">Seller shipment tracking will appear after the vendor creates a shipment.</div>';
     return '<div class="tracking-box"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><b>'+esc(v.vendor_name)+'</b><div style="font-size:12px;color:#777;margin-top:3px">'+esc(v.vendor_slug||'')+'</div></div><strong>'+esc(vs)+'</strong></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;font-size:12px"><div><span style="color:#777">Items</span><br><b>'+money(v.subtotal)+'</b></div><div><span style="color:#777">Delivery</span><br><b>'+money(v.shipping_charge)+'</b></div><div><span style="color:#777">Seller total</span><br><b>'+money(v.total)+'</b></div></div><div class="items" style="margin-top:12px">'+items+'</div>'+shipMarkup+'</div>';
   }).join('')+'</div>':'';
   $('result').innerHTML='<b>Order #'+esc(o.order_number)+'</b><div class="current-status">Current Status: '+esc(o.status||'Unknown')+'<small>'+esc(descriptions[o.status]||'Your order status has been updated')+'</small></div><div class="track-status-line" aria-label="Order status progress">'+statusMarkup+'</div>'+vendorMarkup+(shipments.length?'':'<div class="tracking-box">Seller shipment tracking details will appear here once packages are shipped.</div>')+'<div class="tracking-box"><b>Delivery Address</b><div style="margin-top:5px">'+esc([o.address,o.upazila,o.district,o.division].filter(Boolean).join(', '))+'</div></div>';
 }
 async function getOrder(id){
   const cleanId=String(id||'').trim().toUpperCase();
   if(!cleanId)throw new Error('Please enter your Order Tracking ID.');
   const response=await fetch((C.backendUrl||'')+'/api/marketplace/track?trackingId='+encodeURIComponent(cleanId),{cache:'no-store'});
   let body={};try{body=await response.json()}catch{}
   if(!response.ok)throw new Error(body.error||'Order not found. Please check your Tracking ID.');
   return body;
 }

 $('trackForm').addEventListener('submit',async e=>{
   e.preventDefault();
   const msg=$('msg'),result=$('result');
   msg.textContent='Checking order…'; result.hidden=true;
   try{
     const d=await getOrder($('orderId').value);
     if(!d?.order) throw new Error('Order not found. Please check your Order ID.');
     render(d.order);
     msg.textContent='Order found ✓';
   }catch(e){
     console.error('Track order:',e);
     msg.textContent=e.message||'Could not load the order. Please try again.';
   }
 });
const params=new URLSearchParams(location.search);
 const initialTracking=params.get('tracking')||'';
 if(initialTracking){$('orderId').value=initialTracking.toUpperCase();setTimeout(()=>$('trackForm').requestSubmit(),50)}
})();
</script></body></html>
