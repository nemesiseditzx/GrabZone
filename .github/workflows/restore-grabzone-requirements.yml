name: Restore GrabZone required behaviors
on:
  push:
    paths:
      - '.github/workflows/restore-grabzone-requirements.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore required behavior
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          base='8f0b2cd8665fd7202d789c2663040e92ce5f9fb3'
          def show(path):
              return subprocess.check_output(['git','show',f'{base}:{path}'],text=True)
          Path('checkout.html').write_text(show('checkout.html'))
          Path('checkout.js').write_text(show('checkout.js'))

          cur=Path('worker.mjs').read_text()
          old=show('worker.mjs')
          current_pin='if(fn===\"rewards_admin_view_pin\"){if(!isAdmin)throw new Error(\"Unauthorized.\");throw new Error(\"For security, Support cannot view a customer’s existing Rewards PIN. Send a PIN reset email instead.\");}'
          previous_pin='if(fn===\"rewards_admin_view_pin\"){if(!isAdmin)throw new Error(\"Unauthorized.\");const id=String(a.p_member_id||\"\"),m=(await q(env,\"SELECT * FROM rewards_members WHERE id=? OR member_id=? LIMIT 1\",[id,id])).results?.[0];if(!m)throw new Error(\"Rewards member not found.\");const pin=await decryptRewardPin(m.pin_encrypted,env);await rewardAudit(env,m.id,a.p_admin_id||null,\"PIN_VIEWED\",String(a.p_reason||\"Customer support\"),{});await sendRewardsEmail(env,m.email,\"GrabZone Rewards security notice\",\"Rewards PIN accessed by Support\",\"<p>Your Rewards PIN was accessed by an authorized GrabZone Support admin for customer support.</p><p>If you did not request support, please contact us.</p>\");return{data:{pin}}}'
          if cur.count(current_pin)!=1:
              raise SystemExit(f'Expected exactly one disabled PIN handler, found {cur.count(current_pin)}')
          if old.count(previous_pin)!=1:
              raise SystemExit('Previous PIN handler anchor not found in known-good base')
          cur=cur.replace(current_pin,previous_pin)
          Path('worker.mjs').write_text(cur)
          PY

          grep -q 'Email Address <i>\*</i>' checkout.html
          grep -q 'required>' checkout.html
          grep -q '!d.customer_name||!d.phone||!d.email' checkout.js
          grep -q 'gzMShowPin' rewards-admin.js
          grep -q 'rewards_admin_view_pin' worker.mjs
          grep -q 'rewards_admin_send_pin_reset' worker.mjs
          node --check worker.mjs
          node --check checkout.js
          node --check rewards-admin.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add checkout.html checkout.js worker.mjs rewards-admin.js
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Restore admin PIN view and mandatory checkout email'
          git push