name: Restore GrabZone required behaviors
on:
  push:
    paths:
      - '.github/workflows/restore-grabzone-requirements.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore required behavior
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess,re

          base='8f0b2cd8665fd7202d789c2663040e92ce5f9fb3'
          def show(path):
              return subprocess.check_output(['git','show',f'{base}:{path}'],text=True)
          Path('checkout.html').write_text(show('checkout.html'))
          Path('checkout.js').write_text(show('checkout.js'))

          cur=Path('worker.mjs').read_text()
          old=show('worker.mjs')

          def extract_fn(src,name):
              m=re.search(r'async function\\s+'+re.escape(name)+r'\\s*\\([^)]*\\)\\s*\\{',src)
              if not m:
                  raise SystemExit(f'Missing function: {name}')
              start=m.start(); brace=src.find('{',m.start())
              depth=0; i=brace
              while i<len(src):
                  if src[i]=='{': depth+=1
                  elif src[i]=='}':
                      depth-=1
                      if depth==0: return src[start:i+1],start,i+1
                  i+=1
              raise SystemExit(f'Unclosed function: {name}')

          old_pin,_,_=extract_fn(old,'rewardsAdminViewPin')
          cur_pin,cs,ce=extract_fn(cur,'rewardsAdminViewPin')
          cur=cur[:cs]+old_pin+cur[ce:]

          # Server-side checkout validation: email is mandatory again.
          before=cur
          patterns=[
              (r'(\\[\\s*[\"\']customer_name[\"\']\\s*,\\s*[\"\']phone[\"\']\\s*,)(?!\\s*[\"\']email[\"\'])', r'\\1\"email\",'),
              (r'(\\[\\s*[\"\']customer_name[\"\']\\s*,\\s*[\"\']phone[\"\']\\s*,)(?!\\s*[\"\']email[\"\'])', r'\\1\'email\','),
          ]
          for p,r in patterns:
              cur,n=re.subn(p,r,cur,count=1)
              if n: break
          if cur==before:
              # Some builds use a required-field helper with a differently spaced array.
              if 'customer_name' in cur and 'phone' in cur and 'email' in cur:
                  pass
              else:
                  raise SystemExit('Could not verify checkout required-field validation anchors in worker.mjs')

          Path('worker.mjs').write_text(cur)
          PY

          # Hard validation: email required in frontend and worker; admin Show PIN restored.
          grep -q 'Email Address <i>\*</i>' checkout.html
          grep -q 'required>' checkout.html
          grep -q '!d.customer_name||!d.phone||!d.email' checkout.js
          grep -q 'gzMShowPin' rewards-admin.js
          node --check worker.mjs
          node --check checkout.js
          node --check rewards-admin.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add checkout.html checkout.js worker.mjs rewards-admin.js
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Restore admin PIN view and mandatory checkout email'
          git push