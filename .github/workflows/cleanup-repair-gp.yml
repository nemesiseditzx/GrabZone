name: Repair Delivered GP Cleanup
on:
  push:
    paths:
      - '.github/workflows/cleanup-repair-gp.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Repair GZ-0003 exactly once
        shell: bash
        run: |
          npm i wrangler@4 --no-save
          cat > /tmp/repair.sql <<'SQL'
          BEGIN TRANSACTION;
          INSERT OR IGNORE INTO customer_points(phone,points,total_earned,total_redeemed,updated_at)
          SELECT rm.phone,0,0,0,datetime('now')
          FROM orders o JOIN rewards_members rm ON rm.phone=o.phone AND rm.status='Active'
          WHERE o.order_number='GZ-0003' AND o.status='Delivered' LIMIT 1;
          WITH calc AS (
            SELECT o.id,o.phone,
              CAST(MAX(0,COALESCE(o.subtotal,0)-COALESCE(o.referral_discount,0)-COALESCE(o.rewards_voucher_discount,0)-COALESCE(o.mystery_discount,0)) *
                CASE
                  WHEN rm.tier_override='Platinum' THEN 5
                  WHEN rm.tier_override='Gold' THEN 3
                  WHEN rm.tier_override='Silver' THEN 2
                  WHEN rm.tier_override='Member' THEN 1
                  WHEN (SELECT COALESCE(SUM(l.qualifying_points),0) FROM grabpoints_ledger l WHERE l.phone=o.phone AND l.created_at>=datetime('now','-365 days'))>=5000 THEN 5
                  WHEN (SELECT COALESCE(SUM(l.qualifying_points),0) FROM grabpoints_ledger l WHERE l.phone=o.phone AND l.created_at>=datetime('now','-365 days'))>=2000 THEN 3
                  WHEN (SELECT COALESCE(SUM(l.qualifying_points),0) FROM grabpoints_ledger l WHERE l.phone=o.phone AND l.created_at>=datetime('now','-365 days'))>=500 THEN 2
                  ELSE 1
                END / 10 AS INTEGER) AS pts
            FROM orders o JOIN rewards_members rm ON rm.phone=o.phone AND rm.status='Active'
            WHERE o.order_number='GZ-0003' AND o.status='Delivered' LIMIT 1
          )
          UPDATE customer_points
          SET points=points+(SELECT pts FROM calc),
              total_earned=total_earned+(SELECT pts FROM calc),
              updated_at=datetime('now')
          WHERE phone=(SELECT phone FROM calc)
            AND (SELECT pts FROM calc)>0
            AND NOT EXISTS (SELECT 1 FROM grabpoints_ledger l WHERE l.order_id=(SELECT id FROM calc) AND (l.type='earn' OR l.type LIKE 'earn:%'));
          WITH calc AS (
            SELECT o.id,o.phone,
              CAST(MAX(0,COALESCE(o.subtotal,0)-COALESCE(o.referral_discount,0)-COALESCE(o.rewards_voucher_discount,0)-COALESCE(o.mystery_discount,0)) *
                CASE
                  WHEN rm.tier_override='Platinum' THEN 5
                  WHEN rm.tier_override='Gold' THEN 3
                  WHEN rm.tier_override='Silver' THEN 2
                  WHEN rm.tier_override='Member' THEN 1
                  WHEN (SELECT COALESCE(SUM(l.qualifying_points),0) FROM grabpoints_ledger l WHERE l.phone=o.phone AND l.created_at>=datetime('now','-365 days'))>=5000 THEN 5
                  WHEN (SELECT COALESCE(SUM(l.qualifying_points),0) FROM grabpoints_ledger l WHERE l.phone=o.phone AND l.created_at>=datetime('now','-365 days'))>=2000 THEN 3
                  WHEN (SELECT COALESCE(SUM(l.qualifying_points),0) FROM grabpoints_ledger l WHERE l.phone=o.phone AND l.created_at>=datetime('now','-365 days'))>=500 THEN 2
                  ELSE 1
                END / 10 AS INTEGER) AS pts
            FROM orders o JOIN rewards_members rm ON rm.phone=o.phone AND rm.status='Active'
            WHERE o.order_number='GZ-0003' AND o.status='Delivered' LIMIT 1
          )
          INSERT INTO grabpoints_ledger(id,phone,order_id,points,type,reference,reason,balance_after,qualifying_points,created_at)
          SELECT lower(hex(randomblob(16))),c.phone,c.id,c.pts,'earn:repair:GZ-0003','ORD-GZ-0003','Delivered order GP repair',cp.points,c.pts,datetime('now')
          FROM calc c JOIN customer_points cp ON cp.phone=c.phone
          WHERE c.pts>0
            AND NOT EXISTS (SELECT 1 FROM grabpoints_ledger l WHERE l.order_id=c.id AND (l.type='earn' OR l.type LIKE 'earn:%'));
          UPDATE grabpoints_ledger
          SET balance_after=(SELECT cp.points FROM customer_points cp WHERE cp.phone=grabpoints_ledger.phone)
          WHERE order_id=(SELECT id FROM orders WHERE order_number='GZ-0003' LIMIT 1) AND type='earn:repair:GZ-0003';
          COMMIT;
          SQL
          npx wrangler d1 execute grabzone-db-test --remote --file=/tmp/repair.sql
      - name: Remove temporary workflows
        if: success()
        run: |
          git rm .github/workflows/repair-gz0003-gp.yml .github/workflows/cleanup-repair-gp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary GP repair workflows'
          git push
