name: Repair GrabPoints JS

on:
  push:
    branches:
      - feature/animated-grabpoints-auth

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good Rewards script and repair core syntax
        shell: bash
        run: |
          set -euo pipefail

          git cat-file -e fa95cad89c98e3d0ee4ea08354ea5e8e611004f0
          git cat-file -p fa95cad89c98e3d0ee4ea08354ea5e8e611004f0 > rewards.js

          python3 - <<'PY'
          from pathlib import Path
          p = Path('grabpoints-ui-core.js')
          s = p.read_text(encoding='utf-8')
          marker = "})();\\n\\n/* GRABZONE FORGOT PIN V4 */"
          if marker in s:
              s = s.replace(marker, "})();\n\n/* GRABZONE FORGOT PIN V4 */", 1)
          if s.endswith("})();\\n"):
              s = s[:-2] + "\n"
          p.write_text(s, encoding='utf-8')
          PY

          node --check rewards.js
          node --check grabpoints-ui-core.js

      - name: Remove temporary repair workflows
        shell: bash
        run: |
          rm -f .github/workflows/repair-rewards-syntax.yml
          rm -f .github/workflows/fix-forgot-pin-send-v2.yml

      - name: Commit repaired feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rewards.js grabpoints-ui-core.js .github/workflows/repair-rewards-syntax.yml .github/workflows/fix-forgot-pin-send-v2.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix GrabPoints startup syntax errors"
          git push origin HEAD:feature/animated-grabpoints-auth
