name: GrabZone Main Integration Validation

on:
  push:
    branches:
      - integration/main-reconcile-2026-11-26
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript and module syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f \( -name '*.mjs' -o -name '*.js' \) -print0 | xargs -0 -n1 node --check
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - name: Validate Cloudflare production Worker bundle (dry run only)
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc --outdir /tmp/grabzone-main-dry-run
