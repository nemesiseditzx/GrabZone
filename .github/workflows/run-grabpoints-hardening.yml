name: Run GrabPoints hardening

on:
  push:
    branches:
      - feature/animated-grabpoints-auth

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/animated-grabpoints-auth
          fetch-depth: 0
      - name: Apply hardening rewrite
        run: python3 scripts/harden_grabpoints.py
      - name: Validate JavaScript
        run: |
          node --check rewards.js
          node --check worker.mjs
          node --check grabpoints-ui-final.js
          node --check grabpoints-redeem-flow.js
      - name: Verify invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          r=Path('rewards.js').read_text(); h=Path('grabpoints.html').read_text(); w=Path('worker.mjs').read_text()
          assert 'GRABZONE FORGOT PIN V7' not in r
          assert 'gzFpV7' not in r
          assert 'function showVerify(email)' in r
          assert 'function verifyCode(email,code)' in r
          assert 'function showReset(t)' in r
          assert 'grabpoints-redeem-animation.js' not in h
          assert 'cashback on member orders' in w
          assert 'cashbackBase' in w
          assert 'EXISTS (SELECT 1 FROM rewards_tx_guard WHERE ok=1)' in w
          print('GrabPoints invariants: PASS')
          PY
      - name: Commit hardening changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rewards.js grabpoints.html grabpoints-ui-final.js worker.mjs
          git commit -m "Harden GrabPoints end-to-end flow"
          git push origin HEAD:feature/animated-grabpoints-auth
