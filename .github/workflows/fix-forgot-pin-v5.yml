name: Patch Forgot PIN UI V5
on:
  push:
    branches: [feature/animated-grabpoints-auth]
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Rewards UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('rewards.js')
          s=p.read_text(encoding='utf-8')
          marker='/* GRABZONE FORGOT PIN V5 */'
          if marker in s:
              raise SystemExit('already patched')
          css=r'''
          
          /* GRABZONE FORGOT PIN V5 */
          #gzRewardsApp.gz-fp-active .gz-fp-screen{position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(145deg,#171717 0%,#211d19 52%,#3a2418 100%);color:#fff;border-radius:22px;padding:28px;box-shadow:0 25px 70px rgba(30,18,8,.22);animation:gzFpV5In .55s cubic-bezier(.16,1,.3,1) both}
          #gzRewardsApp.gz-fp-active .gz-fp-screen:before{content:'';position:absolute;width:330px;height:330px;right:-165px;top:-165px;border:1px solid #ff8a0055;border-radius:50%;box-shadow:0 0 0 32px #ff8a0010,0 0 0 64px #ff8a0007;animation:gzFpV5Orbit 10s linear infinite;pointer-events:none;z-index:-1}
          #gzRewardsApp.gz-fp-active .gz-fp-screen:after{content:'';position:absolute;width:150px;height:150px;left:-75px;bottom:-75px;border-radius:50%;background:#ff6b0012;filter:blur(2px);pointer-events:none;z-index:-1}
          #gzRewardsApp.gz-fp-active .gz-fp-icon{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:#fff;color:#171717;font-size:29px;box-shadow:0 14px 35px #0005;animation:gzFpV5Icon .7s cubic-bezier(.2,.9,.2,1) both}
          #gzRewardsApp.gz-fp-active .gz-fp-kicker{display:inline-flex;align-items:center;gap:7px;margin:18px 0 10px;padding:7px 10px;border-radius:999px;border:1px solid #ff9a0050;background:#ff8a0012;color:#ffb15c;font:900 9px/1 system-ui;letter-spacing:.14em;text-transform:uppercase}
          #gzRewardsApp.gz-fp-active .gz-fp-kicker i{width:6px;height:6px;border-radius:50%;background:#ff8a00;box-shadow:0 0 0 5px #ff8a0012,0 0 14px #ff8a00}
          #gzRewardsApp.gz-fp-active .gz-fp-screen h2{margin:0 0 8px;color:#fff;font-size:34px;letter-spacing:-.045em;line-height:1.02}
          #gzRewardsApp.gz-fp-active .gz-fp-screen p{color:#d8d1cb;max-width:720px}
          #gzRewardsApp.gz-fp-active .gz-fp-progress{display:flex;align-items:center;gap:8px;margin:20px 0 18px}
          #gzRewardsApp.gz-fp-active .gz-fp-progress b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid #ffffff22;background:#ffffff0b;color:#aaa;font:900 10px system-ui}
          #gzRewardsApp.gz-fp-active .gz-fp-progress b.on{background:#ff6b00;color:#fff;border-color:#ff6b00;box-shadow:0 0 0 6px #ff6b0012;animation:gzFpV5Pop .45s both}
          #gzRewardsApp.gz-fp-active .gz-fp-progress i{width:48px;height:1px;background:#ffffff24}
          #gzRewardsApp.gz-fp-active .gz-fp-field{display:grid;gap:7px;margin-top:14px}
          #gzRewardsApp.gz-fp-active .gz-fp-field label{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#bdb3aa}
          #gzRewardsApp.gz-fp-active .gz-fp-field input{height:58px;border:1px solid #ffffff1f!important;border-radius:15px!important;background:#fff!important;color:#171717!important;padding:0 16px!important;outline:none;box-shadow:0 8px 20px #00018!important;transition:.22s!important;animation:gzFpV5Field .45s .14s both}
          #gzRewardsApp.gz-fp-active .gz-fp-field input:focus{border-color:#ff8a00!important;box-shadow:0 0 0 4px #ff8a0020,0 12px 28px #00025!important;transform:translateY(-1px)}
          #gzRewardsApp.gz-fp-active .gz-fp-actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,.34fr);gap:10px;margin-top:14px}
          #gzRewardsApp.gz-fp-active .gz-fp-actions button{height:56px;border-radius:15px!important;font-weight:900!important;transition:.2s!important;animation:gzFpV5Field .45s .2s both}
          #gzRewardsApp.gz-fp-active .gz-fp-actions .gz-fp-primary{background:linear-gradient(100deg,#ff9d00,#ff5b00)!important;color:#171717!important;border:0!important;box-shadow:0 14px 30px #ff6b0030!important}
          #gzRewardsApp.gz-fp-active .gz-fp-actions .gz-fp-primary:hover{transform:translateY(-2px)!important;box-shadow:0 18px 36px #ff6b0040!important}
          #gzRewardsApp.gz-fp-active .gz-fp-actions .gz-fp-secondary{background:#ffffff0a!important;color:#fff!important;border:1px solid #ffffff25!important}
          #gzRewardsApp.gz-fp-active .gz-fp-actions .gz-fp-secondary:hover{background:#fff!important;color:#171717!important}
          #gzRewardsApp.gz-fp-active .gz-fp-msg{min-height:20px;margin-top:10px;color:#ffb5a8;font-size:12px;font-weight:800}
          #gzRewardsApp.gz-fp-active .gz-fp-note{display:flex;gap:10px;align-items:flex-start;margin-top:18px;padding:12px 14px;border:1px solid #ffffff14;border-radius:14px;background:#ffffff08;color:#bdb3aa;font-size:11px;line-height:1.5}
          #gzRewardsApp.gz-fp-active .gz-fp-note strong{color:#fff}
          #gzRewardsApp.gz-fp-active .gz-fp-otp{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-top:16px}
          #gzRewardsApp.gz-fp-active .gz-fp-otp input{height:56px!important;text-align:center!important;font-size:22px!important;font-weight:900!important;padding:0!important;border-radius:14px!important}
          #gzRewardsApp.gz-fp-active .gz-fp-reset-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
          @keyframes gzFpV5In{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
          @keyframes gzFpV5Icon{0%{opacity:0;transform:translateY(12px) rotate(-12deg) scale(.72)}65%{transform:translateY(-4px) rotate(4deg) scale(1.07)}100%{opacity:1;transform:none}}
          @keyframes gzFpV5Orbit{to{transform:rotate(360deg)}}
          @keyframes gzFpV5Field{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
          @keyframes gzFpV5Pop{0%{transform:scale(.5);opacity:.2}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
          @media(max-width:760px){#gzRewardsApp.gz-fp-active .gz-fp-screen{padding:20px;border-radius:19px}#gzRewardsApp.gz-fp-active .gz-fp-screen h2{font-size:28px}#gzRewardsApp.gz-fp-active .gz-fp-actions{grid-template-columns:1fr}#gzRewardsApp.gz-fp-active .gz-fp-otp{gap:6px}#gzRewardsApp.gz-fp-active .gz-fp-otp input{height:50px!important}}
          @media(prefers-reduced-motion:reduce){#gzRewardsApp.gz-fp-active .gz-fp-screen,#gzRewardsApp.gz-fp-active .gz-fp-screen:before,#gzRewardsApp.gz-fp-active .gz-fp-icon,#gzRewardsApp.gz-fp-active .gz-fp-progress b,#gzRewardsApp.gz-fp-active .gz-fp-field input,#gzRewardsApp.gz-fp-active .gz-fp-actions button{animation:none!important;transition:none!important}}
          '''
          marker_css='\.gz-auth-shell{padding:8px}.gz-auth-shell .eyebrow{font-size:10px;letter-spacing:.2em;color:#5035d5;font-weight:900}'
          if marker_css not in s:
              raise SystemExit('css marker not found')
          s=s.replace(marker_css, marker_css+css, 1)
          old="async function forgot(){const b=$('gzRewardsBody');b.innerHTML='<div class=\\\"eyebrow\\\">PIN RECOVERY</div><h2>Forgot your PIN?</h2><p>Enter the email attached to your Rewards account. A verification code will be sent only to that email.</p><div class=\\\"gz-rewards-grid\\\"><input id=\\\"grResetEmail\\\" type=\\\"email\\\" placeholder=\\\"Registered Rewards email\\\"><button class=\\\"gz-rewards-btn\\\" id=\\\"grSendCode\\\">Send Verification Code</button></div><div id=\\\"grMsg\\\" class=\\\"gz-rewards-msg\\\"></div><button class=\\\"gz-rewards-btn alt\\\" id=\\\"grBackLogin\\\">Back to Login</button>';$('grSendCode').onclick=sendCode;$('grBackLogin').onclick=()=>showAuth('login')}"
          new="""async function forgot(){const b=$('gzRewardsBody'),app=$('gzRewardsApp');app?.classList.add('gz-fp-active');b.innerHTML='<div class=\"gz-fp-screen\"><div class=\"gz-fp-icon\">🔐</div><div class=\"gz-fp-kicker\"><i></i>SECURE PIN RECOVERY</div><h2>Forgot your PIN?</h2><p>Recover your Rewards account securely. We will send a one-time verification code to your registered email.</p><div class=\"gz-fp-progress\"><b class=\"on\">1</b><i></i><b>2</b><i></i><b>3</b></div><div class=\"gz-fp-field\"><label>Registered Rewards email</label><input id=\"grResetEmail\" type=\"email\" placeholder=\"name@example.com\" autocomplete=\"email\"></div><div class=\"gz-fp-actions\"><button class=\"gz-fp-primary\" id=\"grSendCode\">Send Verification Code →</button><button class=\"gz-fp-secondary\" id=\"grBackLogin\">Back to Login</button></div><div id=\"grMsg\" class=\"gz-fp-msg\"></div><div class=\"gz-fp-note\">🛡️ <span><strong>Private & secure.</strong> The verification code is sent only to the email registered with your Rewards account.</span></div></div>';$('grSendCode').onclick=sendCode;$('grBackLogin').onclick=()=>{app?.classList.remove('gz-fp-active');showAuth('login')}}"""
          if old not in s:
              raise SystemExit('forgot function pattern not found')
          s=s.replace(old,new,1)
          old2="function showVerify(email){const b=$('gzRewardsBody');b.innerHTML='<div class=\\\"eyebrow\\\">EMAIL VERIFICATION</div><h2>Check your email</h2><p>Enter the 6-digit code sent to <b>'+esc(email)+'</b>.</p><div class=\\\"gz-rewards-grid\\\"><input id=\\\"grOtp\\\" inputmode=\\\"numeric\\\" maxlength=\\\"6\\\" placeholder=\\\"6-digit code\\\"><button class=\\\"gz-rewards-btn\\\" id=\\\"grVerify\\\">Verify Code</button></div><div id=\\\"grMsg\\\" class=\\\"gz-rewards-msg\\\"></div>';$('grVerify').onclick=()=>verifyCode(email)}"
          new2="""function showVerify(email){const b=$('gzRewardsBody'),app=$('gzRewardsApp');app?.classList.add('gz-fp-active');b.innerHTML='<div class=\"gz-fp-screen\"><div class=\"gz-fp-icon\">✉️</div><div class=\"gz-fp-kicker\"><i></i>EMAIL VERIFICATION</div><h2>Check your email</h2><p>Enter the 6-digit code sent to <b style=\"color:#fff\">'+esc(email)+'</b>.</p><div class=\"gz-fp-progress\"><b class=\"on\">1</b><i></i><b class=\"on\">2</b><i></i><b>3</b></div><div class=\"gz-fp-otp\"><input inputmode=\"numeric\" maxlength=\"1\"><input inputmode=\"numeric\" maxlength=\"1\"><input inputmode=\"numeric\" maxlength=\"1\"><input inputmode=\"numeric\" maxlength=\"1\"><input inputmode=\"numeric\" maxlength=\"1\"><input inputmode=\"numeric\" maxlength=\"1\"></div><input id=\"grOtp\" type=\"hidden\"><div class=\"gz-fp-actions\"><button class=\"gz-fp-primary\" id=\"grVerify\">Verify Code →</button><button class=\"gz-fp-secondary\" id=\"grBackLogin\">Back to Login</button></div><div id=\"grMsg\" class=\"gz-fp-msg\"></div><div class=\"gz-fp-note\">📩 <span>Enter the one-time code from your email. It expires for your security.</span></div></div>';const boxes=[...b.querySelectorAll('.gz-fp-otp input')],hidden=$('grOtp');boxes.forEach((x,i)=>{x.addEventListener('input',()=>{x.value=x.value.replace(/\\D/g,'').slice(0,1);if(x.value&&boxes[i+1])boxes[i+1].focus();hidden.value=boxes.map(q=>q.value).join('')});x.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!x.value&&boxes[i-1])boxes[i-1].focus()});x.addEventListener('paste',e=>{e.preventDefault();const v=(e.clipboardData.getData('text')||'').replace(/\\D/g,'').slice(0,6);boxes.forEach((q,j)=>q.value=v[j]||'');hidden.value=v;if(v.length===6)boxes[5].focus()})});$('grVerify').onclick=()=>verifyCode(email);$('grBackLogin').onclick=()=>{app?.classList.remove('gz-fp-active');showAuth('login')}}"""
          if old2 not in s:
              raise SystemExit('verify function pattern not found')
          s=s.replace(old2,new2,1)
          old3="function showReset(t){const b=$('gzRewardsBody');b.innerHTML='<div class=\\\"eyebrow\\\">RESET PIN</div><h2>Create a new PIN</h2><div class=\\\"gz-rewards-grid\\\"><input id=\\\"grNewPin\\\" type=\\\"password\\\" inputmode=\\\"numeric\\\" maxlength=\\\"6\\\" placeholder=\\\"New 4–6 digit PIN\\\"><input id=\\\"grNewPin2\\\" type=\\\"password\\\" inputmode=\\\"numeric\\\" maxlength=\\\"6\\\" placeholder=\\\"Confirm new PIN\\\"><button class=\\\"gz-rewards-btn\\\" id=\\\"grReset\\\">Reset PIN</button></div><div id=\\\"grMsg\\\" class=\\\"gz-rewards-msg\\\"></div>';$('grReset').onclick=async()=>{const m=$('grMsg');try{await rpc('rewards_reset_pin',{p_reset_token:t,p_pin:$('grNewPin').value,p_pin_confirm:$('grNewPin2').value});showAuth('login')}catch(e){m.textContent='✕ '+e.message;m.style.color='#b42318'}}}"
          new3="""function showReset(t){const b=$('gzRewardsBody'),app=$('gzRewardsApp');app?.classList.add('gz-fp-active');b.innerHTML='<div class=\"gz-fp-screen\"><div class=\"gz-fp-icon\">🔑</div><div class=\"gz-fp-kicker\"><i></i>CREATE NEW PIN</div><h2>Set a new PIN</h2><p>Choose a new private PIN for your GrabPoints account.</p><div class=\"gz-fp-progress\"><b class=\"on\">1</b><i></i><b class=\"on\">2</b><i></i><b class=\"on\">3</b></div><div class=\"gz-fp-reset-grid\"><div class=\"gz-fp-field\"><label>New PIN</label><input id=\"grNewPin\" type=\"password\" inputmode=\"numeric\" maxlength=\"6\" placeholder=\"4–6 digits\"></div><div class=\"gz-fp-field\"><label>Confirm PIN</label><input id=\"grNewPin2\" type=\"password\" inputmode=\"numeric\" maxlength=\"6\" placeholder=\"Repeat PIN\"></div></div><div class=\"gz-fp-actions\"><button class=\"gz-fp-primary\" id=\"grReset\">Reset PIN →</button></div><div id=\"grMsg\" class=\"gz-fp-msg\"></div></div>';$('grReset').onclick=async()=>{const m=$('grMsg');try{await rpc('rewards_reset_pin',{p_reset_token:t,p_pin:$('grNewPin').value,p_pin_confirm:$('grNewPin2').value});app?.classList.remove('gz-fp-active');showAuth('login')}catch(e){m.textContent='✕ '+e.message;m.style.color='#ffb5a8'}}}"""
          if old3 not in s:
              raise SystemExit('reset function pattern not found')
          s=s.replace(old3,new3,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'grabzone-ui-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add rewards.js
          git rm .github/workflows/fix-forgot-pin-v5.yml
          git commit -m 'Rebuild Forgot PIN UI with premium recovery flow'
          git push origin HEAD:feature/animated-grabpoints-auth
