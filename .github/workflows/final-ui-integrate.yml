name: Integrate final GrabPoints UI
on:
  push:
    branches: [feature/animated-grabpoints-auth]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/animated-grabpoints-auth
          fetch-depth: 0
      - name: Load final UI after Rewards renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('grabpoints.html')
          s=p.read_text()
          marker='<script src="rewards.js?v=20260903gpfix3"></script>'
          add='\n<script src="grabpoints-ui-final.js?v=20260908final1"></script>'
          if 'grabpoints-ui-final.js?v=20260908final1' not in s:
              if marker not in s: raise SystemExit('rewards script marker not found')
              s=s.replace(marker,marker+add,1)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grabpoints.html
          git diff --cached --quiet && exit 0
          git commit -m 'Load final GrabPoints UI layer [skip ci]'
          git push origin HEAD:feature/animated-grabpoints-auth
