name: Normalize GrabPoints loaders
on:
  push:
    branches:
      - feature/animated-grabpoints-auth
permissions:
  contents: write
jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/animated-grabpoints-auth
          fetch-depth: 0
      - name: Normalize loaders and validate scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('d1-client.js')
          s=p.read_text()
          old="try{const p=String(location.pathname||'').replace(/\\/+$/,'').toLowerCase();if(p==='/grabpoints'||p==='/grabpoints.html'||p.endsWith('/grabpoints')||p.endsWith('/grabpoints.html')){for(const [src,v] of [['grabpoints-auth-animation.js','20260908ui6'],['grabpoints-redeem-polish.js','20260908polish4'],['grabpoints-redeem-effects.js','20260908effects1'],['grabpoints-redeem-sound-v2.js','20260908sound2']]){const s=document.createElement('script');s.src=src+'?v='+v;s.async=false;document.head.appendChild(s)}}}catch{}"
          if old in s:
              s=s.replace(old,'')
          p.write_text(s)

          h=Path('grabpoints.html')
          s=h.read_text()
          s=s.replace('grabpoints-auth-animation.js?v=20260909auth1','grabpoints-auth-animation.js?v=20260909auth3')
          s=s.replace('grabpoints-forgot-pin-ui.js?v=20260909standalone1','grabpoints-forgot-pin-ui.js?v=20260909standalone3')
          h.write_text(s)
          PY
          node --check d1-client.js
          node --check grabpoints-auth-animation.js
          node --check grabpoints-forgot-pin-ui.js
          grep -q 'grabpoints-auth-animation.js?v=20260909auth3' grabpoints.html
          grep -q 'grabpoints-forgot-pin-ui.js?v=20260909standalone3' grabpoints.html
          ! grep -q "grabpoints-auth-animation.js','20260908ui6'" d1-client.js
          rm -f .github/workflows/normalize-grabpoints-loaders.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add d1-client.js grabpoints.html .github/workflows/normalize-grabpoints-loaders.yml
          git commit -m 'Harden GrabPoints script loading'
          git push origin HEAD:feature/animated-grabpoints-auth
