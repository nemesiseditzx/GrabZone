name: Finish GrabPoints Email Automation

on:
  push:
    branches:
      - feature/animated-grabpoints-auth
    paths-ignore:
      - worker.mjs

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/animated-grabpoints-auth
          fetch-depth: 0
      - name: Finish tier-aware email events
        shell: python
        run: |
          from pathlib import Path
          p=Path('worker.mjs')
          text=p.read_text(encoding='utf-8')
          marker='async function rpc(env,fn,a,isAdmin){'
          helper='''async function sendTierChangeEmail(env,member,fromTier,toTier,earned){
          const rank={Member:0,Silver:1,Gold:2,Platinum:3};
          if(!member||!toTier||fromTier===toTier)return false;
          const up=(rank[toTier]||0)>(rank[fromTier]||0);
          const subject=up?"GrabZone Rewards — Welcome to "+toTier:"GrabZone Rewards — Membership tier update";
          const title=up?"You just leveled up.":"Your membership tier changed";
          const body=up?"<p>Congratulations! Your Rewards membership moved from <b>"+htmlEsc(fromTier)+"</b> to <b>"+htmlEsc(toTier)+"</b>.</p><p>Your qualifying GrabPoints for the current 12-month window are <b>"+Number(earned||0).toLocaleString("en-BD")+" GP</b>.</p><p>Your new tier benefits and cashback rate are now active.</p>":"<p>Your Rewards membership moved from <b>"+htmlEsc(fromTier)+"</b> to <b>"+htmlEsc(toTier)+"</b>.</p><p>Your current qualifying GrabPoints for the 12-month window are <b>"+Number(earned||0).toLocaleString("en-BD")+" GP</b>.</p><p>Keep earning qualifying GrabPoints to move back up and unlock higher benefits.</p>";
          await sendRewardsEmail(env,member.email,subject,title,body+rewardEmailTierCard(toTier),"",false,toTier,member.name,member.member_id);
          return true;
          }
          '''
          if 'async function sendTierChangeEmail(' not in text:
              text=text.replace(marker,helper+marker,1)
          old='const fixed=(await q(env,"SELECT points FROM customer_points WHERE phone=? LIMIT 1",[phone])).results?.[0];const bal=Number(fixed?.points||0);await env.DB.prepare("UPDATE grabpoints_ledger SET balance_after=? WHERE phone=? AND order_id=? AND type LIKE \'reversal:%\' AND balance_after IS NULL").bind(bal,phone,previousOrder.id).run();}}}'
          new='const fixed=(await q(env,"SELECT points FROM customer_points WHERE phone=? LIMIT 1",[phone])).results?.[0];const bal=Number(fixed?.points||0);await env.DB.prepare("UPDATE grabpoints_ledger SET balance_after=? WHERE phone=? AND order_id=? AND type LIKE \'reversal:%\' AND balance_after IS NULL").bind(bal,phone,previousOrder.id).run();const rm=(await q(env,"SELECT * FROM rewards_members WHERE phone=? AND status=\'Active\' LIMIT 1",[phone])).results?.[0];if(rm){const afterTier=await rewardTier(env,rm.id);const beforeTier=(await q(env,"SELECT tier FROM membership_tiers WHERE min_points<=? ORDER BY min_points DESC LIMIT 1",[Math.max(0,Number(afterTier.earned||0)+totalReverse)])).results?.[0]?.tier||afterTier.tier;if(afterTier.tier!==beforeTier)await sendTierChangeEmail(env,rm,beforeTier,afterTier.tier,afterTier.earned);await sendRewardsEmail(env,rm.email,"GrabZone Rewards — Points reversed","GrabPoints were reversed","<p>Your delivered order <b>"+htmlEsc(previousOrder.order_number||"")+"</b> was cancelled, so <b>"+totalReverse.toLocaleString("en-BD")+" GP</b> was reversed.</p><p>Your updated balance is <b>"+bal.toLocaleString("en-BD")+" GP</b>.</p>","",false,afterTier.tier,rm.name,rm.member_id);}}}}'
          if old in text:text=text.replace(old,new,1)
          old='await rewardAudit(env,m.id,a.p_admin_id||null,"ACCOUNT_UPDATED",reason,{old_phone:m.phone,new_phone:phone,old_email:m.email,new_email:email,tier_override:override,pin_changed:pinChanged});if(pinChanged)await sendRewardsEmail(env,email,"GrabZone Rewards — PIN changed","Your Rewards PIN was changed","<p>Your GrabZone Rewards PIN was changed by GrabZone Support.</p>");if(email!==m.email)await sendRewardsEmail(env,email,"GrabZone Rewards — Email updated","Rewards email updated","<p>Your Rewards account email was updated by GrabZone Support.</p>");'
          new='const tierNow=(await rewardTier(env,m.id)).tier;await rewardAudit(env,m.id,a.p_admin_id||null,"ACCOUNT_UPDATED",reason,{old_phone:m.phone,new_phone:phone,old_email:m.email,new_email:email,tier_override:override,pin_changed:pinChanged});if(pinChanged)await sendRewardsEmail(env,email,"GrabZone Rewards — PIN changed","Your Rewards PIN was changed","<p>Your GrabZone Rewards PIN was changed by GrabZone Support.</p>","",false,tierNow,name,m.member_id);if(email!==m.email)await sendRewardsEmail(env,email,"GrabZone Rewards — Email updated","Rewards email updated","<p>Your Rewards account email was updated by GrabZone Support.</p>","",false,tierNow,name,m.member_id);'
          if old in text:text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          import subprocess
          r=subprocess.run(['node','--check','worker.mjs'],capture_output=True,text=True)
          if r.returncode: raise SystemExit(r.stderr)
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet -- worker.mjs; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.mjs
          git commit -m "Finish GrabPoints tier event emails [skip ci]"
          git push origin feature/animated-grabpoints-auth
