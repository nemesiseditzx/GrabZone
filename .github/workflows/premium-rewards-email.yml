name: Premium GrabPoints Email Template

on:
  push:
    branches:
      - feature/animated-grabpoints-auth
    paths-ignore:
      - worker.mjs

permissions:
  contents: write

jobs:
  patch-email-template:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/animated-grabpoints-auth
          fetch-depth: 0

      - name: Install premium email renderer
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('worker.mjs')
          text = p.read_text(encoding='utf-8')
          start = text.index('function rewardEmailTheme(')
          end = text.index('async function rewardAudit(', start)

          replacement = r'''function rewardEmailTheme(tier){
 const k=String(tier||"Member").toLowerCase();
 if(k==="silver")return{key:"silver",a:"#94a3b8",b:"#e2e8f0",deep:"#475569",label:"SILVER",icon:"✦"};
 if(k==="gold")return{key:"gold",a:"#f59e0b",b:"#fde68a",deep:"#92400e",label:"GOLD",icon:"◆"};
 if(k==="platinum")return{key:"platinum",a:"#8b5cf6",b:"#ddd6fe",deep:"#5b21b6",label:"PLATINUM",icon:"✧"};
 return{key:"member",a:"#ff6b00",b:"#ffd0ad",deep:"#c24100",label:"MEMBER",icon:"●"};
}

function rewardEmailLogo(){
 return "<div style='font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:900;letter-spacing:-1px;color:#fff;line-height:1'>Grab<span style='color:#ff6b00'>Zone</span></div><div style='margin-top:4px;font-size:9px;font-weight:800;letter-spacing:3px;color:#a7a7ad'>REWARDS</div>";
}

function rewardEmailButton(url,label){
 const href=htmlEsc(url||"https://grab-zone-ten.vercel.app/grabpoints");
 return "<a href='"+href+"' style='display:inline-block;background:#ff6b00;color:#fff;text-decoration:none;padding:13px 20px;border-radius:12px;font-size:13px;font-weight:900;letter-spacing:.1px'>"+htmlEsc(label)+" →</a>";
}

async function sendRewardsEmail(env,to,subject,title,body,preheader="",strict=false,tier="Member",memberName="",memberId=""){
 try{
  if(!to||!env.GOOGLE_CLIENT_ID||!env.GOOGLE_CLIENT_SECRET||!env.GOOGLE_REFRESH_TOKEN||!env.GMAIL_FROM_EMAIL){if(strict)throw new Error("Rewards email service is not configured.");return false;}
  const th=rewardEmailTheme(tier),name=htmlEsc(memberName||""),mid=htmlEsc(memberId||""),safeTitle=htmlEsc(title),safeSubject=String(subject||"GrabZone Rewards");
  const greeting=name?"Hi <b>"+name+"</b>,":"Hi there,";
  const memberBlock=(name||mid)?"<div style='margin:0 0 22px;padding:15px 16px;border:1px solid "+th.a+"55;border-radius:14px;background:#fff'><div style='font-size:10px;font-weight:900;letter-spacing:2px;color:"+th.deep+"'>"+th.icon+" "+th.label+" MEMBER</div>"+(name?"<div style='font-size:16px;font-weight:900;margin-top:5px;color:#16161a'>"+name+"</div>":"")+(mid?"<div style='font-size:11px;color:#777;margin-top:3px'>Member ID · <b>"+mid+"</b></div>":"")+"</div>":"";
  const hero="<div style='background:#111114;padding:30px 30px 28px;position:relative'><div style='height:3px;width:54px;background:"+th.a+";margin-bottom:22px'></div>"+rewardEmailLogo()+"<div style='margin-top:30px;font-size:11px;font-weight:900;letter-spacing:3px;color:"+th.a+"'>GRABZONE REWARDS</div><div style='font-size:31px;line-height:1.08;font-weight:900;letter-spacing:-.8px;color:#fff;margin-top:9px'>"+safeTitle+"</div><div style='display:inline-block;margin-top:15px;padding:6px 11px;border-radius:999px;border:1px solid "+th.a+"88;color:#fff;font-size:10px;font-weight:900;letter-spacing:1.4px'>"+th.icon+" "+th.label+" MEMBER</div><div style='position:absolute;right:24px;top:36px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 35% 35%,"+th.b+"55,transparent 62%);border:1px solid "+th.a+"33'></div></div>";
  const security="<div style='margin-top:26px;padding:17px 18px;border-radius:14px;background:#f7f7f5;border:1px solid #e9e9e4'><div style='font-size:12px;font-weight:900;color:#171717'>Security & account activity</div><div style='font-size:12px;line-height:1.6;color:#707070;margin-top:5px'>If you did not request this activity, contact GrabZone Support immediately.</div></div>";
  const footer="<div style='margin-top:28px;padding-top:20px;border-top:1px solid #e9e9e9'><div style='font-size:12px;color:#777;line-height:1.6'>Thanks for being part of <b style='color:#ff6b00'>GrabZone Rewards</b>.</div><div style='margin-top:14px;font-size:10px;font-weight:900;letter-spacing:2.5px;color:#999'>GRABZONE — MORE THAN A STORE</div><div style='margin-top:8px;font-size:11px;color:#999'>Need help? Contact GrabZone Support.</div></div>";
  const html="<!doctype html><html><body style='margin:0;background:#111114;font-family:Arial,Helvetica,sans-serif;color:#171717'><div style='width:100%;background:#111114;padding:24px 10px'><div style='max-width:620px;margin:0 auto;background:#fff;border-radius:20px;overflow:hidden;border:1px solid #2b2b2f;box-shadow:0 18px 60px rgba(0,0,0,.3)'>"+hero+"<div style='padding:28px 30px 30px;background:#fff'>"+memberBlock+"<div style='font-size:14px;color:#444;line-height:1.7'>"+greeting+"<div style='margin-top:12px'>"+body+"</div></div>"+security+footer+"</div></div><div style='max-width:620px;margin:13px auto 0;text-align:center;font-size:9px;letter-spacing:1.8px;color:#666'>YOU ARE RECEIVING THIS EMAIL FROM GRABZONE REWARDS</div></div></body></html>";
  const plain=String(safeTitle)+"\n\n"+(name?"Hi, "+String(memberName)+"\n":"")+(mid?"Member ID: "+String(memberId)+"\n":"")+"Tier: "+String(th.label)+"\n\n"+String(preheader||body).replace(/<[^>]+>/g,"");
  const boundary="gzr_"+crypto.randomUUID().replace(/-/g,"");
  const raw=["From: GrabZone <"+env.GMAIL_FROM_EMAIL+">","To: "+to,"Subject: "+mimeSubject(safeSubject),"MIME-Version: 1.0","Content-Type: multipart/alternative; boundary=\""+boundary+"\"","","--"+boundary,'Content-Type: text/plain; charset="UTF-8"',"Content-Transfer-Encoding: 8bit","",plain,"--"+boundary,'Content-Type: text/html; charset="UTF-8"',"Content-Transfer-Encoding: 8bit","",html,"--"+boundary+"--",""] .join("\r\n");
  const rr=await fetch("https://gmail.googleapis.com/gmail/v1/users/me/messages/send",{method:"POST",headers:{Authorization:"Bearer "+await gmailToken(env),"Content-Type":"application/json"},body:JSON.stringify({raw:btoa(unescape(encodeURIComponent(raw))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=/g,"")})});
  if(!rr.ok){const ed=await rr.json().catch(()=>({})),msg=ed?.error?.message||("Gmail request failed ("+rr.status+").");if(strict)throw new Error(msg);console.warn("Rewards email:",msg);return false}
  return true;
 }catch(e){console.warn("Rewards email:",e);if(strict)throw e;return false}
}

'''
          p.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

      - name: Commit template
        shell: bash
        run: |
          if git diff --quiet -- worker.mjs; then
            echo "Premium email template already installed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.mjs
          git commit -m "Upgrade GrabPoints emails to premium tier templates [skip ci]"
          git push origin feature/animated-grabpoints-auth
