name: Apply GrabZone UX and Rewards fixes
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch selected fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def must_replace(path, old, new, count=1):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n!=count: raise SystemExit(f'{path}: expected {count} matches, found {n}')
              p.write_text(s.replace(old,new,count))

          # 9) Normalize Bangladesh phone numbers consistently, including +880 / 00880.
          must_replace('worker.mjs','function normalizeRewardPhone(v){return String(v||"").replace(/\\D/g,"")}', '''function normalizeRewardPhone(v){
            let s=String(v??"").trim().replace(/\\D/g,"");
            if(s.startsWith("00880"))s=s.slice(2);
            if(s.startsWith("880"))s="0"+s.slice(3);
            if(s.length===10&&s.startsWith("1"))s="0"+s;
            return s;
          }''')
          must_replace('worker.mjs','if(!/^01[3-9]\\d{8}$/.test(String(p.phone).trim()))throw new Error("Please enter a valid 11-digit Bangladesh mobile number (01XXXXXXXXX).");','const normalizedPhone=normalizeRewardPhone(p.phone);if(!/^01[3-9]\\d{8}$/.test(normalizedPhone))throw new Error("Please enter a valid 11-digit Bangladesh mobile number (01XXXXXXXXX).");')
          must_replace('worker.mjs','String(p.customer_name).trim(),String(p.email).trim().toLowerCase(),String(p.phone).trim(),String(p.division).trim()','String(p.customer_name).trim(),String(p.email).trim().toLowerCase(),normalizedPhone,String(p.division).trim()')
          must_replace('worker.mjs','String(p.phone||"").replace(/\\D/g,"")','normalizeRewardPhone(p.phone)')

          # 7) Never reveal a customer PIN to admin; provide an audited reset-email action instead.
          old='''if(fn==="rewards_admin_view_pin"){if(!isAdmin)throw new Error("Unauthorized.");const id=String(a.p_member_id||""),m=(await q(env,"SELECT * FROM rewards_members WHERE id=? OR member_id=? LIMIT 1",[id,id])).results?.[0];if(!m)throw new Error("Rewards member not found.");const pin=await decryptRewardPin(m.pin_encrypted,env);await rewardAudit(env,m.id,a.p_admin_id||null,"PIN_VIEWED",String(a.p_reason||"Customer support"),{});await sendRewardsEmail(env,m.email,"GrabZone Rewards security notice","Rewards PIN accessed by Support","<p>Your Rewards PIN was accessed by an authorized GrabZone Support admin for customer support.</p><p>If you did not request support, please contact us.</p>");return{data:{pin}}}'''
          new='''if(fn==="rewards_admin_view_pin"){if(!isAdmin)throw new Error("Unauthorized.");throw new Error("For security, Support cannot view a customer’s existing Rewards PIN. Send a PIN reset email instead.");}
          if(fn==="rewards_admin_send_pin_reset"){if(!isAdmin)throw new Error("Unauthorized.");const id=String(a.p_member_id||""),m=(await q(env,"SELECT * FROM rewards_members WHERE id=? OR member_id=? LIMIT 1",[id,id])).results?.[0];if(!m)throw new Error("Rewards member not found.");const reason=String(a.p_reason||"Customer support").trim();if(!reason)throw new Error("Support reason is required.");const recent=(await q(env,"SELECT created_at FROM rewards_otp WHERE lower(email)=lower(?) AND created_at>? ORDER BY created_at DESC LIMIT 1",[m.email,new Date(Date.now()-60000).toISOString()])).results?.[0];if(recent)throw new Error("A PIN reset email was already sent recently. Please wait a minute.");const code=String(Math.floor(100000+Math.random()*900000)),oid=crypto.randomUUID(),expires=new Date(Date.now()+10*60000).toISOString();await env.DB.prepare("INSERT INTO rewards_otp(id,email,code_hash,expires_at,used,attempts,created_at) VALUES(?,?,?,?,?,?,?)").bind(oid,m.email,await sha(code),expires,0,0,now()).run();try{await sendRewardsEmail(env,m.email,"GrabZone Rewards PIN reset","PIN reset requested","<p>GrabZone Support has started a secure PIN reset for your Rewards account.</p><p>Use this verification code to choose a new PIN:</p><div style='font-size:32px;font-weight:900;letter-spacing:8px;text-align:center;padding:18px;background:#f6f6f4;border-radius:14px'>"+code+"</div><p>This code expires in 10 minutes and can be used once.</p><p>If you did not contact support, please contact GrabZone immediately.</p>","",true,m.tier_override||"Member",m.name,m.member_id);}catch(e){await env.DB.prepare("DELETE FROM rewards_otp WHERE id=?").bind(oid).run();throw new Error("We could not send the verification email. "+e.message)}await rewardAudit(env,m.id,a.p_admin_id||null,"PIN_RESET_EMAIL_SENT",reason,{email:m.email,expires_at:expires});return{data:{ok:true,email:m.email,expires_at:expires}}}'''
          must_replace('worker.mjs',old,new)

          # 10) Correct 12-month tier reversal and keep actual 12-month GP visible under overrides.
          old='''const n=Math.max(0,Number(e.points||0));if(!n)continue;totalReverse+=n;stmts.push(env.DB.prepare("INSERT INTO grabpoints_ledger(id,phone,order_id,points,type,reference,reason,balance_after,qualifying_points,created_at) SELECT ?,?,?,?,?,?,?,MAX(0,points-?),?,? FROM customer_points WHERE phone=?").bind(crypto.randomUUID(),phone,previousOrder.id,-n,revType,"REV-"+String(previousOrder.order_number||previousOrder.id),"Order cancelled",-n,-n,now(),phone));'''
          new='''const n=Math.max(0,Number(e.points||0));if(!n)continue;const earnTime=Date.parse(e.created_at||"");const inTierWindow=Number.isFinite(earnTime)&&earnTime>=Date.now()-365*24*60*60*1000;const qualifyingReverse=inTierWindow?-n:0;totalReverse+=n;stmts.push(env.DB.prepare("INSERT INTO grabpoints_ledger(id,phone,order_id,points,type,reference,reason,balance_after,qualifying_points,created_at) SELECT ?,?,?,?,?,?,?,MAX(0,points-?),?,? FROM customer_points WHERE phone=?").bind(crypto.randomUUID(),phone,previousOrder.id,-n,revType,"REV-"+String(previousOrder.order_number||previousOrder.id),"Order cancelled",-n,qualifyingReverse,now(),phone));'''
          must_replace('worker.mjs',old,new)
          must_replace('worker.mjs','const tiers=(await q(env,"SELECT * FROM membership_tiers ORDER BY min_points ASC")).results||[];if(m.tier_override){const cur=tiers.find(t=>t.tier===m.tier_override)||tiers[tiers.length-1]||{tier:m.tier_override,min_points:0};return{tier:cur.tier,earned:0,remaining:0,next:cur.tier,tiers}}const cutoff=new Date(Date.now()-365*24*60*60*1000).toISOString();const e=(await q(env,"SELECT COALESCE(SUM(qualifying_points),0) AS earned FROM grabpoints_ledger WHERE phone=? AND created_at>=?",[m.phone,cutoff])).results?.[0]?.earned||0;const earned=Math.max(0,Number(e));','const tiers=(await q(env,"SELECT * FROM membership_tiers ORDER BY min_points ASC")).results||[];const cutoff=new Date(Date.now()-365*24*60*60*1000).toISOString();const e=(await q(env,"SELECT COALESCE(SUM(qualifying_points),0) AS earned FROM grabpoints_ledger WHERE phone=? AND created_at>=?",[m.phone,cutoff])).results?.[0]?.earned||0;const earned=Math.max(0,Number(e));if(m.tier_override){const cur=tiers.find(t=>t.tier===m.tier_override)||tiers[tiers.length-1]||{tier:m.tier_override,min_points:0};return{tier:cur.tier,earned,remaining:0,next:cur.tier,tiers}}')
          must_replace('worker.mjs','const cutoff=new Date(Date.now()-365*24*60*60*1000).toISOString();const e=(await q(env,"SELECT COALESCE(SUM(qualifying_points),0) AS earned FROM grabpoints_ledger WHERE phone=? AND created_at>=?",[m.phone,cutoff])).results?.[0]?.earned||0;const earned=Math.max(0,Number(e));let cur=tiers[0]||{tier:"Member",min_points:0};','let cur=tiers[0]||{tier:"Member",min_points:0};')
          anchor='''if(fn==="rewards_history"){const m=await verifyRewardToken(a.p_token,env);if(!m)throw new Error("Rewards session expired.");return{data:(await q(env,"SELECT id,points,type,reference,reason,qualifying_points,balance_after,created_at FROM grabpoints_ledger WHERE phone=? ORDER BY created_at DESC LIMIT 100",[m.phone])).results||[]}}'''
          must_replace('worker.mjs',anchor,anchor+'''\nif(fn==="rewards_tier_history"){const m=await verifyRewardToken(a.p_token,env);if(!m)throw new Error("Rewards session expired.");const cutoff=new Date(Date.now()-365*24*60*60*1000).toISOString();return{data:(await q(env,"SELECT id,points,type,reference,reason,qualifying_points,balance_after,created_at FROM grabpoints_ledger WHERE phone=? AND created_at>=? AND qualifying_points<>0 ORDER BY created_at DESC LIMIT 200",[m.phone,cutoff])).results||[]}}''')

          # 10) Rewards dashboard: explicit 12-month detail and stale variable fix.
          must_replace('rewards.js','gz-rewards-history{display:grid;gap:8px;margin-top:14px}.gz-rewards-row','gz-rewards-history{display:grid;gap:8px;margin-top:14px}.gz-tier-history-box{margin-top:12px;padding:13px;border:1px solid #e6e6ea;border-radius:14px;background:#fafafa}.gz-tier-history-box h4{margin:0;font-size:12px}.gz-tier-history-box small{color:#777;font-size:10px}.gz-tier-history-list{display:grid;gap:7px;margin-top:9px}.gz-tier-history-item{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;background:#fff;border:1px solid #eee;border-radius:10px;font-size:10px}.gz-tier-history-item small{display:block;margin-top:2px}.gz-tier-history-toggle{margin-top:9px;width:100%;border:1px solid #ddd;background:#fff;color:#34228f;border-radius:10px;padding:9px;font:900 10px system-ui;cursor:pointer}.gz-rewards-row')
          must_replace('rewards.js',"Number(d.next_tier_remaining||Math.max(0,next-earned)).toLocaleString('en-BD')","Number(d.next_tier_remaining||Math.max(0,next-tierEarned)).toLocaleString('en-BD')")
          must_replace('rewards.js',"const d=await rpc('rewards_me',{p_token:token()}),hist=await rpc('rewards_history',{p_token:token()}).catch(()=>[]),orders=await rpc('rewards_order_history',{p_token:token()}).catch(()=>[]);","const d=await rpc('rewards_me',{p_token:token()}),hist=await rpc('rewards_history',{p_token:token()}).catch(()=>[]),tierHist=await rpc('rewards_tier_history',{p_token:token()}).catch(()=>[]),orders=await rpc('rewards_order_history',{p_token:token()}).catch(()=>[]);")
          old='''<div class="gz-benefit-box"><b>Your current tier benefits</b><ul>${benefits}<li><b>${ti.current.cashback}% GrabPoints cashback</b> on eligible product purchases</li><li>Secure Rewards PIN redemption</li><li>View balance and full Rewards history</li></ul></div><div class="gz-dash-card"><div class="gz-next-head"><strong>📦 My Previous Orders</strong>'''
          new='''<div class="gz-benefit-box"><b>Your current tier benefits</b><ul>${benefits}<li><b>${ti.current.cashback}% GrabPoints cashback</b> on eligible product purchases</li><li>Secure Rewards PIN redemption</li><li>View balance and full Rewards history</li></ul></div><div class="gz-dash-card"><div class="gz-tier-history-box"><h4>📅 12-Month Tier GP Details</h4><small>Only qualifying GP earned or reversed during the last 12 months counts toward your current tier. Your available GP and lifetime history do not expire.</small><button type="button" class="gz-tier-history-toggle" id="grTierHistoryToggle">View 12-Month Tier Activity</button><div id="grTierHistoryPanel" style="display:none"><div class="gz-tier-history-list">${(Array.isArray(tierHist)&&tierHist.length?tierHist.map(x=>'<div class="gz-tier-history-item"><div><b>'+esc(x.type||'Tier activity')+'</b><small>'+esc(x.reference||'')+' · '+new Date(x.created_at).toLocaleDateString('en-BD')+(x.reason?' · '+esc(x.reason):'')+'</small></div><strong>'+((Number(x.qualifying_points)>0?'+':'')+Number(x.qualifying_points||0))+' GP</strong></div>').join(''):'<div style="padding:9px;color:#777;font-size:10px">No qualifying tier activity in the last 12 months.</div>')}</div></div></div></div><div class="gz-dash-card"><div class="gz-next-head"><strong>📦 My Previous Orders</strong>'''
          must_replace('rewards.js',old,new)
          must_replace('rewards.js',"$('grOrdersHide').onclick=()=>{$('grOrdersPanel').style.display='none';$('grOrdersToggle').style.display='block';$('grOrdersToggle').scrollIntoView({behavior:'smooth',block:'nearest'})}}catch(e)","$('grOrdersHide').onclick=()=>{$('grOrdersPanel').style.display='none';$('grOrdersToggle').style.display='block';$('grOrdersToggle').scrollIntoView({behavior:'smooth',block:'nearest'})};$('grTierHistoryToggle').onclick=()=>{const p=$('grTierHistoryPanel');const open=p.style.display==='block';p.style.display=open?'none':'block';$('grTierHistoryToggle').textContent=open?'View 12-Month Tier Activity':'Hide 12-Month Tier Activity'}}catch(e)")

          # 7) Admin: replace PIN viewing with reset email.
          must_replace('rewards-admin.js','<button class="ghost" id="gzMShowPin">👁 Show PIN</button>','<button class="ghost" id="gzMSendPinReset">✉ Send PIN Reset Email</button>')
          must_replace('rewards-admin.js',";$('gzMShowPin').onclick=showPin;", ";$('gzMSendPinReset').onclick=sendPinReset;")
          old="""async function showPin(){const reason=prompt('Support reason for viewing this PIN:');if(!reason)return;try{const admin=await adminId(),d=await rpc('rewards_admin_view_pin',{p_member_id:current.id,p_admin_id:admin,p_reason:reason});alert('Current Rewards PIN: '+d.pin)}catch(e){alert(e.message)}}"""
          new="""async function sendPinReset(){const reason=prompt('Support reason for sending a PIN reset email:');if(!reason)return;try{const admin=await adminId(),d=await rpc('rewards_admin_send_pin_reset',{p_member_id:current.id,p_admin_id:admin,p_reason:reason});$('gzMMsg').textContent='✓ PIN reset email sent to '+d.email+'.';}catch(e){$('gzMMsg').textContent='✕ '+e.message}}"""
          must_replace('rewards-admin.js',old,new)

          # 12) Email optional at checkout.
          must_replace('checkout.html','<label for="customerEmail">Email Address <i>*</i></label>','<label for="customerEmail">Email Address <span>(Optional)</span></label>')
          must_replace('checkout.html','<input id="customerEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>','<input id="customerEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email">')
          must_replace('checkout.html','<small>Your email is required for order records and future receipt/order communication.</small>','<small>Optional. If provided, we’ll send your order confirmation and updates by email.</small>')
          must_replace('checkout.js','if(!d.customer_name||!d.phone||!d.email||!d.division||!d.district||!d.upazila||!d.address)','if(!d.customer_name||!d.phone||!d.division||!d.district||!d.upazila||!d.address)')
          must_replace('checkout.js',"if(!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(d.email))\n    return'Please enter a valid email address.';","if(d.email&&!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(d.email))\n    return'Please enter a valid email address.';")
          must_replace('checkout.js','const emailSent=await sendOrderEmail(','const emailSent=d.email?await sendOrderEmail(')
          must_replace('checkout.js',"      }))\n    );\n    $('successEmailNote')","      }))\n    ):false;\n    $('successEmailNote')")

          # 14) Clearer Order Tracking ID wording.
          p=Path('track-order.html');s=p.read_text().replace('Enter your private Tracking ID to see the latest status of your order.','Enter your Order Tracking ID to see the latest status of your order.').replace('Please enter your private Tracking ID.','Please enter your Order Tracking ID.').replace('Order not found. Please check your Order ID.','Order not found. Please check your Order Tracking ID.').replace('Please check your private Tracking ID.','Please check your Order Tracking ID.').replace('YOUR PRIVATE TRACKING ID','YOUR ORDER TRACKING ID');p.write_text(s)
          p=Path('checkout.html');p.write_text(p.read_text().replace('YOUR PRIVATE TRACKING ID','YOUR ORDER TRACKING ID'))
          p=Path('worker.mjs');p.write_text(p.read_text().replace('Private Tracking ID: <b>','Order Tracking ID: <b>').replace('Private Tracking ID: "+String(o.public_tracking_id||"")','Order Tracking ID: "+String(o.public_tracking_id||"")'))

          # 17) Related products on product detail pages.
          p=Path('product.html');s=p.read_text()
          anchor='''  <div id="productDetail" class="detail">\n    <p>Loading product...</p>\n  </div>'''
          repl=anchor+'''\n  <section id="gzRelatedProducts" aria-label="Related products" style="display:none;margin:34px 0 10px">\n    <div style="display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:14px">\n      <div><div style="font-size:11px;font-weight:900;letter-spacing:.14em;color:#777">YOU MAY ALSO LIKE</div><h2 style="margin:5px 0 0;font-size:25px">Related Products</h2></div>\n      <a href="index.html#shop" style="font-size:11px;font-weight:900;color:#111;text-decoration:none">View all →</a>\n    </div>\n    <div id="gzRelatedGrid" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px"></div>\n  </section>'''
          must_replace('product.html',anchor,repl)
          related='''\n<script>\n(()=>{\n const d1=window.grabzoneD1||null;\n const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));\n const money=v=>'৳'+Number(v||0).toLocaleString('en-BD');\n const init=async()=>{\n   const box=document.getElementById('gzRelatedProducts'),grid=document.getElementById('gzRelatedGrid');if(!box||!grid||!d1)return;\n   const u=new URLSearchParams(location.search),id=u.get('id')||u.get('product_id')||u.get('product')||'';if(!id)return;\n   try{\n     const cur=await d1.from('products').select('id,name,category,price,image_url,tag').eq('id',id).maybeSingle();if(cur.error||!cur.data)return;\n     const q=await d1.from('products').select('id,name,category,price,image_url,tag').eq('published',true).eq('category',cur.data.category).neq('id',id).limit(4);if(q.error||!Array.isArray(q.data)||!q.data.length)return;\n     grid.innerHTML=q.data.map(p=>`<a href="product.html?id=${encodeURIComponent(p.id)}" style="display:block;text-decoration:none;color:inherit;border:1px solid #e5e5e1;border-radius:16px;background:#fff;overflow:hidden;transition:transform .15s ease,box-shadow .15s ease"><div style="aspect-ratio:1;background:#f4f4f1;overflow:hidden"><img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy" style="width:100%;height:100%;object-fit:cover"></div><div style="padding:12px"><div style="font-size:12px;font-weight:800;line-height:1.35">${esc(p.name)}</div><div style="margin-top:7px;font-size:13px;font-weight:900">${money(p.price)}</div></div></a>`).join('');\n     box.style.display='block';const style=document.createElement('style');style.textContent='#gzRelatedGrid>a:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.08)}@media(max-width:800px){#gzRelatedGrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}}';document.head.appendChild(style);\n   }catch(e){console.warn('Related products:',e)}\n };\n if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();\n})();\n</script>'''
          must_replace('product.html','<script src="phase5.js?v=20260902p5"></script>\n\n</body>','<script src="phase5.js?v=20260902p5"></script>'+related+'\n</body>')

          # New authenticated customer RPC must be in the public-rewards allowlist.
          must_replace('worker.mjs','"rewards_me","rewards_history","rewards_order_history","rewards_redeem"','"rewards_me","rewards_history","rewards_tier_history","rewards_order_history","rewards_redeem"')
          must_replace('worker.mjs','const p=a.payload||a,req=["customer_name","email","phone","division","district","upazila","address"];','const p=a.payload||a,req=["customer_name","phone","division","district","upazila","address"];')

          print('All selected fixes patched.')
          PY
          node --check worker.mjs
          node --check rewards.js
          node --check rewards-admin.js
          node --check checkout.js
          git diff --check
      - name: Commit and deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.mjs rewards.js rewards-admin.js checkout.html checkout.js track-order.html product.html
          git commit -m "Fix selected Rewards and ecommerce UX issues"
          git push
          npx wrangler deploy ./worker.mjs
          git rm .github/workflows/fix-selected-ux.yml
          git commit -m "Remove temporary UX repair workflow"
          git push
