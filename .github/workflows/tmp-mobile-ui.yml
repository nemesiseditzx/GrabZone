name: Apply GrabPoints mobile UI
on:
  push:
    branches: [feature/animated-grabpoints-auth]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/animated-grabpoints-auth
          fetch-depth: 0
      - name: Add mobile stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('grabpoints.html')
          s=p.read_text()
          tag='<script src="grabpoints-mobile-responsive.js?v=20260908mobile1"></script>'
          if tag not in s:
              needle='<script src="grabpoints-ui-final.js?v=20260908final1"></script>'
              if needle not in s: raise SystemExit('ui script tag not found')
              s=s.replace(needle, needle+'\n'+tag, 1)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grabpoints.html
          git commit -m 'Make GrabPoints fully mobile responsive [skip ci]'
          git push origin HEAD:feature/animated-grabpoints-auth
