name: Patch Forgot PIN UI V6
on:
  push:
    branches: [feature/animated-grabpoints-auth]
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Forgot PIN screens
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('rewards.js')
          s=p.read_text(encoding='utf-8')
          marker='/* GRABZONE FORGOT PIN V6 */'
          if marker in s:
              raise SystemExit('already patched')
          forgot_css='''<style id="gzForgotV6Style">#gzRewardsApp.gz-fp-v6{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}#gzRewardsApp.gz-fp-v6 .gz-fp6{position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(145deg,#171717,#241f1a 60%,#3a2417);color:#fff;border-radius:22px;padding:30px;box-shadow:0 25px 70px rgba(25,15,8,.24);animation:gzFp6In .55s cubic-bezier(.16,1,.3,1) both}#gzRewardsApp.gz-fp-v6 .gz-fp6:before{content:"";position:absolute;width:360px;height:360px;right:-180px;top:-180px;border:1px solid #ff8a0050;border-radius:50%;box-shadow:0 0 0 34px #ff8a000d,0 0 0 70px #ff8a0006;animation:gzFp6Orbit 12s linear infinite;pointer-events:none;z-index:-1}#gzRewardsApp.gz-fp-v6 .gz-fp6-icon{width:66px;height:66px;border-radius:21px;background:#fff;color:#171717;display:grid;place-items:center;font-size:30px;box-shadow:0 15px 35px #0005;animation:gzFp6Icon .7s cubic-bezier(.2,.9,.2,1) both}#gzRewardsApp.gz-fp-v6 .gz-fp6-kicker{display:inline-flex;align-items:center;gap:7px;margin:18px 0 10px;padding:7px 11px;border-radius:999px;border:1px solid #ff9a0050;background:#ff8a0012;color:#ffb35e;font:900 9px/1 system-ui;letter-spacing:.14em;text-transform:uppercase}#gzRewardsApp.gz-fp-v6 .gz-fp6-kicker i{width:6px;height:6px;border-radius:50%;background:#ff8a00;box-shadow:0 0 0 5px #ff8a0012,0 0 14px #ff8a00}#gzRewardsApp.gz-fp-v6 h2{margin:0 0 8px;color:#fff;font-size:35px;line-height:1.02;letter-spacing:-.045em}#gzRewardsApp.gz-fp-v6 p{color:#d8d0c9;line-height:1.6}#gzRewardsApp.gz-fp-v6 .gz-fp6-steps{display:flex;align-items:center;gap:8px;margin:21px 0 18px}#gzRewardsApp.gz-fp-v6 .gz-fp6-steps b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#ffffff0b;border:1px solid #ffffff22;color:#aaa;font:900 10px system-ui}#gzRewardsApp.gz-fp-v6 .gz-fp6-steps b.on{background:#ff6b00;border-color:#ff6b00;color:#fff;box-shadow:0 0 0 6px #ff6b0012;animation:gzFp6Pop .45s both}#gzRewardsApp.gz-fp-v6 .gz-fp6-steps i{height:1px;width:52px;background:#ffffff25}#gzRewardsApp.gz-fp-v6 .gz-fp6-label{display:block;margin:0 0 7px;color:#bdb3aa;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}#gzRewardsApp.gz-fp-v6 .gz-fp6-input{width:100%;height:58px;box-sizing:border-box;border:1px solid #ffffff20!important;border-radius:15px!important;background:#fff!important;color:#171717!important;padding:0 16px!important;outline:none;box-shadow:0 8px 22px #00018!important;transition:.22s!important}#gzRewardsApp.gz-fp-v6 .gz-fp6-input:focus{border-color:#ff8a00!important;box-shadow:0 0 0 4px #ff8a0022,0 12px 28px #00028!important;transform:translateY(-1px)}#gzRewardsApp.gz-fp-v6 .gz-fp6-actions{display:grid;grid-template-columns:1fr .36fr;gap:10px;margin-top:14px}#gzRewardsApp.gz-fp-v6 .gz-fp6-actions button{height:56px;border-radius:15px!important;font-weight:900!important;cursor:pointer;transition:.2s!important}#gzRewardsApp.gz-fp-v6 .gz-fp6-primary{background:linear-gradient(100deg,#ff9d00,#ff5b00)!important;color:#171717!important;border:0!important;box-shadow:0 14px 30px #ff6b0030!important}#gzRewardsApp.gz-fp-v6 .gz-fp6-primary:hover{transform:translateY(-2px);box-shadow:0 18px 36px #ff6b0040!important}#gzRewardsApp.gz-fp-v6 .gz-fp6-secondary{background:#ffffff0a!important;color:#fff!important;border:1px solid #ffffff25!important}#gzRewardsApp.gz-fp-v6 .gz-fp6-secondary:hover{background:#fff!important;color:#171717!important}#gzRewardsApp.gz-fp-v6 .gz-fp6-msg{min-height:20px;margin-top:10px;color:#ffb7aa;font-size:12px;font-weight:800}#gzRewardsApp.gz-fp-v6 .gz-fp6-note{margin-top:18px;padding:12px 14px;border:1px solid #ffffff14;border-radius:14px;background:#ffffff08;color:#bdb3aa;font-size:11px;line-height:1.5}#gzRewardsApp.gz-fp-v6 .gz-fp6-note strong{color:#fff}#gzRewardsApp.gz-fp-v6 .gz-fp6-otp{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-top:15px}#gzRewardsApp.gz-fp-v6 .gz-fp6-otp input{height:58px!important;text-align:center!important;font-size:23px!important;font-weight:900!important;padding:0!important}#gzRewardsApp.gz-fp-v6 .gz-fp6-reset{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}@keyframes gzFp6In{from{opacity:0;transform:translateY(20px) scale(.985)}to{opacity:1;transform:none}}@keyframes gzFp6Icon{0%{opacity:0;transform:translateY(14px) rotate(-14deg) scale(.7)}65%{transform:translateY(-4px) rotate(4deg) scale(1.08)}100%{opacity:1;transform:none}}@keyframes gzFp6Orbit{to{transform:rotate(360deg)}}@keyframes gzFp6Pop{0%{transform:scale(.5);opacity:.2}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}@media(max-width:760px){#gzRewardsApp.gz-fp-v6 .gz-fp6{padding:21px;border-radius:19px}#gzRewardsApp.gz-fp-v6 h2{font-size:29px}#gzRewardsApp.gz-fp-v6 .gz-fp6-actions{grid-template-columns:1fr}#gzRewardsApp.gz-fp-v6 .gz-fp6-steps i{width:34px}#gzRewardsApp.gz-fp-v6 .gz-fp6-otp{gap:6px}#gzRewardsApp.gz-fp-v6 .gz-fp6-otp input{height:51px!important}}@media(prefers-reduced-motion:reduce){#gzRewardsApp.gz-fp-v6 .gz-fp6,#gzRewardsApp.gz-fp-v6 .gz-fp6:before,#gzRewardsApp.gz-fp-v6 .gz-fp6-icon,#gzRewardsApp.gz-fp-v6 .gz-fp6-steps b{animation:none!important;transition:none!important}}</style>'''
          def replace_between(start,end,repl):
              global s
              a=s.index(start); b=s.index(end,a)
              s=s[:a]+repl+s[b:]
          forgot="""async function forgot(){const b=$('gzRewardsBody'),app=$('gzRewardsApp');app?.classList.add('gz-fp-v6');b.innerHTML=`%s<div class=\"gz-fp6\"><div class=\"gz-fp6-icon\">🔐</div><div class=\"gz-fp6-kicker\"><i></i>SECURE PIN RECOVERY</div><h2>Forgot your PIN?</h2><p>Recover your Rewards account securely. A one-time verification code will be sent to your registered email.</p><div class=\"gz-fp6-steps\"><b class=\"on\">1</b><i></i><b>2</b><i></i><b>3</b></div><label class=\"gz-fp6-label\">Registered Rewards email</label><input class=\"gz-fp6-input\" id=\"grResetEmail\" type=\"email\" placeholder=\"name@example.com\" autocomplete=\"email\"><div class=\"gz-fp6-actions\"><button class=\"gz-fp6-primary\" id=\"grSendCode\">Send Verification Code →</button><button class=\"gz-fp6-secondary\" id=\"grBackLogin\">Back to Login</button></div><div id=\"grMsg\" class=\"gz-fp6-msg\"></div><div class=\"gz-fp6-note\">🛡️ <strong>Private & secure.</strong> The code is sent only to the email registered with your Rewards account.</div></div>`;$('grSendCode').onclick=sendCode;$('grBackLogin').onclick=()=>{app?.classList.remove('gz-fp-v6');showAuth('login')}}""" % forgot_css
          replace_between('async function forgot(){','async function sendCode()',forgot+'\n')
          verify="""function showVerify(email){const b=$('gzRewardsBody'),app=$('gzRewardsApp');app?.classList.add('gz-fp-v6');b.innerHTML=`%s<div class=\"gz-fp6\"><div class=\"gz-fp6-icon\">✉️</div><div class=\"gz-fp6-kicker\"><i></i>EMAIL VERIFICATION</div><h2>Check your email</h2><p>Enter the 6-digit code sent to <b style=\"color:#fff\">${esc(email)}</b>.</p><div class=\"gz-fp6-steps\"><b class=\"on\">1</b><i></i><b class=\"on\">2</b><i></i><b>3</b></div><div class=\"gz-fp6-otp\"><input class=\"gz-fp6-input\" inputmode=\"numeric\" maxlength=\"1\"><input class=\"gz-fp6-input\" inputmode=\"numeric\" maxlength=\"1\"><input class=\"gz-fp6-input\" inputmode=\"numeric\" maxlength=\"1\"><input class=\"gz-fp6-input\" inputmode=\"numeric\" maxlength=\"1\"><input class=\"gz-fp6-input\" inputmode=\"numeric\" maxlength=\"1\"><input class=\"gz-fp6-input\" inputmode=\"numeric\" maxlength=\"1\"></div><input id=\"grOtp\" type=\"hidden\"><div class=\"gz-fp6-actions\"><button class=\"gz-fp6-primary\" id=\"grVerify\">Verify Code →</button><button class=\"gz-fp6-secondary\" id=\"grBackLogin\">Back to Login</button></div><div id=\"grMsg\" class=\"gz-fp6-msg\"></div><div class=\"gz-fp6-note\">📩 Enter the one-time code from your email. You can paste all 6 digits at once.</div></div>`;const boxes=[...b.querySelectorAll('.gz-fp6-otp input')],hidden=$('grOtp');boxes.forEach((x,i)=>{x.addEventListener('input',()=>{x.value=x.value.replace(/\\D/g,'').slice(0,1);hidden.value=boxes.map(q=>q.value).join('');if(x.value&&boxes[i+1])boxes[i+1].focus()});x.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!x.value&&boxes[i-1])boxes[i-1].focus()});x.addEventListener('paste',e=>{e.preventDefault();const v=e.clipboardData.getData('text').replace(/\\D/g,'').slice(0,6);boxes.forEach((q,j)=>q.value=v[j]||'');hidden.value=v;if(v.length===6)boxes[5].focus()})});$('grVerify').onclick=()=>verifyCode(email);$('grBackLogin').onclick=()=>{app?.classList.remove('gz-fp-v6');showAuth('login')}}""" % forgot_css
          replace_between('function showVerify(email){','async function verifyCode(email)',verify+'\n')
          reset="""function showReset(t){const b=$('gzRewardsBody'),app=$('gzRewardsApp');app?.classList.add('gz-fp-v6');b.innerHTML=`%s<div class=\"gz-fp6\"><div class=\"gz-fp6-icon\">🔑</div><div class=\"gz-fp6-kicker\"><i></i>CREATE NEW PIN</div><h2>Set a new PIN</h2><p>Choose a new private PIN for your GrabPoints account.</p><div class=\"gz-fp6-steps\"><b class=\"on\">1</b><i></i><b class=\"on\">2</b><i></i><b class=\"on\">3</b></div><div class=\"gz-fp6-reset\"><div><label class=\"gz-fp6-label\">New PIN</label><input class=\"gz-fp6-input\" id=\"grNewPin\" type=\"password\" inputmode=\"numeric\" maxlength=\"6\" placeholder=\"4–6 digits\"></div><div><label class=\"gz-fp6-label\">Confirm PIN</label><input class=\"gz-fp6-input\" id=\"grNewPin2\" type=\"password\" inputmode=\"numeric\" maxlength=\"6\" placeholder=\"Repeat PIN\"></div></div><div class=\"gz-fp6-actions\"><button class=\"gz-fp6-primary\" id=\"grReset\">Reset PIN →</button></div><div id=\"grMsg\" class=\"gz-fp6-msg\"></div></div>`;$('grReset').onclick=async()=>{const m=$('grMsg');try{await rpc('rewards_reset_pin',{p_reset_token:t,p_pin:$('grNewPin').value,p_pin_confirm:$('grNewPin2').value});app?.classList.remove('gz-fp-v6');showAuth('login')}catch(e){m.textContent='✕ '+e.message;m.style.color='#ffb7aa'}}}""" % forgot_css
          replace_between('function showReset(t){','function parseBenefits(value)',reset+'\n')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript and remove workflow
        run: |
          node --check rewards.js
          git config user.name 'grabzone-ui-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add rewards.js
          git rm .github/workflows/fix-forgot-pin-v6.yml
          git commit -m 'Rebuild Forgot PIN UI with direct recovery screens'
          git push origin HEAD:feature/animated-grabpoints-auth
