name: Run Rewards cleanup

on:
  push:
    branches:
      - feature/animated-grabpoints-auth

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/animated-grabpoints-auth
          fetch-depth: 0
      - run: python3 scripts/fix_rewards_duplicates.py
      - run: node --check rewards.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rewards.js
          git commit -m "Fix Rewards PIN recovery renderer"
          git push origin HEAD:feature/animated-grabpoints-auth
