name: Run Rewards cleanup

on:
  push:
    branches:
      - feature/animated-grabpoints-auth

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/animated-grabpoints-auth
          fetch-depth: 0
      - name: Repair Forgot PIN renderers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('rewards.js')
          s=p.read_text()
          forgot="""async function forgot(){const b=$('gzRewardsBody');forgotPinStyle();b.innerHTML='<div class=\"gz-fp-clean\"><div class=\"gz-fp-icon\">🔐</div><div class=\"gz-fp-kicker\"><i></i>SECURE PIN RECOVERY</div><h2>Forgot your PIN?</h2><p class=\"gz-fp-copy\">Recover your Rewards account securely. We will send a one-time verification code to your registered email.</p><div class=\"gz-fp-progress\"><b class=\"on\">1</b><i class=\"on\"></i><b>2</b><i></i><b>3</b></div><label class=\"gz-fp-label\" for=\"grResetEmail\">Registered Rewards email</label><input class=\"gz-fp-field\" id=\"grResetEmail\" type=\"email\" autocomplete=\"email\" placeholder=\"name@example.com\"><div class=\"gz-fp-actions\"><button type=\"button\" class=\"gz-fp-primary\" id=\"grSendCode\">Send Verification Code →</button><button type=\"button\" class=\"gz-fp-secondary\" id=\"grBackLogin\">Back to Login</button></div><div id=\"grMsg\" class=\"gz-fp-msg\"></div><div class=\"gz-fp-note\">🛡️ <span><strong>Private & secure.</strong> Your verification code is sent only to the email registered with your Rewards account.</span></div></div>';$('grSendCode').onclick=sendCode;$('grBackLogin').onclick=()=>showAuth('login');$('grResetEmail').onkeydown=e=>{if(e.key==='Enter')sendCode()};$('grResetEmail').focus()}\n"""
          s,n=re.subn(r'^async function forgot\(\)\{.*?^\}',lambda _m:forgot,s,count=1,flags=re.M|re.S)
          if n!=1: raise SystemExit('forgot renderer not found')
          show="""function showVerify(email){const b=$('gzRewardsBody');forgotPinStyle();b.innerHTML='<div class=\"gz-fp-clean\"><div class=\"gz-fp-icon\">✉️</div><div class=\"gz-fp-kicker\"><i></i>EMAIL VERIFICATION</div><h2>Check your email</h2><p class=\"gz-fp-copy\">Enter the 6-digit code sent to <strong style=\"color:#fff\">'+esc(email)+'</strong>.</p><div class=\"gz-fp-progress\"><b class=\"on\">1</b><i class=\"on\"></i><b class=\"on\">2</b><i class=\"on\"></i><b>3</b></div><div class=\"gz-fp-otp\">'+Array.from({length:6},(_,i)=>'<input inputmode=\"numeric\" maxlength=\"1\" aria-label=\"Verification digit '+(i+1)+'\">').join('')+'</div><div class=\"gz-fp-actions\"><button type=\"button\" class=\"gz-fp-primary\" id=\"grVerify\">Verify Code →</button><button type=\"button\" class=\"gz-fp-secondary\" id=\"grBackLogin\">Back to Login</button></div><div id=\"grMsg\" class=\"gz-fp-msg\"></div></div>';const boxes=[...b.querySelectorAll('.gz-fp-otp input')],btn=$('grVerify');boxes.forEach((x,i)=>{x.oninput=()=>{x.value=x.value.replace(/\\D/g,'').slice(0,1);if(x.value&&boxes[i+1])boxes[i+1].focus()};x.onkeydown=e=>{if(e.key==='Backspace'&&!x.value&&boxes[i-1])boxes[i-1].focus();if(e.key==='Enter')btn.click()};x.onpaste=e=>{e.preventDefault();const v=(e.clipboardData?.getData('text')||'').replace(/\\D/g,'').slice(0,6);boxes.forEach((q,j)=>q.value=v[j]||'');boxes[Math.max(0,Math.min(v.length,6)-1)]?.focus()}});btn.onclick=()=>verifyCode(email,boxes.map(x=>x.value).join(''));$('grBackLogin').onclick=()=>showAuth('login');boxes[0]?.focus()}\n"""
          needle='function showVerify(email){'
          starts=[];i=0
          while True:
              j=s.find(needle,i)
              if j<0: break
              starts.append(j);i=j+len(needle)
          if starts:
              first=starts[0];end=s.find('\n',first);end=len(s) if end<0 else end
              s=s[:first]+show+s[end+1:]
              starts=[];i=0
              while True:
                  j=s.find(needle,i)
                  if j<0: break
                  starts.append(j);i=j+len(needle)
              for j in reversed(starts[1:]):
                  end=s.find('\n',j);end=len(s) if end<0 else end
                  s=s[:j]+s[end+1:]
          else:
              marker='async function verifyCode(email,code)'
              idx=s.find(marker)
              if idx<0: raise SystemExit('verifyCode function not found')
              s=s[:idx]+show+'\n'+s[idx:]
          if s.count('async function forgot()')!=1 or s.count('function showVerify(email)')!=1: raise SystemExit('Rewards PIN renderer invariant failed')
          p.write_text(s)
          PY
      - run: |
          node --check rewards.js
          grep -q 'gz-fp-clean' rewards.js
          grep -q 'function showVerify(email)' rewards.js
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rewards.js
          git rm -f scripts/fix_rewards_duplicates.py || true
          git commit -m "Fix Rewards PIN recovery renderer"
          git push origin HEAD:feature/animated-grabpoints-auth
