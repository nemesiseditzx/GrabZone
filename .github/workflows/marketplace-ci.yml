name: Validate GrabZone Vendor Marketplace

on:
  push:
    branches:
      - vendor-system-dev
      - marketplace-fix-hardening
  pull_request:
    branches:
      - vendor-system-dev

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          while IFS= read -r f; do
            node --check "$f"
          done < <(find . -type f \( -name "*.js" -o -name "*.mjs" \) -not -path "./node_modules/*")
      - name: Run marketplace regression tests
        run: node --test tests/marketplace-regression.test.mjs
