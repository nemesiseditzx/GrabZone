name: Upgrade Rewards Emails

on:
  push:
    branches:
      - feature/animated-grabpoints-auth

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, '[rewards-email-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/animated-grabpoints-auth
          fetch-depth: 0

      - name: Replace rewards email renderer
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('worker.mjs')
          s = p.read_text(encoding='utf-8')
          start = s.find('async function sendRewardsEmail(')
          end = s.find('async function rewardAudit(', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate rewards email renderer boundaries')

          new = r'''async function sendRewardsEmail(env,to,subject,title,body,preheader="",strict=false,tier="Member",memberName="",memberId=""){
          try{
          if(!to||!env.GOOGLE_CLIENT_ID||!env.GOOGLE_CLIENT_SECRET||!env.GOOGLE_REFRESH_TOKEN||!env.GMAIL_FROM_EMAIL){if(strict)throw new Error("Rewards email service is not configured.");return false;}
          const th=rewardEmailTheme(tier),name=htmlEsc(memberName||""),mid=htmlEsc(memberId||""),safeTitle=htmlEsc(title),safeSubject=String(subject||"GrabZone Rewards"),safePre=htmlEsc(preheader||"");
          const rawBody=String(body||"");
          const lower=(safeTitle+" "+safeSubject+" "+rawBody).toLowerCase();
          const kind=lower.includes("voucher")||lower.includes("reward")?"reward":lower.includes("level")||lower.includes("tier")||lower.includes("membership")?"tier":lower.includes("pin")||lower.includes("security")||lower.includes("verification")?"security":lower.includes("earned")||lower.includes("points")?"points":"welcome";
          const kindMap={reward:{icon:"🎁",label:"REWARD DROP",sub:"Your points just turned into something useful."},tier:{icon:"⚡",label:"LEVEL UP",sub:"Your membership status just changed."},security:{icon:"🛡️",label:"SECURITY CHECK",sub:"A secure update for your Rewards account."},points:{icon:"🪙",label:"GP UPDATE",sub:"Your GrabPoints balance just got an update."},welcome:{icon:"👋",label:"WELCOME TO THE CLUB",sub:"Your GrabZone Rewards journey starts here."}};
          const meta=kindMap[kind]||kindMap.welcome;
          const greeting=name?"Hey <b>"+name+"</b> 👋":"Hey there 👋";
          const account=(name||mid)?"<div style='margin:0 0 22px;padding:15px 17px;border-radius:18px;background:#151518;border:1px solid #2e2e34;color:#fff'><table role='presentation' width='100%' cellpadding='0' cellspacing='0'><tr><td><div style='font-size:9px;font-weight:900;letter-spacing:2px;color:"+th.a+"'>"+meta.icon+" YOUR REWARDS PROFILE</div>"+(name?"<div style='font-size:18px;font-weight:900;margin-top:5px'>"+name+"</div>":"")+(mid?"<div style='font-size:10px;color:#a7a7ad;margin-top:4px'>MEMBER ID · <b style='color:#fff'>"+mid+"</b></div>":"")+"</td><td align='right' valign='middle'><div style='padding:8px 11px;border-radius:999px;background:"+th.b+";color:#fff;font-size:9px;font-weight:900;letter-spacing:1px'>"+htmlEsc(th.label)+"</div></td></tr></table></div>":"";
          const logo="<div style='font-family:Arial,Helvetica,sans-serif;font-size:25px;font-weight:900;letter-spacing:-1.4px;color:#fff;line-height:1'>Grab<span style='color:#ff6b00'>Zone</span></div><div style='margin-top:5px;font-size:8px;font-weight:900;letter-spacing:4px;color:#a9a9b1'>GEAR UP YOUR WORLD</div>";
          const hero="<div class='gz-hero' style='position:relative;overflow:hidden;background:linear-gradient(135deg,#09090b 0%,#15151a 58%,"+th.deep+" 140%);padding:28px 28px 31px;color:#fff'><div class='gz-shimmer' style='height:4px;width:74px;border-radius:99px;background:linear-gradient(90deg,#ff6b00,"+th.a+",#ff6b00);margin-bottom:21px'></div>"+logo+"<div style='margin-top:27px;display:inline-block;padding:7px 11px;border:1px solid "+th.a+"99;border-radius:999px;color:#fff;font-size:9px;font-weight:900;letter-spacing:1.5px'>"+meta.icon+" "+meta.label+"</div><div style='margin-top:13px;font-size:34px;line-height:1.02;font-weight:900;letter-spacing:-1.5px'>"+safeTitle+"</div><div style='font-size:12px;line-height:1.55;color:#c9c9ce;margin-top:10px;max-width:470px'>"+meta.sub+(safePre?" · "+safePre:"")+"</div><div class='gz-orb' style='position:absolute;right:-70px;top:-75px;width:230px;height:230px;border-radius:50%;border:1px solid "+th.a+"55;box-shadow:0 0 0 35px "+th.a+"10,0 0 0 70px "+th.a+"07'></div><div style='position:absolute;right:24px;bottom:24px;font-size:42px;opacity:.13;transform:rotate(-10deg)'>"+meta.icon+"</div></div>";
          const tierCard=rewardEmailTierCard(tier);
          const security="<div style='margin-top:20px;padding:15px 16px;border-radius:17px;background:#f7f7f5;border:1px solid #e7e7e2'><table role='presentation' width='100%' cellpadding='0' cellspacing='0'><tr><td valign='top' style='font-size:20px;width:34px'>🛡️</td><td><div style='font-size:11px;font-weight:900;color:#171717'>SECURITY & ACCOUNT ACTIVITY</div><div style='font-size:11px;line-height:1.55;color:#707070;margin-top:4px'>If you did not request this activity, contact GrabZone Support immediately.</div></td></tr></table></div>";
          const cta=rewardEmailButton("https://grab-zone-ten.vercel.app/grabpoints",kind==="reward"?"Use Your Rewards":kind==="tier"?"See My Membership":"Open GrabZone Rewards");
          const footer="<div style='margin-top:25px;padding-top:21px;border-top:1px solid #ecece8;text-align:center'><div>"+cta+"</div><div style='margin-top:18px;font-size:12px;color:#777;line-height:1.6'>Thanks for being part of <b style='color:#ff6b00'>GrabZone</b>. Keep shopping. Keep earning. Keep leveling up. 🚀</div><div style='margin-top:10px;font-size:9px;font-weight:900;letter-spacing:2.5px;color:#aaa'>MORE THAN A STORE · GRABZONE REWARDS</div></div>";
          const html="<!doctype html><html><head><meta charset='UTF-8'><meta name='color-scheme' content='dark light'><style>@media(max-width:620px){.gz-wrap{padding:8px!important}.gz-card{border-radius:18px!important}.gz-hero{padding:24px 20px 27px!important}.gz-title{font-size:28px!important}.gz-content{padding:21px 18px 25px!important}.gz-orb{right:-105px!important}.gz-grid td{display:block!important;width:100%!important}.gz-steps td{display:block!important;padding:8px 0!important}}@media(prefers-reduced-motion:no-preference){.gz-shimmer{animation:gzShimmer 2.4s ease-in-out infinite}.gz-orb{animation:gzFloat 4s ease-in-out infinite}}@keyframes gzShimmer{0%,100%{opacity:.72;transform:scaleX(.86);transform-origin:left}50%{opacity:1;transform:scaleX(1.08)}}@keyframes gzFloat{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-7px,8px) rotate(4deg)}}</style></head><body style='margin:0;background:#070708;font-family:Arial,Helvetica,sans-serif;color:#171717'><div class='gz-wrap' style='width:100%;padding:24px 10px;box-sizing:border-box;background:radial-gradient(circle at 50% 0%,"+th.deep+" 0,#070708 42%)'><div class='gz-card' style='max-width:640px;margin:0 auto;background:#fff;border-radius:24px;overflow:hidden;border:1px solid #29292d;box-shadow:0 24px 80px rgba(0,0,0,.45)'>"+hero+"<div class='gz-content' style='padding:27px 28px 31px;background:#fff'>"+account+"<div style='font-size:14px;line-height:1.8;color:#45454a'>"+greeting+"<div style='margin-top:10px'>"+rawBody+"</div></div>"+tierCard+security+footer+"</div></div><div style='max-width:640px;margin:12px auto 0;text-align:center;font-size:8px;letter-spacing:1.7px;color:#6f6f76'>YOU'RE GETTING THIS BECAUSE YOU'RE PART OF GRABZONE REWARDS</div></div></body></html>";
          const plain=String(safeTitle)+"\n\n"+(memberName?"Hey, "+String(memberName)+"!\n":"")+(memberId?"Member ID: "+String(memberId)+"\n":"")+"Tier: "+String(th.label)+"\n\n"+rawBody.replace(/<[^>]+>/g,"");
          const boundary="gzr_v2_"+crypto.randomUUID().replace(/-/g,"");
          const raw=["From: GrabZone <"+env.GMAIL_FROM_EMAIL+">","To: "+to,"Subject: "+mimeSubject(safeSubject),"MIME-Version: 1.0","Content-Type: multipart/alternative; boundary=\""+boundary+"\"","","--"+boundary,'Content-Type: text/plain; charset="UTF-8"',"Content-Transfer-Encoding: 8bit","",plain,"--"+boundary,'Content-Type: text/html; charset="UTF-8"',"Content-Transfer-Encoding: 8bit","",html,"--"+boundary+"--",""] .join("\r\n");
          const rr=await fetch("https://gmail.googleapis.com/gmail/v1/users/me/messages/send",{method:"POST",headers:{Authorization:"Bearer "+await gmailToken(env),"Content-Type":"application/json"},body:JSON.stringify({raw:btoa(unescape(encodeURIComponent(raw))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=/g,"")})});
          if(!rr.ok){const ed=await rr.json().catch(()=>({})),msg=ed?.error?.message||("Gmail request failed ("+rr.status+").");if(strict)throw new Error(msg);console.warn("Rewards email:",msg);return false}
          return true;
          }catch(e){console.warn("Rewards email:",e);if(strict)throw e;return false}
          }
          '''
          p.write_text(s[:start] + new + '\n' + s[end:], encoding='utf-8')

      - name: Commit upgraded renderer and remove temporary workflow
        run: |
          git config user.name "grabzone-email-bot"
          git config user.email "actions@users.noreply.github.com"
          git add worker.mjs
          git commit -m "Upgrade rewards email system [rewards-email-v2]"
          git push origin HEAD:feature/animated-grabpoints-auth
          git rm .github/workflows/upgrade-rewards-emails.yml
          git commit -m "Remove temporary rewards email workflow [rewards-email-v2]"
          git push origin HEAD:feature/animated-grabpoints-auth
