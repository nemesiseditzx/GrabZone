name: Finish GrabZone selected fixes
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          def sub(path,pat,repl,count=1,flags=0):
              p=Path(path);s=p.read_text();s2,n=re.subn(pat,repl,s,count=count,flags=flags)
              if n!=count: raise SystemExit(f'{path}: expected {count}, got {n}')
              p.write_text(s2)
          # 9: normalize BD phone input everywhere it reaches Rewards/order storage.
          sub('worker.mjs',r'function normalizeRewardPhone\(v\)\{.*?\}', '''function normalizeRewardPhone(v){
            let s=String(v??"").trim().replace(/\\D/g,"");
            if(s.startsWith("00880"))s=s.slice(2);
            if(s.startsWith("880"))s="0"+s.slice(3);
            if(s.length===10&&s.startsWith("1"))s="0"+s;
            return s;
          }''')
          sub('worker.mjs',r'if\(!/\^01\[3-9\]\\d\{8\}\$/\.test\(String\(p\.phone\)\.trim\(\)\)\)throw new Error\("Please enter a valid 11-digit Bangladesh mobile number \(01XXXXXXXXX\)\."\);','const normalizedPhone=normalizeRewardPhone(p.phone);if(!/^01[3-9]\\d{8}$/.test(normalizedPhone))throw new Error("Please enter a valid 11-digit Bangladesh mobile number (01XXXXXXXXX).");')
          sub('worker.mjs',r'String\(p\.customer_name\)\.trim\(\),String\(p\.email\)\.trim\(\)\.toLowerCase\(\),String\(p\.phone\)\.trim\(\),String\(p\.division\)\.trim\(\)','String(p.customer_name).trim(),String(p.email||"").trim().toLowerCase(),normalizedPhone,String(p.division).trim()')
          sub('worker.mjs',r'String\(p\.phone\|\|""\)\.replace\(/\\D/g,""\)', 'normalizeRewardPhone(p.phone)', count=2)
          # 7: admin never sees the existing PIN; support sends a one-time reset code.
          sub('worker.mjs',r'if\(fn==="rewards_admin_view_pin"\)\{.*?\}\nif\(fn==="rewards_admin_update"\)', '''if(fn==="rewards_admin_view_pin"){if(!isAdmin)throw new Error("Unauthorized.");throw new Error("For security, Support cannot view a customer’s existing Rewards PIN. Send a PIN reset email instead.");}
          if(fn==="rewards_admin_send_pin_reset"){if(!isAdmin)throw new Error("Unauthorized.");const id=String(a.p_member_id||""),m=(await q(env,"SELECT * FROM rewards_members WHERE id=? OR member_id=? LIMIT 1",[id,id])).results?.[0];if(!m)throw new Error("Rewards member not found.");const reason=String(a.p_reason||"Customer support").trim();if(!reason)throw new Error("Support reason is required.");const recent=(await q(env,"SELECT created_at FROM rewards_otp WHERE lower(email)=lower(?) AND created_at>? ORDER BY created_at DESC LIMIT 1",[m.email,new Date(Date.now()-60000).toISOString()])).results?.[0];if(recent)throw new Error("A PIN reset email was already sent recently. Please wait a minute.");const code=String(Math.floor(100000+Math.random()*900000)),oid=crypto.randomUUID(),expires=new Date(Date.now()+10*60000).toISOString();await env.DB.prepare("INSERT INTO rewards_otp(id,email,code_hash,expires_at,used,attempts,created_at) VALUES(?,?,?,?,?,?,?)").bind(oid,m.email,await sha(code),expires,0,0,now()).run();try{await sendRewardsEmail(env,m.email,"GrabZone Rewards PIN reset","PIN reset requested","<p>GrabZone Support has started a secure PIN reset for your Rewards account.</p><p>Use this verification code to choose a new PIN:</p><div style='font-size:32px;font-weight:900;letter-spacing:8px;text-align:center;padding:18px;background:#f6f6f4;border-radius:14px'>"+code+"</div><p>This code expires in 10 minutes and can be used once.</p><p>If you did not contact support, please contact GrabZone immediately.</p>","",true,m.tier_override||"Member",m.name,m.member_id);}catch(e){await env.DB.prepare("DELETE FROM rewards_otp WHERE id=?").bind(oid).run();throw new Error("We could not send the verification email. "+e.message)}await rewardAudit(env,m.id,a.p_admin_id||null,"PIN_RESET_EMAIL_SENT",reason,{email:m.email,expires_at:expires});return{data:{ok:true,email:m.email,expires_at:expires}}}
          if(fn==="rewards_admin_update")''',flags=re.S)
          # 10: rolling 12-month tier math, including correct old-order cancellation reversal.
          sub('worker.mjs',r'async function rewardTier\(env,memberId\)\{.*?\}\nfunction mimeSubject', '''async function rewardTier(env,memberId){const m=(await q(env,"SELECT * FROM rewards_members WHERE id=? LIMIT 1",[memberId])).results?.[0];if(!m)return{tier:"Member",earned:0,remaining:0,next:"Member",tiers:[]};const tiers=(await q(env,"SELECT * FROM membership_tiers ORDER BY min_points ASC")).results||[];const cutoff=new Date(Date.now()-365*24*60*60*1000).toISOString();const e=(await q(env,"SELECT COALESCE(SUM(qualifying_points),0) AS earned FROM grabpoints_ledger WHERE phone=? AND created_at>=?",[m.phone,cutoff])).results?.[0]?.earned||0;const earned=Math.max(0,Number(e));if(m.tier_override){const cur=tiers.find(t=>t.tier===m.tier_override)||tiers[tiers.length-1]||{tier:m.tier_override,min_points:0};return{tier:cur.tier,earned,remaining:0,next:cur.tier,tiers}}let cur=tiers[0]||{tier:"Member",min_points:0};for(const t of tiers)if(earned>=Number(t.min_points))cur=t;const next=tiers.find(t=>Number(t.min_points)>Number(cur.min_points));return{tier:cur.tier,earned,remaining:next?Math.max(0,Number(next.min_points)-earned):0,next:next?.tier||cur.tier,tiers}}
function mimeSubject''',flags=re.S)
          sub('worker.mjs',r'const n=Math\.max\(0,Number\(e\.points\|\|0\)\);if\(!n\)continue;totalReverse\+=n;', 'const n=Math.max(0,Number(e.points||0));if(!n)continue;const earnTime=Date.parse(e.created_at||"");const inTierWindow=Number.isFinite(earnTime)&&earnTime>=Date.now()-365*24*60*60*1000;const qualifyingReverse=inTierWindow?-n:0;totalReverse+=n;')
          sub('worker.mjs',r'"Order Tracking ID: <b>"', '"Order Tracking ID: <b>"') if '"Private Tracking ID: <b>"' not in Path('worker.mjs').read_text() else sub('worker.mjs',r'"Private Tracking ID: <b>"','"Order Tracking ID: <b>"')
          sub('worker.mjs',r'"rewards_me","rewards_history","rewards_order_history","rewards_redeem"','"rewards_me","rewards_history","rewards_tier_history","rewards_order_history","rewards_redeem"')
          # 10: customer can open a real server-side last-12-month tier activity list.
          anchor='''if(fn==="rewards_history"){const m=await verifyRewardToken(a.p_token,env);if(!m)throw new Error("Rewards session expired.");return{data:(await q(env,"SELECT id,points,type,reference,reason,qualifying_points,balance_after,created_at FROM grabpoints_ledger WHERE phone=? ORDER BY created_at DESC LIMIT 100",[m.phone])).results||[]}}'''
          sub('worker.mjs',re.escape(anchor),anchor+'''\nif(fn==="rewards_tier_history"){const m=await verifyRewardToken(a.p_token,env);if(!m)throw new Error("Rewards session expired.");const cutoff=new Date(Date.now()-365*24*60*60*1000).toISOString();return{data:(await q(env,"SELECT id,points,type,reference,reason,qualifying_points,balance_after,created_at FROM grabpoints_ledger WHERE phone=? AND created_at>=? AND qualifying_points<>0 ORDER BY created_at DESC LIMIT 200",[m.phone,cutoff])).results||[]}}''')
          # 10: rewards dashboard detail + stale variable fix.
          sub('rewards.js',r'gz-rewards-history\{display:grid;gap:8px;margin-top:14px\}\.gz-rewards-row','gz-rewards-history{display:grid;gap:8px;margin-top:14px}.gz-tier-history-box{margin-top:12px;padding:13px;border:1px solid #e6e6ea;border-radius:14px;background:#fafafa}.gz-tier-history-box h4{margin:0;font-size:12px}.gz-tier-history-box small{color:#777;font-size:10px}.gz-tier-history-list{display:grid;gap:7px;margin-top:9px}.gz-tier-history-item{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;background:#fff;border:1px solid #eee;border-radius:10px;font-size:10px}.gz-tier-history-item small{display:block;margin-top:2px}.gz-tier-history-toggle{margin-top:9px;width:100%;border:1px solid #ddd;background:#fff;color:#34228f;border-radius:10px;padding:9px;font:900 10px system-ui;cursor:pointer}.gz-rewards-row')
          sub('rewards.js',"Number(d.next_tier_remaining||Math.max(0,next-earned)).toLocaleString('en-BD')","Number(d.next_tier_remaining||Math.max(0,next-tierEarned)).toLocaleString('en-BD')")
          sub('rewards.js',"const d=await rpc('rewards_me',{p_token:token()}),hist=await rpc('rewards_history',{p_token:token()}).catch(()=>[]),orders=await rpc('rewards_order_history',{p_token:token()}).catch(()=>[]);","const d=await rpc('rewards_me',{p_token:token()}),hist=await rpc('rewards_history',{p_token:token()}).catch(()=>[]),tierHist=await rpc('rewards_tier_history',{p_token:token()}).catch(()=>[]),orders=await rpc('rewards_order_history',{p_token:token()}).catch(()=>[]);")
          old='''<div class="gz-benefit-box"><b>Your current tier benefits</b><ul>${benefits}<li><b>${ti.current.cashback}% GrabPoints cashback</b> on eligible product purchases</li><li>Secure Rewards PIN redemption</li><li>View balance and full Rewards history</li></ul></div><div class="gz-dash-card"><div class="gz-next-head"><strong>📦 My Previous Orders</strong>'''
          new='''<div class="gz-benefit-box"><b>Your current tier benefits</b><ul>${benefits}<li><b>${ti.current.cashback}% GrabPoints cashback</b> on eligible product purchases</li><li>Secure Rewards PIN redemption</li><li>View balance and full Rewards history</li></ul></div><div class="gz-dash-card"><div class="gz-tier-history-box"><h4>📅 12-Month Tier GP Details</h4><small>Only qualifying GP earned or reversed during the last 12 months counts toward your tier. Available GP and lifetime history do not expire.</small><button type="button" class="gz-tier-history-toggle" id="grTierHistoryToggle">View 12-Month Tier Activity</button><div id="grTierHistoryPanel" style="display:none"><div class="gz-tier-history-list">${(Array.isArray(tierHist)&&tierHist.length?tierHist.map(x=>'<div class="gz-tier-history-item"><div><b>'+esc(x.type||'Tier activity')+'</b><small>'+esc(x.reference||'')+' · '+new Date(x.created_at).toLocaleDateString('en-BD')+(x.reason?' · '+esc(x.reason):'')+'</small></div><strong>'+((Number(x.qualifying_points)>0?'+':'')+Number(x.qualifying_points||0))+' GP</strong></div>').join(''):'<div style="padding:9px;color:#777;font-size:10px">No qualifying tier activity in the last 12 months.</div>')}</div></div></div></div><div class="gz-dash-card"><div class="gz-next-head"><strong>📦 My Previous Orders</strong>'''
          sub('rewards.js',re.escape(old),new)
          sub('rewards.js',r"\$\('grOrdersHide'\)\.onclick=\(\)=>\{\$\('grOrdersPanel'\)\.style\.display='none';\$\('grOrdersToggle'\)\.style\.display='block';\$\('grOrdersToggle'\)\.scrollIntoView\(\{behavior:'smooth',block:'nearest'\}\)\}\}catch\(e\)","$('grOrdersHide').onclick=()=>{$('grOrdersPanel').style.display='none';$('grOrdersToggle').style.display='block';$('grOrdersToggle').scrollIntoView({behavior:'smooth',block:'nearest'})};$('grTierHistoryToggle').onclick=()=>{const p=$('grTierHistoryPanel');const open=p.style.display==='block';p.style.display=open?'none':'block';$('grTierHistoryToggle').textContent=open?'View 12-Month Tier Activity':'Hide 12-Month Tier Activity'}}catch(e)")
          # 7: admin UI no longer offers PIN viewing.
          sub('rewards-admin.js','<button class="ghost" id="gzMShowPin">👁 Show PIN</button>','<button class="ghost" id="gzMSendPinReset">✉ Send PIN Reset Email</button>')
          sub('rewards-admin.js',r"\$\('gzMShowPin'\)\.onclick=showPin;","$('gzMSendPinReset').onclick=sendPinReset;")
          sub('rewards-admin.js',r'async function showPin\(\)\{.*?\}\nasync function adjust',"""async function sendPinReset(){const reason=prompt('Support reason for sending a PIN reset email:');if(!reason)return;try{const admin=await adminId(),d=await rpc('rewards_admin_send_pin_reset',{p_member_id:current.id,p_admin_id:admin,p_reason:reason});$('gzMMsg').textContent='✓ PIN reset email sent to '+d.email+'.';}catch(e){$('gzMMsg').textContent='✕ '+e.message}}\nasync function adjust""",flags=re.S)
          # 12: email optional for guest checkout; Gmail is skipped when blank.
          p=Path('checkout.html');s=p.read_text().replace('<label for="customerEmail">Email Address <i>*</i></label>','<label for="customerEmail">Email Address <span>(Optional)</span></label>').replace('<input id="customerEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>','<input id="customerEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email">').replace('<small>Your email is required for order records and future receipt/order communication.</small>','<small>Optional. If provided, we’ll send your order confirmation and updates by email.</small>');p.write_text(s)
          sub('checkout.js','if(!d.customer_name||!d.phone||!d.email||!d.division||!d.district||!d.upazila||!d.address)','if(!d.customer_name||!d.phone||!d.division||!d.district||!d.upazila||!d.address)')
          sub('checkout.js',r"if\(!/\^\[\^\\s@\]\+@\[\^\\s@\]\+\\\.\[\^\\s@\]\+\$/.test\(d\.email\)\)","if(d.email&&!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(d.email))")
          sub('checkout.js','const emailSent=await sendOrderEmail(','const emailSent=d.email?await sendOrderEmail(')
          sub('checkout.js',"      }))\n    );\n    $('successEmailNote')","      }))\n    ):false;\n    $('successEmailNote')")
          # 14: terminology.
          for f in ['track-order.html','checkout.html']:
              p=Path(f);p.write_text(p.read_text().replace('YOUR PRIVATE TRACKING ID','YOUR ORDER TRACKING ID').replace('private Tracking ID','Order Tracking ID').replace('Private Tracking ID','Order Tracking ID'))
          # 17: related products section, same-category, published-only.
          p=Path('product.html');s=p.read_text();anchor='''  <div id="productDetail" class="detail">\n    <p>Loading product...</p>\n  </div>''';repl=anchor+'''\n  <section id="gzRelatedProducts" style="display:none;margin:36px 0 10px"><div style="display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px"><div><div style="font-size:11px;font-weight:900;letter-spacing:.14em;color:#777">YOU MAY ALSO LIKE</div><h2 style="margin:5px 0 0;font-size:25px">Related Products</h2></div><a href="index.html#shop" style="font-size:11px;font-weight:900;color:#111;text-decoration:none">View all →</a></div><div id="gzRelatedGrid" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px"></div></section>''';sub('product.html',re.escape(anchor),repl)
          script='''\n<script>\n(()=>{const d1=window.grabzoneD1||null;const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const init=async()=>{const box=document.getElementById('gzRelatedProducts'),grid=document.getElementById('gzRelatedGrid');if(!d1||!box||!grid)return;const u=new URLSearchParams(location.search),id=u.get('id')||u.get('product_id')||u.get('product')||'';if(!id)return;try{const cur=await d1.from('products').select('id,category').eq('id',id).maybeSingle();if(cur.error||!cur.data)return;const q=await d1.from('products').select('id,name,price,image_url').eq('published',true).eq('category',cur.data.category).neq('id',id).limit(4);if(q.error||!q.data?.length)return;grid.innerHTML=q.data.map(p=>`<a href="product.html?id=${encodeURIComponent(p.id)}" style="display:block;text-decoration:none;color:inherit;border:1px solid #e5e5e1;border-radius:16px;background:#fff;overflow:hidden"><div style="aspect-ratio:1;background:#f4f4f1"><img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy" style="width:100%;height:100%;object-fit:cover"></div><div style="padding:12px"><div style="font-size:12px;font-weight:800">${esc(p.name)}</div><div style="margin-top:7px;font-size:13px;font-weight:900">৳${Number(p.price||0).toLocaleString('en-BD')}</div></div></a>`).join('');box.style.display='block';const st=document.createElement('style');st.textContent='@media(max-width:800px){#gzRelatedGrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}}';document.head.appendChild(st)}catch(e){console.warn('Related products:',e)}};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()})();\n</script>'''
          sub('product.html',re.escape('<script src="phase5.js?v=20260902p5"></script>\n\n</body>'),'<script src="phase5.js?v=20260902p5"></script>'+script+'\n</body>')
          print('patched')
          PY
          node --check worker.mjs
          node --check rewards.js
          node --check rewards-admin.js
          node --check checkout.js
          git diff --check
      - name: Commit deploy and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.mjs rewards.js rewards-admin.js checkout.html checkout.js track-order.html product.html
          git commit -m "Fix selected Rewards and ecommerce UX issues"
          git push
          npx wrangler deploy ./worker.mjs
          git rm .github/workflows/fix-selected-ux.yml .github/workflows/fix-selected-ux2.yml
          git commit -m "Remove temporary UX repair workflows"
          git push
