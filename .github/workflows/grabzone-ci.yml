name: GrabZone CI

on:
  push:
    branches:
      - vendor-system-dev
  pull_request:
    branches:
      - vendor-system-dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out vendor-system-dev
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript and module syntax
        run: |
          find . -maxdepth 1 -type f \( -name '*.mjs' -o -name '*.js' \) -print0 | xargs -0 -n1 node --check

      - name: Run regression tests
        run: node --test tests/*.test.mjs

      - name: Validate Cloudflare Worker bundle
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc
