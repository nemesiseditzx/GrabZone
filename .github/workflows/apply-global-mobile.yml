name: Apply global mobile responsive layer
on:
  push:
    branches: [feature/animated-grabpoints-auth]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/animated-grabpoints-auth
          fetch-depth: 0
      - name: Add responsive stylesheet to public pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages=['index.html','product.html','checkout.html','payment-method.html','track-order.html','policies.html']
          tag='<link rel="stylesheet" href="grabzone-mobile-global.css?v=20260908mobileglobal1">'
          for name in pages:
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text()
              if 'grabzone-mobile-global.css' not in s:
                  s=s.replace('</head>',tag+'\n</head>',1)
                  p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html product.html checkout.html payment-method.html track-order.html policies.html
          git diff --cached --quiet && exit 0
          git commit -m 'Make public storefront fully mobile responsive [skip ci]'
          git push origin HEAD:feature/animated-grabpoints-auth
