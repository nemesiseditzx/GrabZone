name: Wire GrabPoints redeem polish
on:
  push:
    branches:
      - feature/animated-grabpoints-auth
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/animated-grabpoints-auth
          fetch-depth: 0
      - name: Load redeem polish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('d1-client.js')
          s=p.read_text()
          old="    s.src='grabpoints-auth-animation.js?v=20260908ui4';\n    s.async=true;\n    document.head.appendChild(s);"
          new="    s.src='grabpoints-auth-animation.js?v=20260908ui4';\n    s.async=true;\n    document.head.appendChild(s);\n    const rp=document.createElement('script');\n    rp.src='grabpoints-redeem-polish.js?v=20260908polish1';\n    rp.async=true;\n    document.head.appendChild(rp);"
          if old not in s: raise SystemExit('auth loader marker not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add d1-client.js
          git diff --cached --quiet && exit 0
          git commit -m 'Load premium redeem polish [skip ci]'
          git push origin HEAD:feature/animated-grabpoints-auth
