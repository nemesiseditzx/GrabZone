name: Install standalone PIN recovery UI

on:
  push:
    branches:
      - feature/animated-grabpoints-auth

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/animated-grabpoints-auth
          fetch-depth: 0
      - name: Add standalone PIN recovery script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('grabpoints.html')
          s=p.read_text()
          tag='<script src="grabpoints-forgot-pin-ui.js?v=20260909standalone1"></script>'
          if 'grabpoints-forgot-pin-ui.js' not in s:
              marker='<script src="rewards.js?v=20260909hardening1"></script>'
              if marker not in s:
                  marker='<script src="rewards.js"></script>'
              if marker not in s: raise SystemExit('Rewards script tag not found')
              s=s.replace(marker,marker+'\n'+tag,1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grabpoints.html
          git commit -m "Load standalone GrabPoints PIN recovery UI"
          git push origin HEAD:feature/animated-grabpoints-auth
