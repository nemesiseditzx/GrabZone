name: Patch Rewards Email Template
on:
  push:
    branches:
      - feature/animated-grabpoints-auth
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[email-template-patched]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch renderer
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('worker.mjs')
          s=p.read_text(encoding='utf-8')
          old='const tierCard=rewardEmailTierCard(tier);'
          if old not in s: raise SystemExit('tierCard declaration not found')
          s=s.replace(old,'',1)
          old2='+tierCard+security+footer+'
          if old2 not in s: raise SystemExit('tierCard render insertion not found')
          s=s.replace(old2,'+security+footer+',1)
          pattern=r"<div class='gz-orb'.*?</div><div style='position:absolute;right:24px;bottom:24px;font-size:42px;opacity:\.13;transform:rotate\(-10deg\)'>\"\+meta\.icon\+\"</div>"
          s2,n=re.subn(pattern,"<div style='position:absolute;right:24px;bottom:24px;font-size:42px;opacity:.10;transform:rotate(-10deg)'>\"+meta.icon+\"</div>",s,count=1,flags=re.S)
          if n!=1: raise SystemExit('hero orb block not found')
          s=s2
          s=s.replace("<div class='gz-content' style='padding:27px 28px 31px;background:#fff'>","<div class='gz-content' style='padding:24px 28px 30px;background:#fff'>",1)
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'grabzone-email-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add worker.mjs
          git commit -m 'Clean up rewards email template [email-template-patched]'
          git rm .github/workflows/patch-rewards-email.yml
          git commit -m 'Remove temporary email patch workflow'
          git push origin HEAD:feature/animated-grabpoints-auth