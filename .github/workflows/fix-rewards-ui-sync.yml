name: Fix Rewards UI Sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[rewards-ui-sync-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Repair Rewards admin and customer UI
        shell: python
        run: |
          from pathlib import Path

          h=Path('admin.html')
          s=h.read_text(encoding='utf-8')

          old='''      <label><div class="field-help"><b>Tier cashback is controlled in GrabPoints → Points & Membership.</b> Member 1% · Silver 2% · Gold 3% · Platinum 5%. Delivery charge is never included.</div>\n      <label>Value of 1 GP (৳)'''
          new='''      <div class="field-help"><b>Tier cashback is controlled in GrabPoints → Points & Membership.</b> Member 1% · Silver 2% · Gold 3% · Platinum 5%. Delivery charge is never included.</div>\n      <label>Value of 1 GP (৳)'''
          if old not in s: raise SystemExit('growth label anchor not found')
          s=s.replace(old,new,1)

          old='''columns:\"grabpoints_enabled,grabpoints_earn_rate,grabpoints_value,mystery_enabled,mystery_min_percent,mystery_max_percent\"'''
          new='''columns:\"grabpoints_enabled,grabpoints_value,mystery_enabled,mystery_min_percent,mystery_max_percent\"'''
          if old not in s: raise SystemExit('growth select anchor not found')
          s=s.replace(old,new,1)

          old='''    $('growthGpEarnRate').value=Number(data.grabpoints_earn_rate??10);\n'''
          if old not in s: raise SystemExit('growth earn-rate load anchor not found')
          s=s.replace(old,'',1)

          old='''  const gpEnabled=Number($('growthGpEnabled').value),earn=Math.max(0,Number($('growthGpEarnRate').value||0)),value=Math.max(0,Number($('growthGpValue').value||0)),mEnabled=Number($('growthMysteryEnabled').value),mMin=Math.max(1,Number($('growthMysteryMin').value||5)),mMax=Math.max(mMin,Number($('growthMysteryMax').value||15));'''
          new='''  const gpEnabled=Number($('growthGpEnabled').value),value=Math.max(0,Number($('growthGpValue').value||0)),mEnabled=Number($('growthMysteryEnabled').value),mMin=Math.max(1,Number($('growthMysteryMin').value||5)),mMax=Math.max(mMin,Number($('growthMysteryMax').value||15));'''
          if old not in s: raise SystemExit('growth save variable anchor not found')
          s=s.replace(old,new,1)

          old='''values:{grabpoints_enabled:gpEnabled,grabpoints_earn_rate:earn,grabpoints_value:value,mystery_enabled:mEnabled,mystery_min_percent:mMin,mystery_max_percent:mMax}'''
          new='''values:{grabpoints_enabled:gpEnabled,grabpoints_value:value,mystery_enabled:mEnabled,mystery_min_percent:mMin,mystery_max_percent:mMax}'''
          if old not in s: raise SystemExit('growth save values anchor not found')
          s=s.replace(old,new,1)

          old='''<script src=\"rewards-admin.js?v=20260903sync2\"></script>'''
          new='''<script src=\"rewards-admin.js?v=20260903sync3\"></script>'''
          if old not in s: raise SystemExit('rewards admin cache anchor not found')
          s=s.replace(old,new,1)
          h.write_text(s,encoding='utf-8')

          g=Path('grabpoints.html')
          gs=g.read_text(encoding='utf-8')
          gs=gs.replace('12-month earned GP, membership tier','lifetime earned GP, membership tier',1)
          old='<script src=\"rewards.js?v=20260903gpfix2\"></script>'
          new='<script src=\"rewards.js?v=20260903gpfix3\"></script>'
          if old not in gs: raise SystemExit('rewards cache anchor not found')
          gs=gs.replace(old,new,1)
          g.write_text(gs,encoding='utf-8')

          r=Path('rewards.js')
          rs=r.read_text(encoding='utf-8')
          old="""const d=await rpc('rewards_me',{p_token:token()}),hist=await rpc('rewards_history',{p_token:token()}).catch(()=>[]),orders=await rpc('rewards_order_history',{p_token:token()}).catch(()=>[]);const ti=tierInfo(d.tier,d.tiers),earned=Math.max(0,Number(d.lifetime_earned??d.total_earned??0)),lifetime=earned,current=ti.current.threshold,next=ti.next?.threshold||current,progress=ti.next?Math.max(0,Math.min(100,((earned-current)/(next-current))*100)):100,benefitList=ti.current?.benefits||[],rows=Array.isArray(hist)?hist.slice(0,5):[],orderRows=Array.isArray(orders)?orders:[];"""
          new="""const d=await rpc('rewards_me',{p_token:token()}),hist=await rpc('rewards_history',{p_token:token()}).catch(()=>[]),orders=await rpc('rewards_order_history',{p_token:token()}).catch(()=>[]);const ti=tierInfo(d.tier,d.tiers),earned=Math.max(0,Number(d.lifetime_earned??d.total_earned??0)),lifetime=earned,current=ti.current.threshold,next=ti.next?.threshold||current,progress=ti.next?Math.max(0,Math.min(100,((earned-current)/(next-current))*100)):100,benefitList=ti.current?.benefits||[],rows=Array.isArray(hist)?hist.slice(0,5):[],orderRows=Array.isArray(orders)?orders:[],overrideNote=d.tier_override?`<div style=\"margin-top:8px;font-size:10px;color:#ffe9a8\">Admin tier override: ${esc(d.tier_override)}</div>`:'';"""
          if old not in rs: raise SystemExit('rewards dashboard anchor not found')
          rs=rs.replace(old,new,1)
          old="""<div class=\"gz-tier-pill\"><span class=\"gz-tier-dot\"></span>${esc(d.tier)} MEMBER</div><p style=\"margin-top:12px\">"""
          new="""<div class=\"gz-tier-pill\"><span class=\"gz-tier-dot\"></span>${esc(d.tier)} MEMBER</div>${overrideNote}<p style=\"margin-top:12px\">"""
          if old not in rs: raise SystemExit('rewards tier pill anchor not found')
          rs=rs.replace(old,new,1)
          r.write_text(rs,encoding='utf-8')

          w=Path('worker.mjs')
          ws=w.read_text(encoding='utf-8')
          old="""return{data:{member_id:m.member_id,name:m.name,phone:m.phone,email:m.email,points:Number(b.points||0),total_earned:Number(b.total_earned||0),total_redeemed:Number(b.total_redeemed||0),value:Number(b.points||0)*Number(settings?.grabpoints_value??0.1),tier:tier.tier,lifetime_earned:Number(b.total_earned||0),twelve_month_earned:Number(tier.earned||0),next_tier_label:tier.next,next_tier_remaining:Number(tier.remaining||0),discount_percent:Number(cur?.cashback_percent??cur?.discount_percent??0),cashback_percent:Number(cur?.cashback_percent??cur?.discount_percent??0),status:m.status,tiers:tier.tiers||[],vouchers}}}"""
          new="""return{data:{member_id:m.member_id,name:m.name,phone:m.phone,email:m.email,points:Number(b.points||0),total_earned:Number(b.total_earned||0),total_redeemed:Number(b.total_redeemed||0),value:Number(b.points||0)*Number(settings?.grabpoints_value??0.1),tier:tier.tier,tier_override:m.tier_override||null,lifetime_earned:Number(b.total_earned||0),twelve_month_earned:Number(tier.earned||0),next_tier_label:tier.next,next_tier_remaining:Number(tier.remaining||0),discount_percent:Number(cur?.cashback_percent??cur?.discount_percent??0),cashback_percent:Number(cur?.cashback_percent??cur?.discount_percent??0),status:m.status,tiers:tier.tiers||[],vouchers}}}"""
          if old not in ws: raise SystemExit('worker rewards_me anchor not found')
          ws=ws.replace(old,new,1)
          w.write_text(ws,encoding='utf-8')

      - name: Validate JavaScript
        run: |
          node --check worker.mjs
          node --check rewards.js
          node --check rewards-admin.js

      - name: Commit repairs and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html grabpoints.html rewards.js worker.mjs
          git rm .github/workflows/fix-rewards-ui-sync.yml
          git commit -m "Fix Rewards UI and admin sync [rewards-ui-sync-fixed]"
          git push
