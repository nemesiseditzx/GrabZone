name: Fix Forgot PIN UI
on:
  push:
    branches:
      - feature/animated-grabpoints-auth
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[forgot-pin-fixed]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Rewards UI
        shell: python
        run: |
          from pathlib import Path
          p=Path('grabpoints-ui-final.js')
          s=p.read_text(encoding='utf-8')
          marker='/* GRABZONE FORGOT PIN V4 */'
          if marker in s:
              raise SystemExit('already patched')
          patch=r'''\n\n/* GRABZONE FORGOT PIN V4 */\n(()=>{\nif(window.__gzForgotPinV4)return;window.__gzForgotPinV4=true;\nconst sid='gzForgotPinV4Style';\nconst css=`#gzRewardsApp .gz-fp4-card{position:relative!important;overflow:hidden!important;isolation:isolate!important;background:linear-gradient(145deg,#fff,#fff9f3 70%,#fff1e4)!important;border:1px solid #eadfd6!important;border-radius:24px!important;padding:30px!important;box-shadow:0 20px 55px rgba(38,25,15,.1)!important;animation:gzFp4In .65s cubic-bezier(.16,1,.3,1) both}#gzRewardsApp .gz-fp4-card:before{content:'';position:absolute;width:260px;height:260px;right:-130px;top:-145px;border-radius:50%;border:1px solid #ff6b0040;box-shadow:0 0 0 35px #ff6b0009,0 0 0 70px #ff6b0005;animation:gzFp4Orbit 8s linear infinite;pointer-events:none;z-index:-1}#gzRewardsApp .gz-fp4-icon{width:58px;height:58px;border-radius:18px;background:#171717;color:#fff;display:grid;place-items:center;font-size:27px;margin-bottom:15px;box-shadow:0 14px 30px #17171722;animation:gzFp4Icon .7s .08s cubic-bezier(.2,.9,.2,1) both}#gzRewardsApp .gz-fp4-kicker{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid #f0ddd0;border-radius:999px;background:#fff;color:#c8550b;font:900 9px/1 system-ui;letter-spacing:.13em;text-transform:uppercase;margin-bottom:14px}#gzRewardsApp .gz-fp4-kicker i{width:7px;height:7px;border-radius:50%;background:#ff6b00;box-shadow:0 0 0 5px #ff6b0010,0 0 14px #ff6b0060}#gzRewardsApp .gz-fp4-steps{display:flex;align-items:center;gap:7px;margin:18px 0 16px}#gzRewardsApp .gz-fp4-steps b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#f1eeea;color:#81766e;border:1px solid #e3ddd7;font:900 10px system-ui}#gzRewardsApp .gz-fp4-steps b.on{background:#ff6b00;color:#fff;border-color:#ff6b00;box-shadow:0 0 0 6px #ff6b0010;animation:gzFp4Pop .45s both}#gzRewardsApp .gz-fp4-steps i{height:1px;width:36px;background:#ddd5cf}#gzRewardsApp .gz-fp4-card h1,#gzRewardsApp .gz-fp4-card h2,#gzRewardsApp .gz-fp4-card h3{letter-spacing:-.035em;font-weight:900!important;color:#171717!important}#gzRewardsApp .gz-fp4-card p{color:#6f6259!important}#gzRewardsApp .gz-fp4-card input{min-height:54px!important;border:1.5px solid #ddd5cf!important;border-radius:15px!important;background:#fff!important;transition:.25s!important;animation:gzFp4Field .5s .15s both}#gzRewardsApp .gz-fp4-card input:focus{border-color:#ff6b00!important;box-shadow:0 0 0 5px #ff6b0012,0 12px 28px #ff6b000d!important;transform:translateY(-1px)}#gzRewardsApp .gz-fp4-card button{min-height:54px!important;border-radius:15px!important;animation:gzFp4Field .5s .2s both}#gzRewardsApp .gz-fp4-card button.gz-fp4-main{background:linear-gradient(100deg,#ff9800,#ff5b00)!important;color:#111!important;border:0!important;box-shadow:0 13px 30px #ff6b0026!important;font-weight:900!important}#gzRewardsApp .gz-fp4-card button.gz-fp4-secondary{background:#fff!important;color:#171717!important;border:1px solid #ddd5cf!important}#gzRewardsApp .gz-fp4-card .gz-fp4-code{text-align:center!important;letter-spacing:.25em!important;font-size:19px!important;font-weight:900!important}@keyframes gzFp4In{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}@keyframes gzFp4Icon{0%{opacity:0;transform:translateY(15px) rotate(-15deg) scale(.7)}60%{transform:translateY(-4px) rotate(5deg) scale(1.08)}100%{opacity:1;transform:none}}@keyframes gzFp4Orbit{to{transform:rotate(360deg)}}@keyframes gzFp4Field{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes gzFp4Pop{0%{transform:scale(.5);opacity:.2}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}@media(max-width:760px){#gzRewardsApp .gz-fp4-card{padding:21px!important;border-radius:20px!important}#gzRewardsApp .gz-fp4-icon{width:52px;height:52px;font-size:24px}#gzRewardsApp .gz-fp4-steps i{width:24px}}@media(prefers-reduced-motion:reduce){#gzRewardsApp .gz-fp4-card,#gzRewardsApp .gz-fp4-card:before,#gzRewardsApp .gz-fp4-icon,#gzRewardsApp .gz-fp4-card input,#gzRewardsApp .gz-fp4-card button,#gzRewardsApp .gz-fp4-steps b{animation:none!important;transition:none!important}}`;\nfunction install(){if(!document.getElementById(sid)){const st=document.createElement('style');st.id=sid;st.textContent=css;document.head.appendChild(st)}}\nfunction decorate(){const app=document.getElementById('gzRewardsApp');if(!app)return;install();const inputs=[...app.querySelectorAll('input')];const input=inputs.find(x=>/registered rewards email/i.test(x.placeholder||''))||inputs.find(x=>/6.?digit code/i.test(x.placeholder||''));if(!input)return;let card=input.parentElement;for(let n=0;n<12&&card;n++,card=card.parentElement){const txt=(card.textContent||'').replace(/\\s+/g,' ').trim();if(/forgot your pin|check your email/i.test(txt)&&card.querySelector('button'))break}if(!card||card===app)return;if(card.classList.contains('gz-fp4-card'))return;card.classList.add('gz-fp4-card');const code=/6.?digit code|check your email/i.test((card.textContent||'')+' '+(input.placeholder||''));const kicker=document.createElement('div');kicker.className='gz-fp4-kicker';kicker.innerHTML='<i></i>'+(code?'EMAIL VERIFICATION':'SECURE PIN RECOVERY');const icon=document.createElement('div');icon.className='gz-fp4-icon';icon.textContent=code?'✉️':'🔐';const steps=document.createElement('div');steps.className='gz-fp4-steps';steps.innerHTML='<b class="on">1</b><i></i><b class="'+(code?'on':'')+'">2</b><i></i><b>3</b>';card.insertBefore(kicker,card.firstChild);card.insertBefore(icon,kicker.nextSibling);card.insertBefore(steps,icon.nextSibling);if(code)input.classList.add('gz-fp4-code');const buttons=[...card.querySelectorAll('button')];if(buttons[0])buttons[0].classList.add('gz-fp4-main');if(buttons[1])buttons[1].classList.add('gz-fp4-secondary')}\nconst start=()=>{decorate();const app=document.getElementById('gzRewardsApp');if(app)new MutationObserver(()=>requestAnimationFrame(decorate)).observe(app,{childList:true,subtree:true})};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();\n})();\n'''
          s=s+patch
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'grabzone-ui-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add grabpoints-ui-final.js
          git commit -m 'Fix Forgot PIN recovery UI [forgot-pin-fixed]'
          git rm .github/workflows/fix-forgot-pin.yml
          git commit -m 'Remove temporary Forgot PIN workflow'
          git push origin HEAD:feature/animated-grabpoints-auth
