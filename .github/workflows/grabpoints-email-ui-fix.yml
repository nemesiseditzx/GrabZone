name: GrabPoints email UI fix

on:
  push:
    branches:
      - feature/animated-grabpoints-auth

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/animated-grabpoints-auth
          fetch-depth: 0

      - name: Patch premium Rewards emails
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker.mjs')
          s=p.read_text()
          start=s.index('function rewardEmailTheme(tier){')
          end=s.index('async function rewardAudit(', start)
          new=r'''function rewardEmailTheme(tier){
          const k=String(tier||"Member").toLowerCase();
          if(k==="silver")return{key:"silver",a:"#cbd5e1",b:"#64748b",deep:"#334155",soft:"#f1f5f9",label:"SILVER",icon:"✦"};
          if(k==="gold")return{key:"gold",a:"#fbbf24",b:"#b45309",deep:"#78350f",soft:"#fffbeb",label:"GOLD",icon:"◆"};
          if(k==="platinum")return{key:"platinum",a:"#c4b5fd",b:"#7c3aed",deep:"#5b21b6",soft:"#f5f3ff",label:"PLATINUM",icon:"✧"};
          return{key:"member",a:"#ff8a3d",b:"#f26a21",deep:"#c2410c",soft:"#fff7ed",label:"MEMBER",icon:"●"};
          }
          function rewardEmailLogo(){
          return "<div style='font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:900;letter-spacing:-1px;color:#fff;line-height:1'>Grab<span style='color:#ff6b00'>Zone</span></div><div style='margin-top:4px;font-size:9px;font-weight:800;letter-spacing:3px;color:#b9b9c0'>REWARDS</div>";
          }
          function rewardEmailButton(url,label){
          const href=htmlEsc(url||"https://grab-zone-ten.vercel.app/grabpoints");
          return "<a href='"+href+"' style='display:inline-block;background:#ff6b00;color:#fff;text-decoration:none;padding:13px 20px;border-radius:12px;font-size:13px;font-weight:900'>"+htmlEsc(label)+" →</a>";
          }
          function rewardEmailTierCard(tier){
          const th=rewardEmailTheme(tier);
          const benefits={Member:"1% GP cashback",Silver:"2% GP cashback",Gold:"3% GP cashback",Platinum:"5% GP cashback"}[tier]||"Rewards member";
          return "<div style='margin-top:20px;padding:16px 18px;border-radius:16px;background:"+th.soft+";border:1px solid "+th.a+"88'><table role='presentation' width='100%' cellpadding='0' cellspacing='0'><tr><td><div style='font-size:9px;font-weight:900;letter-spacing:2px;color:"+th.deep+"'>CURRENT MEMBERSHIP</div><div style='margin-top:5px;font-size:20px;font-weight:900;color:#171717'>"+th.icon+" "+htmlEsc(th.label)+"</div><div style='margin-top:4px;font-size:11px;color:#666'>"+benefits+" on eligible purchases</div></td><td align='right' valign='middle'><div style='display:inline-block;padding:8px 10px;border-radius:999px;background:"+th.b+";color:#fff;font-size:9px;font-weight:900;letter-spacing:1px'>"+htmlEsc(th.label)+"</div></td></tr></table></div>";
          }
          async function sendRewardsEmail(env,to,subject,title,body,preheader="",strict=false,tier="Member",memberName="",memberId=""){
          try{
          if(!to||!env.GOOGLE_CLIENT_ID||!env.GOOGLE_CLIENT_SECRET||!env.GOOGLE_REFRESH_TOKEN||!env.GMAIL_FROM_EMAIL){if(strict)throw new Error("Rewards email service is not configured.");return false;}
          const th=rewardEmailTheme(tier),name=htmlEsc(memberName||""),mid=htmlEsc(memberId||""),safeTitle=htmlEsc(title),safeSubject=String(subject||"GrabZone Rewards"),safePre=htmlEsc(preheader||"");
          const greeting=name?"Hi <b>"+name+"</b>,":"Hi there,";
          const memberBlock=(name||mid)?"<div style='margin:0 0 22px;padding:16px;border-radius:16px;background:"+th.soft+";border:1px solid "+th.a+"66'><div style='font-size:9px;font-weight:900;letter-spacing:2px;color:"+th.deep+"'>"+th.icon+" YOUR REWARDS ACCOUNT</div>"+(name?"<div style='font-size:17px;font-weight:900;margin-top:5px;color:#16161a'>"+name+"</div>":"")+(mid?"<div style='font-size:11px;color:#777;margin-top:3px'>Member ID · <b>"+mid+"</b></div>":"")+"</div>":"";
          const hero="<div style='background:linear-gradient(135deg,#0b0b0d 0%,#17171b 58%,"+th.deep+" 160%);padding:28px 30px 30px;position:relative;overflow:hidden'><div style='height:4px;width:62px;border-radius:99px;background:linear-gradient(90deg,"+th.a+","+th.b+");margin-bottom:22px'></div>"+rewardEmailLogo()+"<div style='margin-top:28px;font-size:10px;font-weight:900;letter-spacing:3px;color:"+th.a+"'>GRABZONE REWARDS</div><div style='font-size:32px;line-height:1.05;font-weight:900;letter-spacing:-1px;color:#fff;margin-top:9px'>"+safeTitle+"</div>"+(safePre?"<div style='font-size:12px;line-height:1.55;color:#d4d4d8;margin-top:10px'>"+safePre+"</div>":"")+"<div style='display:inline-block;margin-top:16px;padding:7px 11px;border-radius:999px;border:1px solid "+th.a+"99;color:#fff;font-size:9px;font-weight:900;letter-spacing:1.5px'>"+th.icon+" "+th.label+" MEMBER</div><div style='position:absolute;right:-42px;top:-52px;width:190px;height:190px;border-radius:50%;border:1px solid "+th.a+"35;box-shadow:0 0 0 32px "+th.a+"10,0 0 0 64px "+th.a+"08'></div></div>";
          const security="<div style='margin-top:26px;padding:17px 18px;border-radius:15px;background:#f7f7f5;border:1px solid #e9e9e4'><div style='font-size:12px;font-weight:900;color:#171717'>Security & account activity</div><div style='font-size:12px;line-height:1.6;color:#707070;margin-top:5px'>If you did not request this activity, contact GrabZone Support immediately.</div></div>";
          const footer="<div style='margin-top:28px;padding-top:20px;border-top:1px solid #e9e9e9'><div style='text-align:center'>"+rewardEmailButton("https://grab-zone-ten.vercel.app/grabpoints","Open GrabZone Rewards")+"</div><div style='margin-top:20px;font-size:12px;color:#777;line-height:1.6'>Thanks for being part of <b style='color:#ff6b00'>GrabZone Rewards</b>.</div><div style='margin-top:14px;font-size:10px;font-weight:900;letter-spacing:2.5px;color:#999'>GRABZONE — MORE THAN A STORE</div><div style='margin-top:8px;font-size:11px;color:#999'>Need help? Contact GrabZone Support.</div></div>";
          const html="<!doctype html><html><head><meta charset='UTF-8'><meta name='color-scheme' content='light'></head><body style='margin:0;background:#0b0b0d;font-family:Arial,Helvetica,sans-serif;color:#171717'><div style='width:100%;background:radial-gradient(circle at 50% 0%,"+th.deep+" 0, #0b0b0d 42%);padding:28px 10px;box-sizing:border-box'><div style='max-width:620px;margin:0 auto;background:#fff;border-radius:22px;overflow:hidden;border:1px solid #2d2d31;box-shadow:0 20px 70px rgba(0,0,0,.35)'>"+hero+"<div style='padding:28px 30px 32px;background:#fff'>"+memberBlock+"<div style='font-size:14px;color:#444;line-height:1.75'>"+greeting+"<div style='margin-top:12px'>"+body+"</div></div>"+security+footer+"</div></div><div style='max-width:620px;margin:13px auto 0;text-align:center;font-size:9px;letter-spacing:1.8px;color:#777'>YOU ARE RECEIVING THIS EMAIL FROM GRABZONE REWARDS</div></div></body></html>";
          const plain=String(safeTitle)+"\n\n"+(name?"Hi, "+String(memberName)+"\n":"")+(mid?"Member ID: "+String(memberId)+"\n":"")+"Tier: "+String(th.label)+"\n\n"+String(preheader||body).replace(/<[^>]+>/g,"");
          const boundary="gzr_"+crypto.randomUUID().replace(/-/g,"");
          const raw=["From: GrabZone <"+env.GMAIL_FROM_EMAIL+">","To: "+to,"Subject: "+mimeSubject(safeSubject),"MIME-Version: 1.0","Content-Type: multipart/alternative; boundary=\""+boundary+"\"","","--"+boundary,'Content-Type: text/plain; charset="UTF-8"',"Content-Transfer-Encoding: 8bit","",plain,"--"+boundary,'Content-Type: text/html; charset="UTF-8"',"Content-Transfer-Encoding: 8bit","",html,"--"+boundary+"--",""] .join("\r\n");
          const rr=await fetch("https://gmail.googleapis.com/gmail/v1/users/me/messages/send",{method:"POST",headers:{Authorization:"Bearer "+await gmailToken(env),"Content-Type":"application/json"},body:JSON.stringify({raw:btoa(unescape(encodeURIComponent(raw))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=/g,"")})});
          if(!rr.ok){const ed=await rr.json().catch(()=>({})),msg=ed?.error?.message||("Gmail request failed ("+rr.status+").");if(strict)throw new Error(msg);console.warn("Rewards email:",msg);return false}
          return true;
          }catch(e){console.warn("Rewards email:",e);if(strict)throw e;return false}
          }
          '''
          s=s[:start]+new+s[end:]
          s=s.replace('m.tier_override||"Member",m.name,m.member_id', '(await rewardTier(env,m.id)).tier,m.name,m.member_id')
          p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Upgrade GrabPoints email templates [skip ci]'
          git push origin HEAD:feature/animated-grabpoints-auth
