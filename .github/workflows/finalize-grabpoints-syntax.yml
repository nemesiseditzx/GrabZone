name: Finalize GrabPoints Syntax Repair

on:
  push:
    branches:
      - feature/animated-grabpoints-auth

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove malformed legacy V4 tail from core
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('grabpoints-ui-core.js')
          s = p.read_text(encoding='utf-8')
          marker = '/* GRABZONE FORGOT PIN V4 */'
          idx = s.find(marker)
          if idx < 0:
              raise SystemExit('Legacy V4 marker not found')
          prefix = s[:idx]
          end = prefix.rfind('})();')
          if end < 0:
              raise SystemExit('Core IIFE terminator not found')
          s = prefix[:end + len('})();')] + '\n'
          p.write_text(s, encoding='utf-8')
          PY
          node --check rewards.js
          node --check grabpoints-ui-core.js

      - name: Remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/finalize-grabpoints-syntax.yml
          rm -f .github/workflows/repair-core-syntax.yml
          rm -f .github/workflows/repair-rewards-syntax.yml
          rm -f .github/workflows/fix-forgot-pin-send-v2.yml

      - name: Commit verified repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grabpoints-ui-core.js .github/workflows
          git commit -m "Fix GrabPoints JavaScript startup errors"
          git push origin HEAD:feature/animated-grabpoints-auth
