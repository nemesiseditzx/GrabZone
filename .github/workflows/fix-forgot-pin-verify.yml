name: Fix Forgot PIN verification

on:
  push:
    branches:
      - feature/animated-grabpoints-auth

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/animated-grabpoints-auth
          fetch-depth: 0

      - name: Repair verification bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rewards.js')
          s = p.read_text()
          old = "document.getElementById('gzFpV7Verify').onclick=()=>{sync();verifyFn&&verifyFn()};"
          new = """document.getElementById('gzFpV7Verify').onclick=()=>{\n      sync();\n      let legacyOtp=document.getElementById('grOtp');\n      if(!legacyOtp){legacyOtp=document.createElement('input');legacyOtp.id='grOtp';legacyOtp.type='hidden';b.appendChild(legacyOtp)}\n      legacyOtp.value=otp.value;\n      const msg=document.getElementById('gzFpV7Msg');\n      msg.id='grMsg';\n      if(verifyFn)verifyFn();\n    };"""
          if old not in s:
              raise SystemExit('Expected verification handler was not found; refusing to modify file.')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Validate JavaScript syntax
        run: node --check rewards.js

      - name: Commit repair and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rewards.js
          git rm .github/workflows/fix-forgot-pin-verify.yml
          git commit -m "Fix Forgot PIN verification bridge"
          git push origin HEAD:feature/animated-grabpoints-auth
