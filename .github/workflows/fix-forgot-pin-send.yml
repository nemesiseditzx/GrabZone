name: Fix Forgot PIN Send Button
on:
  push:
    branches:
      - feature/animated-grabpoints-auth
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/animated-grabpoints-auth
          fetch-depth: 0
      - name: Patch Forgot PIN button wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rewards.js')
          s = p.read_text()
          old = "document.getElementById('gzFpV7Send').onclick=()=>{email.value=ni.value;sendFn&&sendFn()};"
          new = "document.getElementById('gzFpV7Send').onclick=()=>{const value=ni.value.trim();let legacyEmail=document.getElementById('grResetEmail');if(!legacyEmail){legacyEmail=document.createElement('input');legacyEmail.id='grResetEmail';legacyEmail.type='hidden';b.appendChild(legacyEmail)}legacyEmail.value=value;email.value=value;const msg=document.getElementById('gzFpV7Msg');msg.id='grMsg';if(!value){msg.textContent='✕ Enter your registered Rewards email.';msg.style.color='#ffb5a8';ni.focus();return}if(sendFn)sendFn()};"
          if old not in s:
              raise SystemExit('Expected Forgot PIN send handler was not found; refusing to patch.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-forgot-pin-send.yml
          git add rewards.js
          git commit -m "Fix Forgot PIN verification button wiring"
          git push origin feature/animated-grabpoints-auth
