name: Fix Forgot PIN Send Button
on:
  push:
    branches:
      - feature/animated-grabpoints-auth
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/animated-grabpoints-auth
          fetch-depth: 0
      - name: Patch Forgot PIN compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rewards.js')
          s = p.read_text()
          old = '''b.innerHTML='<div class="gz-fp-v7-card"><div class="gz-fp-v7-icon">🔐</div><div class="gz-fp-v7-kicker"><i></i>SECURE PIN RECOVERY</div><h2>Forgot your PIN?</h2><p class="gz-fp-v7-copy">Recover your Rewards account securely. We will send a one-time verification code to your registered email.</p><div class="gz-fp-v7-progress"><b class="on">1</b><i></i><b>2</b><i></i><b>3</b></div><label class="gz-fp-v7-label" for="gzFpV7Email">Registered Rewards email</label><input id="gzFpV7Email" class="gz-fp-v7-field" type="email" placeholder="name@example.com" autocomplete="email"><div class="gz-fp-v7-actions"><button type="button" class="gz-fp-v7-primary" id="gzFpV7Send">Send Verification Code →</button><button type="button" class="gz-fp-v7-secondary" id="gzFpV7Back">Back to Login</button></div><div id="gzFpV7Msg" class="gz-fp-v7-msg"></div><div class="gz-fp-v7-note">🛡️ <span><strong>Private & secure.</strong> Your verification code is sent only to the email registered with your Rewards account.</span></div></div>';
          const ni=document.getElementById('gzFpV7Email'); ni.value=email.value||'';
          document.getElementById('gzFpV7Send').onclick=()=>{email.value=ni.value;sendFn&&sendFn()};'''
          new = '''b.innerHTML='<div class="gz-fp-v7-card"><div class="gz-fp-v7-icon">🔐</div><div class="gz-fp-v7-kicker"><i></i>SECURE PIN RECOVERY</div><h2>Forgot your PIN?</h2><p class="gz-fp-v7-copy">Recover your Rewards account securely. We will send a one-time verification code to your registered email.</p><div class="gz-fp-v7-progress"><b class="on">1</b><i></i><b>2</b><i></i><b>3</b></div><label class="gz-fp-v7-label" for="gzFpV7Email">Registered Rewards email</label><input id="gzFpV7Email" class="gz-fp-v7-field" type="email" placeholder="name@example.com" autocomplete="email"><input id="grResetEmail" type="hidden"><div class="gz-fp-v7-actions"><button type="button" class="gz-fp-v7-primary" id="gzFpV7Send">Send Verification Code →</button><button type="button" class="gz-fp-v7-secondary" id="gzFpV7Back">Back to Login</button></div><div id="gzFpV7Msg" class="gz-fp-v7-msg"></div><div class="gz-fp-v7-note">🛡️ <span><strong>Private & secure.</strong> Your verification code is sent only to the email registered with your Rewards account.</span></div></div>';
          const ni=document.getElementById('gzFpV7Email'); const legacyEmail=document.getElementById('grResetEmail'); const msg=document.getElementById('gzFpV7Msg'); msg.id='grMsg'; ni.value=email.value||''; legacyEmail.value=ni.value;
          document.getElementById('gzFpV7Send').onclick=()=>{legacyEmail.value=ni.value.trim();if(!legacyEmail.value){msg.textContent='✕ Enter your registered Rewards email.';msg.style.color='#ffb5a8';ni.focus();return}if(sendFn)sendFn()};'''
          if old not in s:
              raise SystemExit('Expected Forgot PIN V7 block was not found; refusing to patch.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-forgot-pin-send.yml
          git add rewards.js
          git commit -m "Fix Forgot PIN verification button wiring"
          git push origin feature/animated-grabpoints-auth
