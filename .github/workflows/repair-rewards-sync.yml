name: Repair Rewards Admin Sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[rewards-sync-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Rewards sync
        shell: python
        run: |
          from pathlib import Path
          w=Path('worker.mjs'); s=w.read_text(encoding='utf-8')
          old='await env.DB.prepare("UPDATE membership_tiers SET min_points=?,discount_percent=?,benefits=?,updated_at=? WHERE tier=?").bind(min,disc,benefits,now(),name).run()'
          new='await env.DB.prepare("UPDATE membership_tiers SET min_points=?,discount_percent=?,cashback_percent=?,benefits=?,updated_at=? WHERE tier=?").bind(min,disc,disc,benefits,now(),name).run()'
          if old not in s: raise SystemExit('membership tier save anchor not found')
          s=s.replace(old,new,1)
          w.write_text(s,encoding='utf-8')
          h=Path('admin.html'); hs=h.read_text(encoding='utf-8')
          oldh='<script src="rewards-admin.js?v=20260903gpmodel1"></script>'
          newh='<script src="rewards-admin.js?v=20260903sync2"></script>'
          if oldh not in hs: raise SystemExit('rewards-admin cache anchor not found')
          hs=hs.replace(oldh,newh,1)
          h.write_text(hs,encoding='utf-8')
          r=Path('rewards-admin.js'); rs=r.read_text(encoding='utf-8')
          rs=rs.replace('Count this added GP toward the member’s 12-month tier progress?','Count this added GP toward the member’s membership tier progress?',1)
          r.write_text(rs,encoding='utf-8')
      - name: Validate worker syntax
        run: node --check worker.mjs
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.mjs admin.html rewards-admin.js
          git rm .github/workflows/repair-rewards-sync.yml
          git commit -m "Fix Rewards admin and customer tier sync [rewards-sync-fixed]"
          git push
