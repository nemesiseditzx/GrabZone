name: Apply Rewards 365-Day Tier Logic

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[rewards-365d]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch worker and Rewards UI
        shell: python
        run: |
          from pathlib import Path

          w = Path('worker.mjs')
          s = w.read_text(encoding='utf-8')

          old = '''async function rewardTier(env,memberId){const m=(await q(env,"SELECT * FROM rewards_members WHERE id=? LIMIT 1",[memberId])).results?.[0];if(!m)return{tier:"Member",earned:0,remaining:0,next:"Member",tiers:[]};if(m.tier_override){const tiers=(await q(env,"SELECT * FROM membership_tiers ORDER BY min_points ASC")).results||[];const cur=tiers.find(t=>t.tier===m.tier_override)||tiers[tiers.length-1]||{tier:m.tier_override,min_points:0};return{tier:cur.tier,earned:0,remaining:0,next:cur.tier,tiers}}const e=(await q(env,"SELECT COALESCE(SUM(qualifying_points),0) AS earned FROM grabpoints_ledger WHERE phone=?",[m.phone])).results?.[0]?.earned||0;const tiers=(await q(env,"SELECT * FROM membership_tiers ORDER BY min_points ASC")).results||[];let cur=tiers[0]||{tier:"Member",min_points:0};for(const t of tiers)if(Number(e)>=Number(t.min_points))cur=t;const next=tiers.find(t=>Number(t.min_points)>Number(cur.min_points));return{tier:cur.tier,earned:Number(e),remaining:next?Math.max(0,Number(next.min_points)-Number(e)):0,next:next?.tier||cur.tier,tiers}}'''
          new = '''async function rewardTier(env,memberId){const m=(await q(env,"SELECT * FROM rewards_members WHERE id=? LIMIT 1",[memberId])).results?.[0];if(!m)return{tier:"Member",earned:0,remaining:0,next:"Member",tiers:[]};const tiers=(await q(env,"SELECT * FROM membership_tiers ORDER BY min_points ASC")).results||[];if(m.tier_override){const cur=tiers.find(t=>t.tier===m.tier_override)||tiers[tiers.length-1]||{tier:m.tier_override,min_points:0};return{tier:cur.tier,earned:0,remaining:0,next:cur.tier,tiers}}const cutoff=new Date(Date.now()-365*24*60*60*1000).toISOString();const e=(await q(env,"SELECT COALESCE(SUM(qualifying_points),0) AS earned FROM grabpoints_ledger WHERE phone=? AND created_at>=?",[m.phone,cutoff])).results?.[0]?.earned||0;const earned=Math.max(0,Number(e));let cur=tiers[0]||{tier:"Member",min_points:0};for(const t of tiers)if(earned>=Number(t.min_points))cur=t;const next=tiers.find(t=>Number(t.min_points)>Number(cur.min_points));return{tier:cur.tier,earned,remaining:next?Math.max(0,Number(next.min_points)-earned):0,next:next?.tier||cur.tier,tiers}}'''
          if old not in s:
              raise SystemExit('rewardTier anchor not found; aborting without changes')
          s = s.replace(old, new, 1)

          old_me = '''tier:tier.tier,lifetime_earned:Number(tier.earned||0),twelve_month_earned:Number(tier.earned||0),next_tier_label:tier.next,next_tier_remaining:Number(tier.remaining||0),'''
          new_me = '''tier:tier.tier,lifetime_earned:Number(b.total_earned||0),twelve_month_earned:Number(tier.earned||0),next_tier_label:tier.next,next_tier_remaining:Number(tier.remaining||0),'''
          if old_me not in s:
              raise SystemExit('rewards_me anchor not found; aborting without changes')
          s = s.replace(old_me, new_me, 1)
          w.write_text(s, encoding='utf-8')

          r = Path('rewards.js')
          rs = r.read_text(encoding='utf-8')
          rs_old = '''const ti=tierInfo(d.tier,d.tiers),earned=Math.max(0,Number(d.lifetime_earned??d.twelve_month_earned??0)),current=ti.current.threshold,next=ti.next?.threshold||current,progress=ti.next?Math.max(0,Math.min(100,((earned-current)/(next-current))*100)):100,'''
          rs_new = '''const ti=tierInfo(d.tier,d.tiers),earned=Math.max(0,Number(d.twelve_month_earned??0)),lifetime=Math.max(0,Number(d.lifetime_earned??d.total_earned??0)),current=ti.current.threshold,next=ti.next?.threshold||current,progress=ti.next?Math.max(0,Math.min(100,((earned-current)/(next-current))*100)):100,'''
          if rs_old not in rs:
              raise SystemExit('Rewards UI calculation anchor not found; aborting without changes')
          rs = rs.replace(rs_old, rs_new, 1)
          rs = rs.replace('<small>Lifetime GP</small><b>${earned.toLocaleString(\'en-BD\')}</b><span>Determines your membership tier</span>', '<small>Lifetime GP</small><b>${lifetime.toLocaleString(\'en-BD\')}</b><span>Total lifetime GP earned</span>', 1)
          rs = rs.replace('<span>${earned.toLocaleString(\'en-BD\')} GP earned</span><span>${ti.next?next.toLocaleString(\'en-BD\')+\' GP needed\':\'Top tier reached\'}</span>', '<span>${earned.toLocaleString(\'en-BD\')} GP in last 12 months</span><span>${ti.next?next.toLocaleString(\'en-BD\')+\' GP needed\':\'Top tier reached\'}</span>', 1)
          r.write_text(rs, encoding='utf-8')
      
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.mjs rewards.js
          git diff --cached --quiet && exit 0
          git commit -m "Implement rolling 365-day Rewards tier logic [rewards-365d]"
          git push
