name: Fix GrabPoints hardening runner

on:
  push:
    branches:
      - feature/animated-grabpoints-auth

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/animated-grabpoints-auth
          fetch-depth: 0
      - name: Fix Python shell declaration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/harden-grabpoints.yml')
          s=p.read_text()
          s=s.replace('        shell: python\n', '        shell: python3 {0}\n', 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/harden-grabpoints.yml
          git rm .github/workflows/fix-harden-workflow.yml
          git commit -m "Fix GrabPoints hardening workflow runner"
          git push origin HEAD:feature/animated-grabpoints-auth
