name: Final GrabPoints redeem stability
on:
  push:
    branches: [feature/animated-grabpoints-auth]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/animated-grabpoints-auth
          fetch-depth: 0
      - name: Remove duplicate Rewards renders and add effects
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('grabpoints.html')
          s=p.read_text()
          s=s.replace('<script src="grabpoints-redeem-animation.js?v=20260908redeem1"></script>\n<script src="grabpoints-redeem-flow.js?v=20260908flow2"></script>', '<script src="grabpoints-redeem-animation.js?v=20260908redeem2"></script>\n<script src="grabpoints-redeem-flow.js?v=20260908flow3"></script>')
          old='''  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bootRewards);\n  else setTimeout(bootRewards,0);\n  setTimeout(bootRewards,500);\n  setTimeout(bootRewards,1500);'''
          new='''  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bootRewards,{once:true});\n  else bootRewards();'''
          if old not in s: raise SystemExit('boot block not found')
          s=s.replace(old,new,1)
          old2="document.addEventListener('DOMContentLoaded',function(){window.GrabZoneRewards?.render?.()});"
          new2="document.addEventListener('DOMContentLoaded',function(){/* initial render is handled once by bootRewards */},{once:true});"
          if old2 not in s: raise SystemExit('language render hook not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grabpoints.html
          git commit -m 'Stabilize GrabPoints render and redeem effects [skip ci]'
          git push origin HEAD:feature/animated-grabpoints-auth