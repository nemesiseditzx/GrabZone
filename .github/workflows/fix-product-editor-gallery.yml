name: Fix product editor gallery save
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch gallery timestamps
        run: >-
          python -c "from pathlib import Path; p=Path('admin.html'); s=p.read_text(); old='''      const rows=gzEditGallery.map((img,index)=>({\n        product_id:gzEditProduct.id,\n        image_url:img.image_url,\n        sort_order:index,\n        is_main:index===mainIndex\n      }));'''; new='''      const galleryTimestamp=new Date().toISOString();\n      const rows=gzEditGallery.map((img,index)=>({\n        product_id:gzEditProduct.id,\n        image_url:img.image_url,\n        sort_order:index,\n        is_main:index===mainIndex,\n        created_at:galleryTimestamp\n      }));'''; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new))"
      - name: Validate
        run: |
          grep -q 'created_at:galleryTimestamp' admin.html
          node --check admin.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git diff --cached --quiet || git commit -m 'Fix product editor gallery created_at'
          git push