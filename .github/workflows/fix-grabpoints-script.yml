name: Fix GrabPoints hardening script

on:
  push:
    branches:
      - feature/animated-grabpoints-auth

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/animated-grabpoints-auth
          fetch-depth: 0
      - name: Fix replacement helper and run hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/harden_grabpoints.py')
          s=p.read_text()
          s=s.replace('out, n = re.subn(pattern, replacement, text, count=1, flags=re.M)', 'out, n = re.subn(pattern, lambda _m: replacement, text, count=1, flags=re.M)', 1)
          p.write_text(s)
          PY
          python3 scripts/harden_grabpoints.py
          node --check rewards.js
          node --check worker.mjs
          node --check grabpoints-ui-final.js
          node --check grabpoints-redeem-flow.js
          python3 - <<'PY'
          from pathlib import Path
          r=Path('rewards.js').read_text();h=Path('grabpoints.html').read_text();w=Path('worker.mjs').read_text()
          assert 'GRABZONE FORGOT PIN V7' not in r and 'gzFpV7' not in r
          assert 'function verifyCode(email,code)' in r
          assert 'grabpoints-redeem-animation.js' not in h
          assert 'cashback on member orders' in w and 'cashbackBase' in w
          assert 'EXISTS (SELECT 1 FROM rewards_tx_guard WHERE ok=1)' in w
          print('PASS')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/harden_grabpoints.py rewards.js grabpoints.html grabpoints-ui-final.js worker.mjs
          git commit -m "Apply GrabPoints hardening fixes"
          git push origin HEAD:feature/animated-grabpoints-auth
