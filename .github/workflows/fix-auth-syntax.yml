name: Fix GrabPoints auth script syntax
on:
  push:
    branches: [feature/animated-grabpoints-auth]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/animated-grabpoints-auth
          fetch-depth: 0
      - name: Remove duplicate declaration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('grabpoints-auth-animation.js')
          s=p.read_text()
          old='  let stabilityTimer = null;\n\n  let stabilityTimer = null;'
          new='  let stabilityTimer = null;'
          if old not in s:
            raise SystemExit('duplicate stabilityTimer declaration not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grabpoints-auth-animation.js
          git commit -m 'Fix GrabPoints auth syntax error [skip ci]'
          git push origin HEAD:feature/animated-grabpoints-auth
