name: Restore Rewards Tier Calculation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[restore-rewards-tier]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct Rewards tier calculation
        shell: python
        run: |
          from pathlib import Path
          w=Path('worker.mjs')
          s=w.read_text(encoding='utf-8')
          old='''async function rewardTier(env,memberId){const m=(await q(env,"SELECT * FROM rewards_members WHERE id=? LIMIT 1",[memberId])).results?.[0];if(!m)return{tier:"Member",earned:0,remaining:0,next:"Member",tiers:[]};const tiers=(await q(env,"SELECT * FROM membership_tiers ORDER BY min_points ASC")).results||[];if(m.tier_override){const cur=tiers.find(t=>t.tier===m.tier_override)||tiers[tiers.length-1]||{tier:m.tier_override,min_points:0};return{tier:cur.tier,earned:0,remaining:0,next:cur.tier,tiers}}const cutoff=new Date(Date.now()-365*24*60*60*1000).toISOString();const e=(await q(env,"SELECT COALESCE(SUM(qualifying_points),0) AS earned FROM grabpoints_ledger WHERE phone=? AND created_at>=?",[m.phone,cutoff])).results?.[0]?.earned||0;const earned=Math.max(0,Number(e));let cur=tiers[0]||{tier:"Member",min_points:0};for(const t of tiers)if(earned>=Number(t.min_points))cur=t;const next=tiers.find(t=>Number(t.min_points)>Number(cur.min_points));return{tier:cur.tier,earned,remaining:next?Math.max(0,Number(next.min_points)-earned):0,next:next?.tier||cur.tier,tiers}}'''
          new='''async function rewardTier(env,memberId){const m=(await q(env,"SELECT * FROM rewards_members WHERE id=? LIMIT 1",[memberId])).results?.[0];if(!m)return{tier:"Member",earned:0,remaining:0,next:"Member",tiers:[]};const tiers=(await q(env,"SELECT * FROM membership_tiers ORDER BY min_points ASC")).results||[];if(m.tier_override){const cur=tiers.find(t=>t.tier===m.tier_override)||tiers[tiers.length-1]||{tier:m.tier_override,min_points:0};return{tier:cur.tier,earned:0,remaining:0,next:cur.tier,tiers}}const e=(await q(env,"SELECT COALESCE(SUM(qualifying_points),0) AS earned FROM grabpoints_ledger WHERE phone=?",[m.phone])).results?.[0]?.earned||0;const earned=Math.max(0,Number(e));let cur=tiers[0]||{tier:"Member",min_points:0};for(const t of tiers)if(earned>=Number(t.min_points))cur=t;const next=tiers.find(t=>Number(t.min_points)>Number(cur.min_points));return{tier:cur.tier,earned,remaining:next?Math.max(0,Number(next.min_points)-earned):0,next:next?.tier||cur.tier,tiers}}'''
          if old not in s: raise SystemExit('tier anchor not found; abort')
          s=s.replace(old,new,1)
          w.write_text(s,encoding='utf-8')
          r=Path('rewards.js')
          rs=r.read_text(encoding='utf-8')
          old2='''const ti=tierInfo(d.tier,d.tiers),earned=Math.max(0,Number(d.twelve_month_earned??0)),lifetime=Math.max(0,Number(d.lifetime_earned??d.total_earned??0)),current=ti.current.threshold,next=ti.next?.threshold||current,progress=ti.next?Math.max(0,Math.min(100,((earned-current)/(next-current))*100)):100,'''
          new2='''const ti=tierInfo(d.tier,d.tiers),earned=Math.max(0,Number(d.lifetime_earned??d.total_earned??0)),lifetime=earned,current=ti.current.threshold,next=ti.next?.threshold||current,progress=ti.next?Math.max(0,Math.min(100,((earned-current)/(next-current))*100)):100,'''
          if old2 not in rs: raise SystemExit('UI tier anchor not found; abort')
          rs=rs.replace(old2,new2,1)
          rs=rs.replace('${earned.toLocaleString(\'en-BD\')} GP in last 12 months','${earned.toLocaleString(\'en-BD\')} GP earned toward your tier',1)
          r.write_text(rs,encoding='utf-8')
      - name: Validate
        run: node --check worker.mjs && node --check rewards.js
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.mjs rewards.js
          git diff --cached --quiet && exit 0
          git commit -m "Restore lifetime Rewards tier calculation [restore-rewards-tier]"
          git push
