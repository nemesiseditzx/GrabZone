name: Restore Known Good GrabPoints Rewards

on:
  push:
    branches:
      - feature/animated-grabpoints-auth

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore verified Rewards blob
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e fa95cad89c98e3d0ee4ea08354ea5e8e611004f0
          git cat-file -p fa95cad89c98e3d0ee4ea08354ea5e8e611004f0 > rewards.js
          node --check rewards.js
          node --check grabpoints-ui-core.js
          rm -f .github/workflows/restore-rewards-good.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rewards.js .github/workflows/restore-rewards-good.yml
          git commit -m "Restore verified GrabPoints Rewards script"
          git push origin HEAD:feature/animated-grabpoints-auth
