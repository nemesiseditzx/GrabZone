name: Fix Delivered GrabPoints
on:
  push:
    paths:
      - '.github/workflows/fix-delivered-gp.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch worker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker.mjs')
          s=p.read_text()
          old='SELECT id,order_number,phone,total,status,grabpoints_opt_in FROM orders'
          new='SELECT id,order_number,phone,total,status,grabpoints_opt_in,subtotal,referral_discount,rewards_voucher_discount,mystery_discount FROM orders'
          if old not in s:
              raise SystemExit('Expected order SELECT not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check worker.mjs
      - name: Commit worker fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.mjs
          git commit -m 'fix: include order discounts in delivered GP calculation'
          git push
      - name: Deploy worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy ./worker.mjs
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-delivered-gp.yml
          git commit -m 'chore: remove temporary GP repair workflow'
          git push
