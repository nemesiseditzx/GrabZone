name: Patch Rewards order history

on:
  push:
    paths:
      - '.github/workflows/patch-rewards-orders.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Rewards UI and D1 order details
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          r = Path('rewards.js')
          s = r.read_text(encoding='utf-8')

          old_css = ".gz-stat.tier{background:linear-gradient(135deg,#087f88,#08a36e)}.gz-stat.tier b{font-size:27px}"
          new_css = ".gz-stat.tier{background:linear-gradient(135deg,#087f88,#08a36e)}.gz-stat.tier small{color:#eafff8;opacity:1}.gz-stat.tier b{font-size:27px;color:#fff;text-shadow:0 1px 2px #0005}.gz-stat.tier span{color:#f2fffb;opacity:1}.gz-orders-toggle{margin-top:12px;width:100%;border:1px solid #ddd;background:#fff;color:#34228f;border-radius:12px;padding:11px;font:900 11px system-ui;cursor:pointer}.gz-orders-toggle:hover{background:#f7f5ff}.gz-order-details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:10px}.gz-order-detail{padding:8px 9px;border:1px solid #eee;border-radius:10px;background:#fafafa}.gz-order-detail small{display:block;color:#777;font-size:8px;margin:0}.gz-order-detail b{display:block;color:#222;font-size:10px;line-height:1.45;margin-top:2px;word-break:break-word}.gz-order-items-full{display:grid;gap:7px;margin-top:10px}.gz-order-item-full{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;padding:8px;border:1px solid #eee;border-radius:10px}.gz-order-item-full img{width:38px;height:38px;object-fit:cover;border-radius:8px;background:#f1f1f1}.gz-order-item-full b{font-size:10px}.gz-order-item-full small{display:block;color:#777;font-size:9px;margin-top:2px}.gz-order-item-full strong{font-size:10px}.gz-order-admin-note{margin-top:9px;padding:9px;border-radius:10px;background:#fff8e8;border:1px solid #f0dfb0;font-size:10px;color:#664d00;line-height:1.5}.gz-orders-footer{margin-top:10px}"
          if old_css in s and 'gz-orders-toggle' not in s:
              s = s.replace(old_css, new_css, 1)

          start = s.find('async function loadDashboard(){')
          end = s.find('\nasync function redeem(){', start)
          if start < 0 or end < 0:
              raise SystemExit('loadDashboard boundaries not found')

          new_fn = r'''async function loadDashboard(){const b=$('gzRewardsBody');if(!b)return;try{b.innerHTML='<div style="padding:28px;text-align:center;color:#777;font-size:13px">Loading your GrabPoints account…</div>';const d=await rpc('rewards_me',{p_token:token()}),hist=await rpc('rewards_history',{p_token:token()}).catch(()=>[]),orders=await rpc('rewards_order_history',{p_token:token()}).catch(()=>[]);const ti=tierInfo(d.tier,d.tiers),earned=Math.max(0,Number(d.lifetime_earned??d.twelve_month_earned??0)),current=ti.current.threshold,next=ti.next?.threshold||current,progress=ti.next?Math.max(0,Math.min(100,((earned-current)/(next-current))*100)):100,benefitList=ti.current?.benefits||[],rows=Array.isArray(hist)?hist.slice(0,5):[],orderRows=Array.isArray(orders)?orders:[];const recent=rows.map(x=>{const p=Number(x.points||0);return `<div class="gz-recent-row ${p<0?'minus':''}"><div class="gz-recent-icon">${p<0?'↗':'+'}</div><div><b>${p>0?'+':''}${p.toLocaleString('en-BD')} GP</b><small>${esc(x.type||'Reward activity')} · ${esc(x.reference||'')}</small><small>${new Date(x.created_at).toLocaleDateString('en-BD')}</small></div></div>`}).join('');const money=v=>'৳'+Number(v||0).toLocaleString('en-BD',{minimumFractionDigits:0,maximumFractionDigits:2});const detail=(label,value)=>`<div class="gz-order-detail"><small>${esc(label)}</small><b>${esc(value??'—')}</b></div>`;const orderHtml=orderRows.length?orderRows.map(o=>{const items=Array.isArray(o.items)&&o.items.length?o.items.map(i=>`<div class="gz-order-item-full">${i.image_url?`<img src="${esc(i.image_url)}" alt="">`:'<div></div>'}<div><b>${esc(i.product_name||'Product')}</b><small>Qty ${Number(i.quantity||1)} · ${money(i.unit_price)} each</small></div><strong>${money(i.line_total)}</strong></div>`).join(''):'<div style="padding:10px;color:#777;font-size:10px">No item details available.</div>';return `<div class="gz-order-history-card"><div class="gz-order-history-head"><div><b>${esc(o.order_number||'Order')}</b><small>${new Date(o.created_at).toLocaleString('en-BD')} · Tracking ID: ${esc(o.public_tracking_id||'—')}</small></div><span class="gz-order-history-status">${esc(o.status||'New')}</span></div><div class="gz-order-history-items">${Array.isArray(o.items)&&o.items.length?o.items.map(i=>`${esc(i.product_name||'Product')} × ${Number(i.quantity||1)}`).join(' · '):'Order details unavailable'}</div><div class="gz-order-details">${detail('Customer Name',o.customer_name)}${detail('Email',o.email)}${detail('Phone',o.phone)}${detail('Division',o.division)}${detail('District',o.district)}${detail('Upazila / Thana',o.upazila)}${detail('Delivery Address',o.address)}${detail('Payment Method',o.payment_method)}${detail('Tracking Number',o.tracking_number)}${detail('Tracking Provider',o.tracking_provider)}${detail('Referral Code',o.referral_code)}${detail('Referral Admin',o.referral_admin_name)}${detail('Reward Voucher',o.rewards_voucher_code)}${detail('Subtotal',money(o.subtotal))}${detail('Delivery Charge',money(o.shipping_charge))}${detail('Referral Discount',money(o.referral_discount))}${detail('GrabPoints Discount',money(o.rewards_voucher_discount??o.grabpoints_discount))}${detail('Mystery Discount',money(o.mystery_discount))}${detail('Total',money(o.total))}</div><div class="gz-order-items-full">${items}</div>${o.tracking_url?`<a href="${esc(o.tracking_url)}" target="_blank" rel="noopener" style="display:inline-block;margin-top:9px;color:#4c32c5;font-size:10px;font-weight:900">Open tracking link →</a>`:''}${o.admin_note?`<div class="gz-order-admin-note"><b>Order Note</b><br>${esc(o.admin_note)}</div>`:''}</div>`}).join(''):'<div style="padding:12px;color:#777;font-size:11px">No previous orders are linked to this Rewards phone number yet.</div>';const benefits=benefitList.length?benefitList.map(x=>`<li>${esc(x)}</li>`).join(''):'<li>Current GrabPoints membership benefits</li>';b.innerHTML=`<div class="gz-rewards-dashboard"><div class="gz-dash-hero"><div class="gz-dash-eyebrow">GRABZONE REWARDS</div><h2>Welcome, ${esc(d.name)} 👋</h2><div class="gz-tier-pill"><span class="gz-tier-dot"></span>${esc(d.tier)} MEMBER</div><p style="margin-top:12px">Your Rewards account is active. Your GP balance, membership progress and reward activity are all in one place.</p></div><div class="gz-dash-layout"><div class="gz-dash-main"><div class="gz-stat-grid"><div class="gz-stat gp"><small>Available GP</small><b>${Number(d.points).toLocaleString('en-BD')}</b><span>≈ ৳${Number(d.value).toLocaleString('en-BD')} reward value</span></div><div class="gz-stat earned"><small>Lifetime GP</small><b>${earned.toLocaleString('en-BD')}</b><span>Determines your membership tier</span></div><div class="gz-stat tier"><small>CURRENT TIER</small><b>${esc(d.tier)}</b><span>Keep shopping to reach the next tier</span></div></div><div class="gz-dash-card"><div class="gz-next-head"><strong>${ti.next?'Next tier: '+esc(ti.next.label)+' 👑':'Highest tier reached ✓'}</strong><small>${ti.next?Number(d.next_tier_remaining||Math.max(0,next-earned)).toLocaleString('en-BD')+' GP':'MAX TIER'}</small></div><div class="gz-progress"><i style="width:${progress.toFixed(1)}%"></i></div><div class="gz-progress-meta"><span>${earned.toLocaleString('en-BD')} GP earned</span><span>${ti.next?next.toLocaleString('en-BD')+' GP needed':'Top tier reached'}</span></div></div><div class="gz-benefit-box"><b>Your current tier benefits</b><ul>${benefits}<li><b>${ti.current.cashback}% GrabPoints cashback</b> on eligible product purchases</li><li>Secure Rewards PIN redemption</li><li>View balance and full Rewards history</li></ul></div><div class="gz-dash-card"><div class="gz-next-head"><strong>📦 My Previous Orders</strong><small>${orderRows.length} order${orderRows.length===1?'':'s'} linked to your Rewards phone</small></div><button type="button" class="gz-orders-toggle" id="grOrdersToggle">View Previous Orders / আগের Order দেখুন</button><div id="grOrdersPanel" style="display:none"><div class="gz-orders-history">${orderHtml}</div><div class="gz-orders-footer"><button type="button" class="gz-orders-toggle" id="grOrdersHide">Hide Orders / Order লুকান</button></div></div></div><div class="gz-quick"><a href="index.html">🎁 <div>Earn GP<span>Shop & earn GP</span></div>→</a><a href="#gzRedeemArea" onclick="document.getElementById('grRedeemPoints').focus()">🎟️ <div>Redeem Rewards<span>Use GP for rewards</span></div>→</a><a href="track-order.html">📦 <div>Track Order<span>Track your orders</span></div>→</a></div><div id="gzRedeemArea" class="gz-dash-card"><div class="gz-next-head"><strong>🎁 Redeem your GrabPoints</strong><small>Secure PIN required</small></div><div class="gz-rewards-grid"><input id="grRedeemPoints" type="number" min="10" step="10" placeholder="Points to redeem / কত GP redeem করবেন"><input id="grRedeemPin" type="password" inputmode="numeric" maxlength="6" placeholder="Rewards PIN / আপনার PIN"><button class="gz-rewards-btn" id="grRedeem">Redeem GP & Get Reward Voucher</button></div><div id="grRedeemMsg" class="gz-rewards-msg"></div><div id="grVoucherBox"></div></div><div class="gz-rewards-actions"><button class="gz-rewards-btn alt" id="grHistory">Full History / সম্পূর্ণ History</button><button class="gz-rewards-btn alt" id="grLogout">Logout</button></div><div id="grHistoryBox"></div></div><aside class="gz-history-side"><a class="viewall" href="#grHistoryBox" onclick="document.getElementById('grHistory').click()">View all →</a><h3>Recent Transactions</h3><div class="gz-recent">${recent||'<div style="color:#777;font-size:11px;margin-top:18px">No recent transactions yet.</div>'}</div><a class="gz-view-history" href="#grHistoryBox" onclick="document.getElementById('grHistory').click()">View full history →</a></aside></div></div>`;$('grHistory').onclick=history;$('grRedeem').onclick=redeem;$('grLogout').onclick=()=>{setToken('');showAuth('login')};$('grOrdersToggle').onclick=()=>{$('grOrdersPanel').style.display='block';$('grOrdersToggle').style.display='none';$('grOrdersPanel').scrollIntoView({behavior:'smooth',block:'nearest'})};$('grOrdersHide').onclick=()=>{$('grOrdersPanel').style.display='none';$('grOrdersToggle').style.display='block';$('grOrdersToggle').scrollIntoView({behavior:'smooth',block:'nearest'})}}catch(e){console.error('GrabZone Rewards:',e);if(b)b.innerHTML=`<div style="padding:28px;border:1px solid #f0d6d6;border-radius:16px;background:#fff7f7;color:#8b1e1e;font-size:13px"><b>GrabPoints could not load.</b><div style="margin-top:6px">${esc(e.message||'Please refresh and try again.')}</div><button class="gz-rewards-btn" style="margin-top:12px" onclick="window.GrabZoneRewards&&window.GrabZoneRewards.render&&window.GrabZoneRewards.render()">Retry</button></div>`}}
'''
          s = s[:start] + new_fn + s[end:]
          r.write_text(s, encoding='utf-8')

          w = Path('worker.mjs')
          ws = w.read_text(encoding='utf-8')
          old = '''if(fn==="rewards_order_history"){const m=await verifyRewardToken(a.p_token,env);if(!m)throw new Error("Rewards session expired.");const rows=(await q(env,"SELECT id,order_number,public_tracking_id,subtotal,shipping_charge,total,status,created_at,updated_at,referral_discount,rewards_voucher_discount,mystery_discount FROM orders WHERE phone=? ORDER BY created_at DESC LIMIT 100",[m.phone])).results||[];for(const o of rows)o.items=(await q(env,"SELECT product_name,quantity,unit_price,line_total,image_url FROM order_items WHERE order_id=? ORDER BY id",[o.id])).results||[];return{data:rows}}'''
          new = '''if(fn==="rewards_order_history"){const m=await verifyRewardToken(a.p_token,env);if(!m)throw new Error("Rewards session expired.");const rows=(await q(env,"SELECT id,order_number,customer_name,email,phone,division,district,upazila,address,referral_code,referral_discount,discount_amount,referral_admin_name,payment_method,shipping_charge,subtotal,total,status,admin_note,tracking_number,tracking_url,tracking_provider,public_tracking_id,grabpoints_redeemed,grabpoints_discount,rewards_voucher_code,rewards_voucher_discount,mystery_discount,created_at,updated_at FROM orders WHERE phone=? ORDER BY created_at DESC LIMIT 100",[m.phone])).results||[];for(const o of rows)o.items=(await q(env,"SELECT product_name,quantity,unit_price,line_total,image_url FROM order_items WHERE order_id=? ORDER BY id",[o.id])).results||[];return{data:rows}}'''
          if old in ws:
              ws = ws.replace(old, new, 1)
          elif 'SELECT id,order_number,customer_name,email,phone,division,district,upazila,address' not in ws:
              raise SystemExit('rewards_order_history backend pattern not found')
          w.write_text(ws, encoding='utf-8')
          PY

          node --check rewards.js
          node --check worker.mjs

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rewards.js worker.mjs
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Improve Rewards tier visibility and previous order details'
            git push
          fi
