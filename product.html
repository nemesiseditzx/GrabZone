<title>Product — GRABZONE</title>

<link rel="stylesheet" href="styles.css">

<style>
.gallery{
  display:grid;
  grid-template-columns:82px 1fr;
  gap:14px
}

.gallery-main{
  aspect-ratio:1;
  overflow:hidden;
  border-radius:18px;
  background:#f4f4f1
}

.gallery-main img{
  width:100%;
  height:100%;
  object-fit:contain
}

.gallery-thumbs{
  display:flex;
  flex-direction:column;
  gap:8px
}

.gallery-thumb{
  width:82px;
  height:82px;
  border:1px solid #ddd;
  border-radius:10px;
  overflow:hidden;
  background:#fff;
  cursor:pointer;
  padding:0
}

.gallery-thumb.active{
  border:2px solid #111
}

.gallery-thumb img{
  width:100%;
  height:100%;
  object-fit:cover
}

@media(max-width:700px){
  .gallery{
    grid-template-columns:1fr
  }

  .gallery-thumbs{
    order:2;
    flex-direction:row;
    overflow-x:auto
  }

  .gallery-thumb{
    flex:0 0 68px;
    width:68px;
    height:68px
  }
}
</style>
</head>

<body>

<div class="notice-wrap">
  <div class="notice-label">NOTICE</div>
  <div id="noticeTrack" class="notice-track">Loading offers...</div>
</div>

<header class="header">
  <a class="brand" href="index.html">
    <span id="brandMark" class="brand-mark">G</span>
    <span id="storeName">GRABZONE</span>
  </a>

  <nav>
    <a id="nav1" href="index.html#shop">Shop</a>
    <a id="nav2" href="index.html#offers">Offers</a>
  </nav>

  <a id="headerDm" class="btn btn-dark" target="_blank">DM to Order</a>
</header>

<main>
  <div id="productDetail" class="detail">
    <p>Loading product...</p>
  </div>
</main>

<footer>
  <div class="brand">
    <span id="footerMark" class="brand-mark">G</span>
    <span id="footerName">GRABZONE</span>
  </div>

  <span>© <span id="year"></span> GRABZONE</span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="store.js"></script>

</body>
</html>
