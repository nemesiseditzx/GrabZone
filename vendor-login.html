<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GrabZone Vendor Login</title><link rel="stylesheet" href="/vendor.css"></head><body><main class="gz-login"><section class="gz-login-card"><div class="gz-logo" style="color:#111">Grab<span>Zone</span></div><h1 style="margin-top:22px">Vendor Portal</h1><p>Sign in to manage your products, orders, inventory, store and shipments.</p><div id="err" class="gz-error"></div><form id="form" class="gz-form"><div class="gz-field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="gz-field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="gz-btn primary" type="submit">Sign in →</button></form><p style="font-size:12px;margin-top:20px">Vendor accounts are created by GrabZone Main Admin.</p></section></main><script>const f=document.querySelector('#form'),e=document.querySelector('#err');f.addEventListener('submit',async x=>{x.preventDefault();e.classList.remove('show');try{const r=await fetch('/api/vendor-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:email.value,password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Login failed.');location.href='/vendor-dashboard.html'}catch(a){e.textContent=a.message;e.classList.add('show')}});</script></body></html>
