<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor Sales — GrabZone</title><link rel="stylesheet" href="/vendor.css"><script src="/d1-client.js"></script><script src="/marketplace-auth.js"></script></head><body><header class="gz-top"><div class="gz-logo">Grab<span>Zone</span> <small style="font-size:10px;color:#aaa;letter-spacing:1px">VENDOR SALES</small></div><a class="gz-btn light" href="/vendor-admin.html">← Marketplace Admin</a></header><main class="gz-main"><div class="gz-head"><div><h1>Vendor Sales</h1><p>Marketplace sales, commission and net vendor earnings.</p></div><button class="gz-btn light" onclick="load()">Refresh</button></div><div class="gz-grid"><div class="gz-card gz-stat"><div class="label">Marketplace Sales</div><div id="sales" class="num">—</div></div><div class="gz-card gz-stat"><div class="label">Orders</div><div id="orders" class="num">—</div></div><div class="gz-card gz-stat"><div class="label">Commission</div><div id="commission" class="num">—</div></div><div class="gz-card gz-stat"><div class="label">Vendor Earnings</div><div id="earnings" class="num">—</div></div></div><div class="gz-card" style="margin-top:16px;overflow:auto"><table class="gz-table"><thead><tr><th>Vendor</th><th>Status</th><th>Orders</th><th>Sales</th><th>Commission</th><th>Net Earnings</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const $=s=>document.querySelector(s),money=n=>'৳'+Number(n||0).toLocaleString('en-BD',{maximumFractionDigits:2});async function api(p){const r=await fetch(p,{credentials:'include',cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){const d=await api('/api/vendor/admin/overview');$('#sales').textContent=money(d.totals.sales);$('#orders').textContent=d.totals.orders;$('#commission').textContent=money(d.totals.commission);$('#earnings').textContent=money(d.totals.earnings);$('#rows').innerHTML=(d.vendors||[]).map(v=>`<tr><td><b>${v.brand_name}</b></td><td>${v.status}</td><td>${v.orders||0}</td><td>${money(v.sales)}</td><td>${money(v.commission)}</td><td>${money(v.earnings)}</td></tr>`).join('')||'<tr><td colspan="6">No vendor data.</td></tr>'}load().catch(e=>{alert(e.message);location.href='/admin.html'})</script></body></html>
