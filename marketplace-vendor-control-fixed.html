<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor Control — GrabZone</title><link rel="stylesheet" href="/vendor.css"><style>.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tab{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:#f1f1ee}.tab.active{background:#ff6b00;color:#fff}.panel{display:none}.panel.active{display:block}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.subtle{font-size:12px;color:#777}.msg{padding:10px;border-radius:10px;margin-top:10px;font-weight:800}.ok{background:#effff4;color:#176b35}.err{background:#fff1f1;color:#a11}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid2{grid-template-columns:1fr}}.error{white-space:pre-wrap;font:12px monospace;padding:12px;background:#fff7f7;border:1px solid #e8b8b8;border-radius:10px}</style></head><body><header class="gz-top"><div class="gz-logo">Grab<span>Zone</span> <small style="font-size:10px;color:#aaa">VENDOR CONTROL</small></div><a class="gz-btn light" href="/vendor-admin.html">← Marketplace Admin</a></header><main class="gz-main"><div id="app"><div class="gz-card">Loading vendor…</div></div></main><script>
(function(){
var app=document.getElementById('app');
var key=new URLSearchParams(window.location.search).get('vendor');
var S={vendor:null,products:[],orders:[],categories:[],sections:[]};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(v){return '৳'+Number(v||0).toLocaleString('en-BD',{maximumFractionDigits:2})}
async function api(url,opt){opt=opt||{};opt.credentials='include';opt.cache='no-store';opt.headers=Object.assign({'Content-Type':'application/json'},opt.headers||{});var r=await fetch(url,opt);var d=await r.json().catch(function(){return {}});if(!r.ok)throw new Error(d.error||('Request failed ('+r.status+')'));return d}
function errorPage(e){app.innerHTML='<div class="gz-card"><h2>Could not load vendor</h2><div class="error">'+esc(e.message||e)+'</div><div class="actions"><button class="gz-btn primary" id="retry">Retry</button><a class="gz-btn light" href="/vendor-admin.html">Back</a></div></div>';document.getElementById('retry').onclick=load}
async function load(){try{var a=await api('/api/admin-auth');if(!a.authenticated){window.location.href='/admin.html';return}if(!key)throw new Error('Missing vendor ID. Please open this page from Marketplace Admin.');var d=await api('/api/vendor/admin/vendor-data?vendor_id='+encodeURIComponent(key));S.vendor=d.vendor;S.products=d.products||[];S.orders=d.orders||[];var c=await api('/api/vendor/admin/categories').catch(function(){return {categories:[]}});S.categories=c.categories||[];render()}catch(e){errorPage(e)}}
function render(){var v=S.vendor;var cats=S.categories.map(function(c){return '<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>'}).join('');var products=S.products.map(function(p){return '<tr><td><b>'+esc(p.name)+'</b><div class="subtle">'+esc(p.category_name||'')+'</div></td><td>'+esc(p.sku||'—')+'</td><td>'+money(p.price)+'</td><td><input class="stk" data-id="'+esc(p.id)+'" type="number" min="0" value="'+Number(p.stock||0)+'" style="width:80px"></td><td><input class="pub" data-id="'+esc(p.id)+'" type="checkbox" '+(p.published?'checked':'')+'></td><td><button class="gz-btn light edit" data-id="'+esc(p.id)+'">Edit</button></td></tr>'}).join('');var orders=S.orders.map(function(o){var statuses=['Processing','Picked Up','In Transit','Out for Delivery','Delivered','Failed','Returned','Cancelled'];var opts=statuses.map(function(x){return '<option value="'+x+'" '+(o.status===x?'selected':'')+'>'+x+'</option>'}).join('');var ships=(o.shipments||[]).map(function(s){return esc(s.courier||'Courier')+' · '+esc(s.tracking_id||'Pending')+' · '+esc(s.status||'Pending')}).join('<br>')||'None';return '<tr><td><b>'+esc(o.order_number||o.id)+'</b><div class="subtle">'+esc(o.public_tracking_id||'')+'</div></td><td>'+esc(o.customer_name||'')+'<div class="subtle">'+esc(o.phone||'')+'</div></td><td>'+Number((o.items||[]).length)+'</td><td>'+money(o.subtotal)+'</td><td><select class="status" data-id="'+esc(o.id)+'">'+opts+'</select></td><td>'+ships+'</td></tr>'}).join('');app.innerHTML='<div class="gz-head"><div><h1>'+esc(v.brand_name||v.business_name||v.slug)+'</h1><p>Super Admin control center · '+esc(v.slug||'')+'</p></div><div class="actions"><a class="gz-btn light" target="_blank" href="/brand.html?slug='+encodeURIComponent(v.slug||'')+'">View Store</a><button class="gz-btn light" id="refresh">Refresh</button></div></div><div class="tabs"><button class="tab active" data-tab="profile">Profile</button><button class="tab" data-tab="products">Products</button><button class="tab" data-tab="orders">Orders</button><button class="tab" data-tab="store">Store</button><button class="tab" data-tab="security">Security</button></div><section id="profile" class="panel active"><div class="gz-card"><h2>Vendor Profile & Settings</h2><form id="profileForm" class="gz-form"><div class="grid2"><div class="gz-field"><label>Business Name</label><input id="bn" value="'+esc(v.business_name||'')+'"></div><div class="gz-field"><label>Brand Name</label><input id="br" value="'+esc(v.brand_name||'')+'"></div><div class="gz-field"><label>Business Email</label><input id="be" type="email" value="'+esc(v.business_email||v.email||'')+'"></div><div class="gz-field"><label>Phone</label><input id="ph" value="'+esc(v.phone||'')+'"></div><div class="gz-field"><label>Order Notification Email</label><input id="oe" type="email" value="'+esc(v.order_notification_email||v.email||'')+'"></div><div class="gz-field"><label>Support Email</label><input id="se" type="email" value="'+esc(v.support_email||v.email||'')+'"></div><div class="gz-field"><label>Status</label><select id="vs"><option value="Active" '+(v.status==='Active'?'selected':'')+'>Active</option><option value="Pending" '+(v.status==='Pending'?'selected':'')+'>Pending</option><option value="Suspended" '+(v.status==='Suspended'?'selected':'')+'>Suspended</option></select></div><div class="gz-field"><label>Shipping Fee</label><input id="sf" type="number" min="0" value="'+Number(v.shipping_fee||0)+'"></div><div class="gz-field"><label>Commission Type</label><select id="ct"><option value="percentage" '+(v.commission_type==='percentage'?'selected':'')+'>Percentage</option><option value="fixed" '+(v.commission_type==='fixed'?'selected':'')+'>Fixed</option></select></div><div class="gz-field"><label>Commission Value</label><input id="cv" type="number" min="0" value="'+Number(v.commission_value||0)+'"></div><div class="gz-field"><label>Logo URL</label><input id="lu" value="'+esc(v.logo_url||'')+'"></div><div class="gz-field"><label>Banner URL</label><input id="bu" value="'+esc(v.banner_url||'')+'"></div></div><div class="gz-field"><label>Description</label><textarea id="desc" rows="4">'+esc(v.description||'')+'</textarea></div><div class="actions"><label><input id="hv" type="checkbox" '+(v.homepage_visible?'checked':'')+'> Show in Shop by Brands</label><label><input id="fv" type="checkbox" '+(v.featured?'checked':'')+'> Featured Brand</label></div><div id="profileMsg"></div><button class="gz-btn primary">Save Vendor</button></form></div></section><section id="products" class="panel"><div class="gz-card"><h2>Add Product</h2><form id="productForm" class="gz-form"><div class="grid2"><div class="gz-field"><label>Product Name *</label><input id="pn" required></div><div class="gz-field"><label>SKU</label><input id="psku"></div><div class="gz-field"><label>Price *</label><input id="pp" type="number" min="0" step="0.01" required></div><div class="gz-field"><label>Stock</label><input id="pst" type="number" min="0" value="0"></div><div class="gz-field"><label>Category</label><select id="pc"><option value="">No category</option>'+cats+'</select></div><div class="gz-field"><label>Image URL</label><input id="pi"></div></div><div class="gz-field"><label>Description</label><textarea id="pd" rows="4"></textarea></div><label><input id="pub" type="checkbox" checked> Published</label><div id="productMsg"></div><button class="gz-btn primary">Add Product</button></form></div><div class="gz-card" style="margin-top:16px;overflow:auto"><h2>Products</h2><table class="gz-table"><thead><tr><th>Product</th><th>SKU</th><th>Price</th><th>Stock</th><th>Published</th><th></th></tr></thead><tbody>'+products+'</tbody></table><div class="actions"><button class="gz-btn primary" id="saveInventory">Save Inventory</button></div></div></section><section id="orders" class="panel"><div class="gz-card" style="overflow:auto"><h2>Vendor Orders</h2><table class="gz-table"><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Subtotal</th><th>Status</th><th>Shipments</th></tr></thead><tbody>'+orders+'</tbody></table></div></section><section id="store" class="panel"><div class="gz-card"><h2>Store Sections</h2><div id="sectionsList">Loading…</div><form id="sectionForm" class="gz-form"><div class="grid2"><div class="gz-field"><label>Type</label><input id="stype" value="custom"></div><div class="gz-field"><label>Title</label><input id="stitle"></div></div><div class="gz-field"><label>Content</label><textarea id="sbody" rows="4"></textarea></div><button class="gz-btn primary">Add Section</button></form></div></section><section id="security" class="panel"><div class="gz-card"><h2>Vendor Login Security</h2><p class="subtle">Reset this vendor's login password.</p><form id="resetForm" class="gz-form"><div class="gz-field"><label>New Password</label><input id="newpass" type="password" minlength="8" required></div><button class="gz-btn primary">Reset Password</button></form><div id="securityMsg"></div></div></section>';
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});document.querySelectorAll('.panel').forEach(function(x){x.classList.remove('active')});b.classList.add('active');document.getElementById(b.getAttribute('data-tab')).classList.add('active');if(b.getAttribute('data-tab')==='store')loadSections()}});document.getElementById('refresh').onclick=load;document.getElementById('profileForm').onsubmit=saveProfile;document.getElementById('productForm').onsubmit=addProduct;document.getElementById('saveInventory').onclick=saveInventory;document.getElementById('resetForm').onsubmit=resetPassword;document.querySelectorAll('.edit').forEach(function(b){b.onclick=function(){editProduct(b.getAttribute('data-id'))}});document.querySelectorAll('.status').forEach(function(s){s.onchange=function(){saveStatus(s.getAttribute('data-id'),s.value)}});document.getElementById('sectionForm').onsubmit=addSection;loadSections()}
async function saveProfile(e){e.preventDefault();var m=document.getElementById('profileMsg');try{await api('/api/vendor/admin/vendors/'+encodeURIComponent(S.vendor.id),{method:'PATCH',body:JSON.stringify({business_name:document.getElementById('bn').value.trim(),brand_name:document.getElementById('br').value.trim(),email:document.getElementById('be').value.trim(),business_email:document.getElementById('be').value.trim(),phone:document.getElementById('ph').value.trim(),order_notification_email:document.getElementById('oe').value.trim(),support_email:document.getElementById('se').value.trim(),status:document.getElementById('vs').value,shipping_fee:Number(document.getElementById('sf').value||0),commission_type:document.getElementById('ct').value,commission_value:Number(document.getElementById('cv').value||0),logo_url:document.getElementById('lu').value.trim(),banner_url:document.getElementById('bu').value.trim(),description:document.getElementById('desc').value,homepage_visible:document.getElementById('hv').checked,featured:document.getElementById('fv').checked})});m.className='msg ok';m.textContent='Saved ✓';await load()}catch(x){m.className='msg err';m.textContent=x.message}}
async function addProduct(e){e.preventDefault();var m=document.getElementById('productMsg');try{await api('/api/vendor/admin/products',{method:'POST',body:JSON.stringify({vendor_id:S.vendor.id,name:document.getElementById('pn').value.trim(),sku:document.getElementById('psku').value.trim(),price:Number(document.getElementById('pp').value),stock:Number(document.getElementById('pst').value||0),category_id:document.getElementById('pc').value||null,image_url:document.getElementById('pi').value.trim(),description:document.getElementById('pd').value,published:document.getElementById('pub').checked})});m.className='msg ok';m.textContent='Product added ✓';document.getElementById('productForm').reset();document.getElementById('pub').checked=true;await load()}catch(x){m.className='msg err';m.textContent=x.message}}
async function saveInventory(){try{var ps=S.products;for(var i=0;i<ps.length;i++){var id=String(ps[i].id);var s=document.querySelector('.stk[data-id="'+id+'"]');var p=document.querySelector('.pub[data-id="'+id+'"]');if(s&&p)await api('/api/vendor/admin/products',{method:'PATCH',body:JSON.stringify({id:ps[i].id,stock:Number(s.value||0),published:p.checked})})}alert('Inventory saved.');await load()}catch(e){alert(e.message)}}
async function editProduct(id){var p=S.products.find(function(x){return String(x.id)===String(id)});if(!p)return;var n=prompt('Product name',p.name);if(n===null)return;var price=prompt('Price',p.price);if(price===null)return;var stock=prompt('Stock',p.stock);if(stock===null)return;try{await api('/api/vendor/admin/products',{method:'PATCH',body:JSON.stringify({id:p.id,name:n,price:Number(price),stock:Number(stock)})});await load()}catch(e){alert(e.message)}}
async function saveStatus(id,status){try{await api('/api/vendor/admin/order-status',{method:'PATCH',body:JSON.stringify({vendor_order_id:id,status:status})});await load()}catch(e){alert(e.message)}}
async function loadSections(){if(!S.vendor)return;var box=document.getElementById('sectionsList');if(!box)return;try{var d=await api('/api/vendor/admin/store-sections?vendor_id='+encodeURIComponent(S.vendor.id));S.sections=d.sections||[];box.innerHTML=S.sections.map(function(s){return '<div class="gz-card" style="margin:10px 0"><b>'+esc(s.title||s.section_type)+'</b><div class="subtle">'+esc(s.section_type||'custom')+' · '+(s.enabled?'Enabled':'Disabled')+'</div><p>'+esc(s.body||'')+'</p><button class="gz-btn light secEdit" data-id="'+esc(s.id)+'">Edit</button> <button class="gz-btn light secDelete" data-id="'+esc(s.id)+'">Delete</button></div>'}).join('')||'<p class="subtle">No custom store sections.</p>';document.querySelectorAll('.secEdit').forEach(function(b){b.onclick=function(){editSection(b.getAttribute('data-id'))}});document.querySelectorAll('.secDelete').forEach(function(b){b.onclick=function(){deleteSection(b.getAttribute('data-id'))}})}catch(e){box.textContent=e.message}}
async function addSection(e){e.preventDefault();try{await api('/api/vendor/admin/store-sections?vendor_id='+encodeURIComponent(S.vendor.id),{method:'POST',body:JSON.stringify({section_type:document.getElementById('stype').value,title:document.getElementById('stitle').value,body:document.getElementById('sbody').value,sort_order:0,enabled:true})});document.getElementById('sectionForm').reset();await loadSections()}catch(x){alert(x.message)}}
async function editSection(id){var s=S.sections.find(function(x){return String(x.id)===String(id)});if(!s)return;var title=prompt('Title',s.title||'');if(title===null)return;var body=prompt('Content',s.body||'');if(body===null)return;try{await api('/api/vendor/admin/store-sections?vendor_id='+encodeURIComponent(S.vendor.id),{method:'PATCH',body:JSON.stringify({id:s.id,title:title,body:body,section_type:s.section_type||'custom',sort_order:Number(s.sort_order||0),enabled:!!s.enabled,data_json:{}})});await loadSections()}catch(e){alert(e.message)}}
async function deleteSection(id){if(!confirm('Delete this store section?'))return;try{await api('/api/vendor/admin/store-sections?vendor_id='+encodeURIComponent(S.vendor.id),{method:'DELETE',body:JSON.stringify({id:id})});await loadSections()}catch(e){alert(e.message)}}
async function resetPassword(e){e.preventDefault();var m=document.getElementById('securityMsg');try{await api('/api/vendor/admin/reset-password',{method:'POST',body:JSON.stringify({vendor_id:S.vendor.id,password:document.getElementById('newpass').value})});m.className='msg ok';m.textContent='Password reset successfully ✓';document.getElementById('resetForm').reset()}catch(x){m.className='msg err';m.textContent=x.message}}
load();
})();
</script></body></html>
