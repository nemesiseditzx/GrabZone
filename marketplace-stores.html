<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor Stores — GrabZone</title><link rel="stylesheet" href="/vendor.css"></head><body><header class="gz-top"><div class="gz-logo">Grab<span>Zone</span> <small style="font-size:10px;color:#aaa;letter-spacing:1px">VENDOR STORES</small></div><a class="gz-btn light" href="/vendor-admin.html">← Marketplace Admin</a></header><main class="gz-main"><div class="gz-head"><div><h1>Vendor Stores</h1><p>Control visibility and open each dynamic storefront.</p></div></div><div class="gz-card" style="overflow:auto"><table class="gz-table"><thead><tr><th>Brand</th><th>Visible</th><th>Featured</th><th>Store</th><th>Manage</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const $=s=>document.querySelector(s);async function api(p,o={}){const r=await fetch(p,{credentials:'include',...o,headers:{'Content-Type':'application/json',...(o.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){const d=await api('/api/vendor/admin/vendors');$('#rows').innerHTML=(d.vendors||[]).map(v=>`<tr><td><b>${v.brand_name}</b><div style="font-size:11px;color:#777">${v.business_name}</div></td><td><input id="vis_${v.id}" type="checkbox" ${v.homepage_visible?'checked':''}></td><td><input id="feat_${v.id}" type="checkbox" ${v.featured?'checked':''}></td><td><a class="gz-btn light" href="/brand.html?slug=${encodeURIComponent(v.slug)}" target="_blank">View</a></td><td><button class="gz-btn light" onclick="save('${v.id}')">Save</button> <a class="gz-btn light" href="/marketplace-vendor-control.html?vendor=${encodeURIComponent(v.id)}">Manage</a></td></tr>`).join('')||'<tr><td colspan="5">No vendors.</td></tr>'}async function save(id){try{await api('/api/vendor/admin/vendors/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({homepage_visible:document.getElementById('vis_'+id).checked,featured:document.getElementById('feat_'+id).checked})});alert('Store visibility saved.')}catch(e){alert(e.message)}}load().catch(e=>{alert(e.message);location.href='/admin.html'})</script></body></html>
