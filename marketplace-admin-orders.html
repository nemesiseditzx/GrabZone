<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketplace Orders — GrabZone Admin</title><link rel="stylesheet" href="/vendor.css"><style>
body{background:#f6f6f2;color:#111}.wrap{max-width:1180px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.kicker{font-size:10px;font-weight:900;letter-spacing:.16em;color:#777}.top h1{margin:4px 0}.card{background:#fff;border:1px solid #e5e5df;border-radius:20px;padding:20px;margin-top:16px}.search{display:flex;gap:9px}.search input{flex:1;border:1px solid #ddd;border-radius:12px;padding:13px;font:inherit}.search button,.btn{border:1px solid #ddd;border-radius:11px;padding:11px 14px;background:#fff;font-weight:850;cursor:pointer}.primary{background:#111!important;color:#fff!important;border-color:#111!important}.muted{color:#777;font-size:12px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.pill{display:inline-block;border-radius:999px;background:#eee;padding:6px 10px;font-size:10px;font-weight:900}.vendor{border:1px solid #e5e5df;border-radius:16px;padding:16px;margin-top:14px}.vendor-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.item{border-top:1px solid #eee;padding:14px 0;display:grid;grid-template-columns:72px 1fr auto;gap:13px;align-items:start}.item img{width:72px;height:72px;object-fit:cover;border-radius:11px;background:#f3f3f0}.item-title{font-weight:900}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}.chip{padding:5px 8px;border-radius:999px;background:#f2f2ef;font-size:11px;font-weight:750}.details{margin-top:8px;color:#555;font-size:12px;line-height:1.5}.ship{margin-top:12px;padding:14px;background:#f8f8f5;border-radius:13px}.ship-row{display:flex;justify-content:space-between;gap:10px;align-items:center}.form{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.form input,.form select{border:1px solid #ddd;border-radius:9px;padding:10px;font:inherit}.full{grid-column:1/-1}@media(max-width:700px){.search,.form{display:grid;grid-template-columns:1fr}.item{grid-template-columns:55px 1fr}.item img{width:55px;height:55px}.item>b{grid-column:2}}
</style></head><body><div class="wrap"><div class="top"><div><div class="kicker">GRABZONE MARKETPLACE</div><h1>Order Control Center</h1><div class="muted">Admin and vendor order data use the same order, status and shipment records.</div></div><a class="btn" href="/vendor-admin.html">Back</a></div><div class="card"><form id="form" class="search"><input id="id" placeholder="Order number, GZ tracking ID or order ID" required><button class="primary">Search Order</button></form></div><div id="result"></div></div><script>
const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=n=>'৳'+Number(n||0).toLocaleString('en-BD',{maximumFractionDigits:2});const safeTrackingUrl=v=>/^https?:\/\//i.test(String(v||''))?String(v):'';
const statuses=['New','Contacting','Confirmed','Processing','Shipped','Delivered','Cancelled'];
const api=async(path,opt={})=>{const r=await fetch(path,{credentials:'include',cache:'no-store',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d};
let current=null;
async function load(id){$('result').innerHTML='<div class="card">Loading order…</div>';try{const d=await api('/api/vendor/admin/order-data?order_id='+encodeURIComponent(id));current=d.order;render(d)}catch(e){$('result').innerHTML='<div class="card" style="color:#a11;font-weight:800">'+esc(e.message)+'</div>'}}
function render(d){const o=d.order, vendors=d.vendors||[];const customer=[o.address,o.upazila,o.district,o.division].filter(Boolean).join(', ')||'—';$('result').innerHTML='<div class="card"><div class="head"><div><div class="muted">ORDER</div><h2 style="margin:4px 0">'+esc(o.order_number||o.id)+'</h2><div class="muted">Public tracking: '+esc(o.public_tracking_id||'—')+'</div></div><div><span class="pill">'+esc(o.status||'Processing')+'</span></div></div><div class="card" style="background:#fafaf7;margin-top:15px"><b>Customer Details</b><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px;font-size:13px"><div><span class="muted">Name</span><br><b>'+esc(o.customer_name||'—')+'</b></div><div><span class="muted">Phone</span><br><b>'+esc(o.phone||'—')+'</b></div><div><span class="muted">Email</span><br><b>'+esc(o.email||'—')+'</b></div><div><span class="muted">Payment</span><br><b>'+esc(o.payment_method||'Cash on Delivery')+'</b></div><div style="grid-column:1/-1"><span class="muted">Delivery Address</span><br><b>'+esc(customer)+'</b></div></div></div>'+vendors.map(vendorHtml).join('')+'</div>'}
function vendorHtml(v){return '<section class="vendor"><div class="vendor-head"><div><h3 style="margin:0">'+esc(v.brand_name||v.vendor_id)+'</h3><div class="muted">Subtotal '+money(v.subtotal)+' · Delivery '+money(v.delivery_charge||v.shipping_fee)+' · Commission '+money(v.commission_amount)+' · Earnings '+money(v.vendor_earnings)+'</div></div><div><select class="status" data-id="'+esc(v.id)+'">'+statuses.map(s=>'<option '+(s===v.status?'selected':'')+'>'+s+'</option>').join('')+'</select></div></div><div style="margin-top:12px"><b>Products</b>'+(v.items||[]).map(itemHtml).join('')+'</div><div class="ship"><div class="ship-row"><b>Shipment & Tracking</b><button class="btn primary addShip" data-id="'+esc(v.id)+'">+ Add Shipment</button></div>'+(v.shipments||[]).map(shipmentHtml).join('')+'</div></section>'}
function itemHtml(i){const p=i.product_details||{};const opts=i.variation_options||{};const chips=Object.entries(opts).map(([k,v])=>'<span class="chip">'+esc(k)+': '+esc(v)+'</span>').join('');return '<div class="item"><div>'+((p.image_url||i.image_url)?'<img src="'+esc(p.image_url||i.image_url)+'" alt="">':'<div style="width:72px;height:72px;border-radius:11px;background:#eee"></div>')+'</div><div><div class="item-title">'+esc(p.name||i.product_name||'Product')+'</div><div class="meta">'+(i.sku?'<span class="chip">SKU: '+esc(i.sku)+'</span>':'<span class="chip">SKU: Not set</span>')+chips+'<span class="chip">Qty: '+Number(i.quantity||1)+'</span></div><div class="details">'+(p.category?'Category: '+esc(p.category)+' · ':'')+(p.description?esc(p.description):'Product details saved with order')+'</div></div><b>'+money(i.line_total||i.order_line_total)+'</b></div>'}
function shipmentHtml(s){return '<div class="ship" style="background:#fff;border:1px solid #e7e7e2"><div class="ship-row"><div><b>'+esc(s.courier||'Courier not set')+'</b><div class="muted">Tracking: '+esc(s.tracking_id||'Not set')+' · '+esc(s.status||'Processing')+'</div>'+(safeTrackingUrl(s.tracking_url)?'<a href="'+esc(s.tracking_url)+'" target="_blank" rel="noopener" class="muted">Open tracking link →</a>':'')+'</div><button class="btn editShip" data-vendor="'+esc(s.vendor_id)+'" data-id="'+esc(s.id)+'" data-courier="'+esc(s.courier||'')+'" data-tracking="'+esc(s.tracking_id||'')+'" data-url="'+esc(s.tracking_url||'')+'" data-status="'+esc(s.status||'Processing')+'">Edit</button></div></div>'}
async function saveStatus(id,status){await api('/api/vendor/admin/order-status',{method:'PATCH',body:JSON.stringify({vendor_order_id:id,status})});await load($('id').value.trim())}
function shipmentForm(vendorOrderId,s){const old=document.getElementById('shipForm');if(old)old.remove();const d=document.createElement('div');d.id='shipForm';d.className='form';d.innerHTML='<input id="shipCourier" placeholder="Courier name" value="'+esc(s?.courier||'')+'"><input id="shipTracking" placeholder="Tracking number" value="'+esc(s?.tracking||'')+'"><input id="shipUrl" placeholder="Tracking URL" value="'+esc(s?.url||'')+'"><select id="shipStatus">'+['New','Contacting','Confirmed','Processing','Shipped','Delivered','Cancelled'].map(x=>'<option '+(x===(s?.status||'Processing')?'selected':'')+'>'+x+'</option>').join('')+'</select><button id="shipSave" class="btn primary">'+(s?'Update':'Create')+' Shipment</button><button id="shipCancel" class="btn">Cancel</button>';document.querySelector('.ship').appendChild(d);$('shipCancel').onclick=()=>d.remove();$('shipSave').onclick=async()=>{try{const b={vendor_order_id:vendorOrderId,courier:$('shipCourier').value,tracking_id:$('shipTracking').value,tracking_url:$('shipUrl').value,status:$('shipStatus').value};if(s)b.shipment_id=s.id;await api('/api/vendor/admin/shipment',{method:s?'PATCH':'POST',body:JSON.stringify(b)});await load($('id').value.trim())}catch(e){alert(e.message)}}}
document.addEventListener('change',e=>{if(e.target.matches('.status'))saveStatus(e.target.dataset.id,e.target.value).catch(x=>alert(x.message))});
document.addEventListener('click',e=>{const a=e.target.closest('.addShip');if(a){shipmentForm(a.dataset.id,null);return}const x=e.target.closest('.editShip');if(x)shipmentForm(x.dataset.vendor,{id:x.dataset.id,courier:x.dataset.courier,tracking:x.dataset.tracking,url:x.dataset.url,status:x.dataset.status})});
$('form').onsubmit=e=>{e.preventDefault();load($('id').value.trim())};const q=new URLSearchParams(location.search).get('order_id');if(q){$('id').value=q;load(q)}
</script></body></html>
