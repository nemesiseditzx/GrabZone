<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketplace Orders — GrabZone Admin</title><link rel="stylesheet" href="/vendor.css"><style>body{background:#f7f7f3}.wrap{max-width:1100px;margin:auto;padding:24px 18px}.card{background:#fff;border:1px solid #e5e5e0;border-radius:20px;padding:20px;margin-top:14px}.search{display:flex;gap:9px}.search input{flex:1;border:1px solid #ddd;border-radius:12px;padding:13px}.search button{border:0;border-radius:12px;padding:13px 17px;font-weight:900;cursor:pointer}.vendor{border:1px solid #e4e4df;border-radius:16px;padding:15px;margin-top:12px}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.pill{border-radius:999px;background:#eee;padding:5px 9px;font-size:11px;font-weight:900}.muted{color:#777;font-size:13px}.item{display:flex;justify-content:space-between;border-top:1px solid #eee;padding:9px 0}.ship{margin-top:10px;padding:10px;background:#f7f7f4;border-radius:11px;font-size:12px}</style></head><body><div class="wrap"><div class="row"><div><div class="muted">GRABZONE MARKETPLACE</div><h1 style="margin:3px 0">Vendor Orders</h1><p class="muted">Inspect the vendor split, products, shipping and tracking for any GrabZone order.</p></div><a class="gz-btn light" href="/vendor-admin.html" style="text-decoration:none">Back</a></div><div class="card"><form id="form" class="search"><input id="id" placeholder="GZ-Order ID or tracking ID" required><button>Search</button></form></div><div id="result"></div></div><script>const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=n=>'৳'+Number(n||0).toLocaleString('en-BD',{maximumFractionDigits:2});async function load(id){$('result').innerHTML='<div class="card">Loading…</div>';try{const r=await fetch('/api/vendor/admin/order-data?order_id='+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load order');const o=d.order;$('result').innerHTML='<div class="card"><div class="muted">'+esc(o.order_number)+' · Tracking '+esc(o.public_tracking_id||'—')+'</div><h2 style="margin:5px 0">'+esc(o.customer_name||'Customer')+'</h2><div class="pill">'+esc(o.status||'Processing')+'</div>'+((d.vendors||[]).map(v=>'<section class="vendor"><div class="row"><div><b>'+esc(v.brand_name)+'</b><div class="muted">Vendor subtotal '+money(v.subtotal)+' · Shipping '+money(v.shipping_fee)+' · Commission '+money(v.commission_amount)+' · Earnings '+money(v.vendor_earnings)+'</div></div><span class="pill">'+esc(v.status)+'</span></div>'+((v.items||[]).map(i=>'<div class="item"><span>'+esc(i.name)+' × '+esc(i.quantity)+(i.sku?' · SKU '+esc(i.sku):'')+'</span><b>'+money(i.line_total)+'</b></div>').join(''))+((v.shipments||[]).map(s=>'<div class="ship"><b>'+esc(s.status)+'</b> · '+esc(s.courier||'Courier pending')+' · '+esc(s.tracking_id||'Tracking pending')+(s.tracking_url?' · <a href="'+esc(s.tracking_url)+'" target="_blank" rel="noopener">Track</a>':'')+'</div>').join(''))+'</section>').join(''))+'</div>'}catch(e){$('result').innerHTML='<div class="card" style="color:#a00;font-weight:800">'+esc(e.message)+'</div>'}}$('form').onsubmit=e=>{e.preventDefault();load($('id').value.trim())};const q=new URLSearchParams(location.search).get('order_id');if(q){$('id').value=q;load(q)}</script></body></html>
