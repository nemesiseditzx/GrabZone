<!doctype html>
<html lang="bn">
<head>
  <head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Payment Methods — GRABZONE</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    .payment-page{width:min(1080px,calc(100% - 32px));margin:auto;padding:54px 0 90px}
    .payment-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:34px}
    .payment-eyebrow{font-size:11px;font-weight:900;letter-spacing:.14em;color:#777;text-transform:uppercase;margin-bottom:12px}
    .payment-hero h1{margin:0 0 12px;font-size:clamp(42px,7vw,72px);line-height:.95;letter-spacing:-.055em}
    .payment-hero p{max-width:700px;margin:0;color:#666;font-size:16px;line-height:1.65}
    .language-switch{display:flex;align-items:center;gap:3px;padding:3px;background:#fff;border:1px solid #dedede;border-radius:999px;flex:0 0 auto}
    .lang-btn{border:0;background:transparent;color:#666;padding:7px 11px;border-radius:999px;font-size:11px;font-weight:800;cursor:pointer}.lang-btn.active{background:#111;color:#fff}
    .payment-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .payment-card{background:#fff;border:1px solid #e5e5e5;border-radius:24px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.04)}
    .payment-icon-wrap{width:62px;height:62px;margin-bottom:18px;border-radius:17px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#f5f5f3}
    .payment-logo{width:100%;height:100%;object-fit:contain;padding:6px}.payment-icon-fallback{font-weight:900;font-size:16px;color:#111}
    .payment-card h2{margin:0 0 9px;font-size:25px;letter-spacing:-.025em}.payment-card p{margin:0;color:#666;line-height:1.65;font-size:14px;white-space:pre-line}
    .payment-note{margin-top:18px;padding:16px 17px;border-radius:15px;background:#f5f5f3;color:#333;font-size:13px;line-height:1.6;white-space:pre-line}
    .payment-empty{grid-column:1/-1;background:#fff;border:1px solid #e5e5e5;border-radius:20px;padding:30px;color:#666}
    .payment-back{display:inline-flex;margin-top:28px;padding:12px 18px;border-radius:999px;background:#111;color:#fff;text-decoration:none;font-size:13px;font-weight:800}
    @media(max-width:700px){.payment-page{padding:38px 0 65px}.payment-top{flex-direction:column}.payment-grid{grid-template-columns:1fr}.payment-card{padding:23px}.language-switch{align-self:flex-start}}
  </style>
</head>
<body>
<main class="payment-page">
  <div class="payment-top">
    <section class="payment-hero">
      <div class="payment-eyebrow" data-i18n="eyebrow">PAYMENT METHODS</div>
      <h1 data-i18n="title">Payment made simple.</h1>
      <p data-i18n="intro">Choose the payment method available for your order. Payment instructions and applicable delivery charges will be confirmed by the GrabZone team.</p>
    </section>
    <div class="language-switch" role="group" aria-label="Language">
      <button id="langBn" class="lang-btn active" type="button" onclick="setLanguage('bn')">বাংলা</button>
      <button id="langEn" class="lang-btn" type="button" onclick="setLanguage('en')">English</button>
    </div>
  </div>
  <section id="paymentMethodsGrid" class="payment-grid">
    <div class="payment-empty" data-i18n="loading">পেমেন্ট মেথড লোড হচ্ছে...</div>
  </section>
  <a class="payment-back" href="index.html" data-i18n="back">← GrabZone-এ ফিরে যান</a>
</main>
<script src="config.js"></script>
<script src="d1-client.js"></script>
<script>
let paymentClient=null, LANG=localStorage.getItem('grabzone_language')||'bn', SITE={};
const FALLBACK={
  bn:{eyebrow:'পেমেন্ট মেথড',title:'পেমেন্ট আরও সহজ।',intro:'আপনার অর্ডারের জন্য উপলভ্য পেমেন্ট মেথড বেছে নিন। পেমেন্ট নির্দেশনা এবং প্রযোজ্য ডেলিভারি চার্জ GrabZone টিম নিশ্চিত করবে।',loading:'পেমেন্ট মেথড লোড হচ্ছে...',unavailable:'এই মুহূর্তে পেমেন্ট তথ্য পাওয়া যাচ্ছে না।',important:'গুরুত্বপূর্ণ',back:'← GrabZone-এ ফিরে যান'},
  en:{eyebrow:'PAYMENT METHODS',title:'Payment made simple.',intro:'Choose the payment method available for your order. Payment instructions and applicable delivery charges will be confirmed by the GrabZone team.',loading:'Loading payment methods…',unavailable:'Payment information is currently unavailable.',important:'Important',back:'← Back to GrabZone'}
};
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function safeUrl(v){try{const u=new URL(String(v));return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
function textFor(method,field){const legacy=method[field];const obj=method[field+'_i18n'];if(obj&&typeof obj==='object')return obj[LANG]??obj.en??obj.bn??legacy??'';return method[field+'_'+LANG]??legacy??''}
function setLanguage(lang){LANG=lang==='en'?'en':'bn';localStorage.setItem('grabzone_language',LANG);document.documentElement.lang=LANG;const d=FALLBACK[LANG];document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.dataset.i18n;if(d[k]!==undefined)el.textContent=d[k]});document.getElementById('langBn').classList.toggle('active',LANG==='bn');document.getElementById('langEn').classList.toggle('active',LANG==='en');renderPaymentMethods(window.__paymentMethods||[])}
async function init(){const C=window.GRABZONE_CONFIG;paymentClient=window.grabzoneD1||null;if(!paymentClient)return;const {data,error}=await paymentClient.from('site_settings').select('store_name,logo_url,payment_methods').eq('id',1).maybeSingle();if(error){console.error(error);document.getElementById('paymentMethodsGrid').innerHTML='<div class="payment-empty">'+esc(FALLBACK[LANG].unavailable)+'</div>';return}SITE=data||{};document.title='Payment Methods — '+(SITE.store_name||'GRABZONE');applyFavicon();window.__paymentMethods=Array.isArray(data?.payment_methods)?data.payment_methods:[];renderPaymentMethods(window.__paymentMethods);setLanguage(LANG)}
function applyFavicon(){const logo=safeUrl(SITE.logo_url);if(!logo)return;let f=document.querySelector('link[data-gz-favicon]');if(!f){f=document.createElement('link');f.rel='icon';f.setAttribute('data-gz-favicon','1');document.head.appendChild(f)}f.href=logo;let a=document.querySelector('link[data-gz-apple]');if(!a){a=document.createElement('link');a.rel='apple-touch-icon';a.setAttribute('data-gz-apple','1');document.head.appendChild(a)}a.href=logo}
function renderPaymentMethods(methods){const grid=document.getElementById('paymentMethodsGrid');if(!grid)return;const list=(methods||[]).filter(x=>x&&x.enabled!==false&&(String(x.id||'').toLowerCase()==='cod'||/cash\s*on\s*delivery/i.test(String(x.name_en||x.name_bn||x.name||'')))).sort((a,b)=>Number(a.sort_order||0)-Number(b.sort_order||0));if(!list.length){grid.innerHTML='<div class="payment-empty">'+esc(FALLBACK[LANG].unavailable)+'</div>';return}grid.innerHTML=list.map(m=>{const name=textFor(m,'name')||'Payment Method';const desc=textFor(m,'description');const note=textFor(m,'note');const logo=safeUrl(m.logo_url);return `<article class="payment-card"><div class="payment-icon-wrap">${logo?`<img class="payment-logo" src="${esc(logo)}" alt="${esc(name)}">`:`<div class="payment-icon-fallback">${esc(String(name).slice(0,2))}</div>`}</div><h2>${esc(name)}</h2><p>${esc(desc)}</p>${note?`<div class="payment-note"><strong>${esc(FALLBACK[LANG].important)}:</strong> ${esc(note)}</div>`:''}</article>`}).join('')}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
