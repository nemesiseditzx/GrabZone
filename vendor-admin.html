<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GrabZone Marketplace Admin</title><link rel="stylesheet" href="/vendor.css"></head><body><header class="gz-top"><div class="gz-logo">Grab<span>Zone</span> <small style="font-size:10px;color:#aaa;letter-spacing:1px">MARKETPLACE ADMIN</small></div><div class="gz-user"><span id="adminEmail"></span><button id="logout" class="gz-btn light">Main Admin</button></div></header><main class="gz-main"><div class="gz-head"><div><h1>Multi-Vendor Marketplace</h1><p>Super Admin control over vendors, sales, commissions and marketplace operations.</p></div><button class="gz-btn primary" onclick="openCreate()">+ Add Vendor</button></div><div class="gz-grid"><div class="gz-card gz-stat"><div class="label">Marketplace Sales</div><div id="sales" class="num">—</div></div><div class="gz-card gz-stat"><div class="label">Orders</div><div id="orders" class="num">—</div></div><div class="gz-card gz-stat"><div class="label">Commission</div><div id="commission" class="num">—</div></div><div class="gz-card gz-stat"><div class="label">Vendor Earnings</div><div id="earnings" class="num">—</div></div></div><div class="gz-card" style="margin-top:16px;overflow:auto"><table class="gz-table"><thead><tr><th>Brand</th><th>Status</th><th>Products</th><th>Orders</th><th>Sales</th><th>Commission</th><th>Earnings</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></main><div id="modal" class="gz-modal"><div class="gz-modal-box"><div class="gz-head"><h2 style="margin:0">Add Vendor</h2><button class="gz-btn light" onclick="closeModal()">Close</button></div><form id="form" class="gz-form"><div class="gz-two"><div class="gz-field"><label>Business Name</label><input id="business_name" required></div><div class="gz-field"><label>Brand Name</label><input id="brand_name" required></div></div><div class="gz-two"><div class="gz-field"><label>Email / Login</label><input id="email" type="email" required></div><div class="gz-field"><label>Initial Password</label><input id="password" type="password" minlength="8" required></div></div><div class="gz-two"><div class="gz-field"><label>Phone</label><input id="phone"></div><div class="gz-field"><label>Shipping Fee</label><input id="shipping_fee" type="number" min="0" value="130"></div></div><div class="gz-two"><div class="gz-field"><label>Commission Type</label><select id="commission_type"><option value="percentage">Percentage</option><option value="fixed">Fixed per vendor order</option></select></div><div class="gz-field"><label>Commission Value</label><input id="commission_value" type="number" min="0" value="10"></div></div><div class="gz-field"><label>Description</label><textarea id="description" rows="4"></textarea></div><div class="gz-two"><div class="gz-field"><label>Logo URL</label><input id="logo_url"></div><div class="gz-field"><label>Banner URL</label><input id="banner_url"></div></div><button class="gz-btn primary">Create Vendor</button></form></div></div><script>const $=s=>document.querySelector(s),money=n=>'৳'+Number(n||0).toLocaleString('en-BD',{maximumFractionDigits:2});async function api(p,o={}){const r=await fetch(p,{credentials:'include',...o,headers:{'Content-Type':'application/json',...(o.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}function openCreate(){$('#modal').classList.add('show')}function closeModal(){$('#modal').classList.remove('show')}async function load(){const a=await api('/api/admin-auth');if(!a.authenticated)location.href='/admin.html';$('#adminEmail').textContent=a.user?.email||'';const d=await api('/api/vendor/admin/overview');$('#sales').textContent=money(d.totals.sales);$('#orders').textContent=d.totals.orders;$('#commission').textContent=money(d.totals.commission);$('#earnings').textContent=money(d.totals.earnings);$('#rows').innerHTML=(d.vendors||[]).map(x=>`<tr><td><b>${x.brand_name}</b><div style="font-size:11px;color:#888">${x.slug}</div></td><td><span class="gz-pill ${x.status==='Active'?'active':'warn'}">${x.status}</span></td><td>${x.products||0}</td><td>${x.orders||0}</td><td>${money(x.sales)}</td><td>${money(x.commission)}</td><td>${money(x.earnings)}</td><td><a class="gz-btn light" href="/marketplace-vendor-control.html?vendor=${encodeURIComponent(x.id)}" style="text-decoration:none">Manage</a></td></tr>`).join('')||'<tr><td colspan="8">No vendors yet.</td></tr>'}$('#form').onsubmit=async e=>{e.preventDefault();const b={business_name:$('#business_name').value,brand_name:$('#brand_name').value,email:$('#email').value,password:$('#password').value,phone:$('#phone').value,shipping_fee:$('#shipping_fee').value,commission_type:$('#commission_type').value,commission_value:$('#commission_value').value,description:$('#description').value,logo_url:$('#logo_url').value,banner_url:$('#banner_url').value};try{await api('/api/vendor/admin/vendors',{method:'POST',body:JSON.stringify(b)});closeModal();e.target.reset();load()}catch(x){alert(x.message)}}}$('#logout').onclick=()=>location.href='/admin.html';load().catch(x=>{alert(x.message);location.href='/admin.html'});</script></body></html>
