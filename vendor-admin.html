<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GrabZone Marketplace Admin</title><link rel="stylesheet" href="/vendor.css"><script src="/marketplace-auth.js"></script><style>.tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tools a{display:inline-flex;text-decoration:none}.form-msg{margin-top:10px;padding:11px 12px;border-radius:11px;font-size:13px;font-weight:800;display:none}.form-msg.show{display:block}.form-msg.error{background:#fff1f1;color:#a11;border:1px solid #f0caca}.form-msg.ok{background:#f0fff4;color:#176b35;border:1px solid #bfe6ca}</style></head><body><header class="gz-top"><div class="gz-logo">Grab<span>Zone</span> <small style="font-size:10px;color:#aaa;letter-spacing:1px">MARKETPLACE ADMIN</small></div><div class="gz-user"><span id="adminEmail"></span><button id="logout" class="gz-btn light">Main Admin</button></div></header><main class="gz-main"><div class="gz-head"><div><h1>Multi-Vendor Marketplace</h1><p>Super Admin control over vendors, products, orders, sales, shipping and settings.</p></div><button class="gz-btn primary" id="addVendor">+ Add Vendor</button></div><div class="tools"><a class="gz-btn light" href="/marketplace-admin-orders.html">All Vendor Orders</a><a class="gz-btn light" href="/marketplace.html">Storefront</a><a class="gz-btn light" href="/admin.html">Main Admin</a></div><div id="pageMsg"></div><div class="gz-grid"><div class="gz-card gz-stat"><div class="label">Marketplace Sales</div><div id="sales" class="num">—</div></div><div class="gz-card gz-stat"><div class="label">Orders</div><div id="orders" class="num">—</div></div><div class="gz-card gz-stat"><div class="label">Commission</div><div id="commission" class="num">—</div></div><div class="gz-card gz-stat"><div class="label">Vendor Earnings</div><div id="earnings" class="num">—</div></div></div><div class="gz-card" style="margin-top:16px;overflow:auto"><table class="gz-table"><thead><tr><th>Brand</th><th>Status</th><th>Products</th><th>Orders</th><th>Sales</th><th>Commission</th><th>Earnings</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></main><script>
var $=function(s){return document.querySelector(s)};var money=function(n){return '৳'+Number(n||0).toLocaleString('en-BD',{maximumFractionDigits:2})};
async function api(p,o){o=o||{};o.credentials='include';o.cache='no-store';o.headers=Object.assign({'Content-Type':'application/json'},o.headers||{});var r=await fetch(p,o),d=await r.json().catch(function(){return {}});if(!r.ok)throw new Error(d.error||('Request failed ('+r.status+')'));return d}
function openCreate(){location.href='/vendor-create.html'}
async function load(){try{var a=await api('/api/admin-auth');if(!a.authenticated){location.href='/admin.html';return}$('#adminEmail').textContent=a.user&&a.user.email||'';var d=await api('/api/vendor/admin/overview');$('#sales').textContent=money(d.totals&&d.totals.sales);$('#orders').textContent=d.totals&&d.totals.orders||0;$('#commission').textContent=money(d.totals&&d.totals.commission);$('#earnings').textContent=money(d.totals&&d.totals.earnings);$('#rows').innerHTML=(d.vendors||[]).map(function(v){return '<tr><td><b>'+String(v.brand_name||v.business_name||v.slug)+'</b><div style="font-size:11px;color:#888">'+String(v.slug||'')+'</div></td><td>'+String(v.status||'')+'</td><td>'+Number(v.products||0)+'</td><td>'+Number(v.orders||0)+'</td><td>'+money(v.sales)+'</td><td>'+money(v.commission)+'</td><td>'+money(v.earnings)+'</td><td><a class="gz-btn light" href="/marketplace-vendor-control-fixed.html?vendor='+encodeURIComponent(v.slug||v.id)+'">Manage</a></td></tr>'}).join('')||'<tr><td colspan="8">No vendors yet.</td></tr>'}catch(e){$('#pageMsg').innerHTML='<div class="gz-card" style="margin-top:14px;color:#a11;font-weight:800">Marketplace failed to load: '+String(e.message||e)+'</div>'}}
$('#addVendor').onclick=openCreate;$('#logout').onclick=function(){location.href='/admin.html'};load();
</script></body></html>
